data:
  admin-ui.yaml: |-
    # Declare routers / services / middlewares
    http:
      routers:
        admin-ui:
          rule: Host(`apps.system-integration.telicent-sandbox.telicent.live`) && PathPrefix(`/admin`)
          service: admin-ui
          entryPoints:
            - web-app
          middleWares:
            - path-admin-ui
            - host-admin-ui
    
      services:
        admin-ui:
          loadBalancer:
            servers:
              - url: http://admin-ui.tc-core:8080
    
      middlewares:
        path-admin-ui:
          replacePathRegex:
            regex: "^/admin(.*)"
            replacement: "/admin/$1"
        host-admin-ui:
          headers:
            customRequestHeaders:
              host: admin-ui.tc-core:8080
    
  auth.yaml: |-
    # Declare routers / services / middlewares
    http:
      routers:
        auth-forward:
          rule: Host(`auth.system-integration.telicent-sandbox.telicent.live`) && PathPrefix(`/auth/forward`)
          priority: 9
          service: auth
          entryPoints:
            - web-auth
          middleWares:
            - host-auth
    
        auth-user-info:
          rule: Host(`auth.system-integration.telicent-sandbox.telicent.live`) && PathPrefix(`/userinfo`)
          priority: 8
          service: auth
          entryPoints:
            - web-auth
          middleWares:
            - host-auth
            - oauth2
    
        auth-admin:
          rule: Host(`auth.system-integration.telicent-sandbox.telicent.live`) && PathRegexp(`^/(sessions|groups|roles|permissions|users|clients)`)
          priority: 7
          service: auth
          entryPoints:
            - web-auth
          middleWares:
            - host-auth
            - oauth2
    
        auth-oidc:
          rule: Host(`auth.system-integration.telicent-sandbox.telicent.live`) && PathPrefix(`/.well-known`)
          priority: 6
          service: auth
          entryPoints:
            - web-auth
          middleWares:
            - host-auth
    
        auth-oauth2:
          rule: Host(`auth.system-integration.telicent-sandbox.telicent.live`) && PathRegexp(`^/(session|oauth2|login|logout|favicon\.svg|account-inactive|access-denied|error)`)
          priority: 5
          service: auth
          entryPoints:
            - web-auth
          middleWares:
            - host-auth
    
      services:
        auth:
          loadBalancer:
            servers:
              - url: http://auth.tc-core:8080
    
      middlewares:
        host-auth:
          headers:
            customRequestHeaders:
              host: auth.tc-core:8080
    
  cors-api.yaml: |-
    # Declare routers / services / middlewares
    http:
      routers:
        cors-api-options:
          rule: Host(`api.system-integration.telicent-sandbox.telicent.live`) && Method(`OPTIONS`)
          service: noop@internal
          priority: 999
          entryPoints:
