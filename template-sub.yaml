# Source: traefik-proxy/templates/configmap-startup.yaml
apiVersion: v1
kind: ConfigMap

metadata:
  name: tc-traefik-proxy-startup
  namespace: "tc-core"
  labels:
    helm.sh/chart: traefik-proxy-0.1.0
    app.kubernetes.io/name: traefik-proxy
    app.kubernetes.io/instance: traefik-proxy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "v3.6.1"
    app: traefik-proxy
    telicent.io/resource: "true"

data:
  config.yaml: |-
    entryPoints:
      web-app:
        address: ":8080/tcp"
        http:
          middlewares:
          - rate-limit-app@file
          - headers-security@file
    
      web-api:
        address: ":8081/tcp"
        http:
          middlewares:
          - rate-limit-api@file
          - cors@file
          - headers-security@file
          - oauth2@file
    
      web-auth:
        address: ":8082/tcp"
        http:
          middlewares:
          - rate-limit-auth@file
          - cors@file
          - headers-security@file
    
      ping:
        address: ":9000/tcp"
    
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    
    ping:
      entryPoint: ping
    
    providers:
      file:
        directory: "/app/config/routes"
        watch: false
    accessLog:
      format: common
    
    log:
      level: DEBUG
