    app.kubernetes.io/instance: traefik-proxy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "v3.6.1"
    app: traefik-proxy
    telicent.io/resource: "true"

spec:
  type: 
  selector:
    app.kubernetes.io/name: traefik-proxy
    app.kubernetes.io/instance: traefik-proxy
  ports:
  - name: http-app
    appProtocol: http
    protocol: TCP
    targetPort: http-app
    port: 8080

  - name: http-api
    appProtocol: http
    protocol: TCP
