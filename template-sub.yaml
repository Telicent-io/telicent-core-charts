  cors.yaml: |-
    # Declare routers / services / middlewares
    http:
      middlewares:
        cors:
          headers:
            # Set to true, determines whether the `Vary` header should be added or modified to
            # demonstrate that server responses can differ based on the value of the origin header.
            addVaryHeader: true
            # Cache preflight response for 24 hours (86400)
            accessControlMaxAge: "10"
            accessControlAllowMethods: [ GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS ]
            accessControlAllowHeaders: [ Authorization,Content-Type,Accept,X-Requested-With,Request-ID,Cache-Control,Cookie,pragma,expires ]
            # Disables credential support (incompatible with wildcard origin)
            accessControlAllowCredentials: true
            accessControlAllowOriginList:
            - https://auth.system-integration.telicent-sandbox.telicent.live
            - https://apps.system-integration.telicent-sandbox.telicent.live
            - http://localhost:3002
            - http://localhost:3001
            - http://localhost:5143
            - http://localhost:5173
