# Source: traefik-proxy/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: traefik-proxy
  namespace: "tc-core"
  labels:
    helm.sh/chart: traefik-proxy-0.1.0
    app.kubernetes.io/name: traefik-proxy
    app.kubernetes.io/instance: traefik-proxy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "v3.6.1"
    app: traefik-proxy
    telicent.io/resource: "true"

spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik-proxy
      app.kubernetes.io/instance: traefik-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik-proxy
        app.kubernetes.io/instance: traefik-proxy
      annotations:
        checksum/configRoutes: efb223e95ff6e64a0b2aafe08247b9e59db78f2960ee078cdf0503fb5f542be6
        checksum/configStartup: 528f6b1710b07023a75c47405c9fd7b4eb1604eaa0122b708028f44a9c5b63c8
        checksum/secretForward: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
        sidecar.istio.io/logLevel: rbac:debug

    spec:
      serviceAccountName: traefik-proxy
      securityContext:
        fsGroup: 185
        runAsGroup: 185
        runAsNonRoot: true
        runAsUser: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: traefik-proxy
        image: docker.io/traefik:v3.6.1
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 750m
            memory: 768Mi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 185
          runAsNonRoot: true
          runAsUser: 185
          seccompProfile:
            type: RuntimeDefault

        env:
        - name: X_FORWARD_AUTH
          valueFrom:
            secretKeyRef:
              key: header
              name: tc-auth-gen-forward-auth
        args:
        - --configFile=/app/config/config.yaml

        ports:
        # "app" HTTP listener
        - name: http-app
          protocol: TCP
          containerPort: 8080

        # "api" HTTP listener
        - name: http-api
          protocol: TCP
          containerPort: 8081

          # "auth" HTTP listener
        - name: http-auth
          protocol: TCP
          containerPort: 8082

        # "ping" HTTP
        - name: http-ping
          protocol: TCP
          containerPort: 9000

        readinessProbe:
          httpGet:
            path: /ping
            port: http-ping
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /ping
            port: http-ping
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 2

        volumeMounts:
        - name: traefik-config-volume
          mountPath: /app/config
          readOnly: true
        - name: traefik-routes-volume
          mountPath: /app/config/routes
          readOnly: true
      volumes:
      - name: traefik-config-volume
        configMap:
          name: tc-traefik-proxy-startup
      - name: traefik-routes-volume
        configMap:
          name: tc-traefik-proxy-routes
