name: Lint Helm Charts and Validate Metadata
run-name: Lint Helm Charts and Validate Metadata

on: pull_request

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: charts
      - name: Setup matrix
        id: setup-matrix
        shell: python
        run: |
          from pathlib import Path
          import json

          charts = []

          p = Path('charts')
          for file in p.rglob('Chart.yaml'):
              charts.append(file.parent.as_posix())

          matrix = { 'chart': charts }
          print(json.dumps(matrix, indent=4))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={json.dumps(matrix, separators=(',', ':'))}\n')

  lint-helm-charts:
    name: Lint Helm charts
    runs-on: ubuntu-latest
    needs: prepare
    strategy: 
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.prepare.outputs.matrix ) }}
    steps:
      - name: Lint charts
        id: build-and-push-dev-image
        uses: telicent-oss/shared-workflows/.github/actions/lint-helm-charts@main
        with:
          chart: ${{ matrix.chart }}

  values-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run metadata updater
        id: metadata-updater
        run: |
          python .dev/metadata-updater.py --ci
      - name: Check for uncommitted changes
        run: |
          has_diff=$(git diff || true)
          if [[ -z "$has_diff" ]]; then
            echo "✓ All documentation is up to date"
          else
            echo "[ERROR] ✗ README files and schemas are out of sync with values.yaml"
            echo "[ERROR] Please run '.dev/metadata-updater.sh' locally and commit the changes"
            git diff
            exit 1
          fi
