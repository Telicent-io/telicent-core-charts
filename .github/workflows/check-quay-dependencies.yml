name: Check Quay Dependencies
run-name: Check Quay Dependencies

# Verifies that every quay.io chart dependency pinned in a Chart.yaml actually
# exists in the registry at the version it is pinned to, and reports the result
# as a comment on the pull request.
#
# This catches dependency bumps that reference a version which was never
# published (or has since been deleted) before they reach main, where they would
# otherwise only fail at `helm dependency update` time.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - charts/**/Chart.yaml
      - .dev/quay-reference-check/**
      - .github/workflows/check-quay-dependencies.yml

permissions:
  contents: read
  # Post the result back to the pull request
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-quay-dependencies:
    name: Check quay.io chart dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Some of the charts live in private Quay repositories, so authenticate
      # before resolving - helm picks the credentials up from the docker config
      - name: Log in to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Always produce the report so the PR comment is written either way; the
      # verdict is carried in the `result` output and enforced by the final step.
      - name: Check chart dependencies
        id: check
        run: |
          set +e
          .dev/quay-reference-check/check-quay-charts.sh charts > report.md
          rc=$?
          set -e
          echo "result=${rc}" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: quay-dependency-check
          path: report.md

      - name: Fail if any dependency is missing
        if: steps.check.outputs.result != '0'
        run: |
          echo "One or more quay.io chart dependencies could not be resolved - see the report above." >&2
          exit 1
