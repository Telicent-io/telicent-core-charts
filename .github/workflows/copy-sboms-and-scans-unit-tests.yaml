name: Copy SBOMs and Vulnerability Scans to S3 - Unit Tests
run-name: Copy SBOMs and Vulnerability Scans to S3 - Unit Tests

on:
  push:
    branches-ignore:
      - 'main'
    paths:
      - '.dev/copy-sboms-and-scans/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            '.dev/copy-sboms-and-scans'
          sparse-checkout-cone-mode: false
      - name: Install Python packages
        run: |
          python -m pip install -r .dev/copy-sboms-and-scans/requirements.txt
        shell: bash
      - name: Run tests
        run: |
          python -m pytest -q .dev/copy-sboms-and-scans/tests
        shell: bash
