###############################################################################
# Note release-please-config.json should reflect the same number of packages as
# /configure/charts
###############################################################################
name: Create PRs for helm chart releases
on:
  workflow_dispatch:
  push:
    branches:
      - "main"

permissions:
  contents: write
  # Release please dependency
  pull-requests: write
  # Release please dependency? (attempts to fix: "You do not have permission to create labels on this repository" - PR write should be enough!)
  issues: write
  # AWS OIDC Dependency
  id-token: write

jobs:
  create-release-pr-or-tag-release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: googleapis/release-please-action@v4.3.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  publish:
    if: needs.create-release-pr-or-tag-release.outputs.releases_created == 'true'
    name: Publish Charts
    needs: create-release-pr-or-tag-release
    permissions:
      contents: write
      # Cosign keyless signing via Sigstore OIDC
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0
      - name: Install CoSign
        uses: sigstore/cosign-installer@v3
      - name: Package changed charts
        run: |
          helm repo add telicent-core-charts 'https://charts.telicent.io'
          helm dependency update ./charts/telicent-core
          helm dependency update ./charts/demo-prereqs/charts/kafka-ui
          helm dependency update ./charts/demo-prereqs/charts/opensearch
          for chart in $(find . -type f -name 'Chart.yaml' -print0 -maxdepth 3 | xargs -0 -n1 dirname | sort -u); do echo "packaging chart - $chart" && helm package -u -d .cr-release-packages $chart; done
      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-pages
          path: deploy
      - name: Index charts
        run: helm repo index .cr-release-packages --merge deploy/index.yaml
      - name: Copy packages to deployment directory
        run: |
          mkdir -p deploy/packages
          cp README.md deploy/
          cp .cr-release-packages/*.tgz deploy/
          cp .cr-release-packages/index.yaml deploy/
      - name: Set up Git
        working-directory: deploy
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Commit and push changes
        working-directory: deploy
        run: |
          git add -A
          git commit -m "Update Helm charts: $(ct list-changed --config .github/ct.yaml | tr , '\n')"
          git branch -a
          git push origin gh-pages
      - name: Push charts on Quay.io
        run: |
          registry_config="${HOME}/.docker/config.json"
          if [ ! -f "$registry_config" ]; then
            echo "docker registry config not found at $registry_config"
            exit 1
          fi
          refs_file="$RUNNER_TEMP/quay-chart-refs.txt"
          : > "$refs_file"
          for chart in .cr-release-packages/*.tgz; do
            echo "pushing $chart to oci://quay.io/telicent/charts/"
            if ! output=$(helm push --registry-config "$registry_config" "$chart" oci://quay.io/telicent/charts/ 2>&1); then
              echo "$output"
              exit 1
            fi
            echo "$output"
            pushed=$(echo "$output" | grep "^Pushed:" | awk '{print $2}')
            digest=$(echo "$output" | grep "^Digest:" | awk '{print $2}')
            if [ -z "$pushed" ] || [ -z "$digest" ]; then
              echo "failed to parse pushed reference or digest from helm output"
              exit 1
            fi
            printf '%s@%s\n' "$pushed" "$digest" >> "$refs_file"
          done
      - name: Sign charts on Quay.io
        run: |
          refs_file="$RUNNER_TEMP/quay-chart-refs.txt"
          if [ ! -s "$refs_file" ]; then
            echo "no pushed chart references found to sign"
            exit 1
          fi
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            echo "signing $ref"
            cosign sign --yes "$ref"
          done < "$refs_file"
