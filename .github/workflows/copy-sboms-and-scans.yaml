name: Copy SBOMs and Vulnerability Scans to S3
run-name: Copy SBOMs and Vulnerability Scans to S3

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      cluster:
        description: The EKS cluster to target
        required: true
        type: choice
        options:
          - devops-cluster
          - system-integration-cluster
          - system-release-cluster
        default: devops-cluster
      region:
        description: The AWS region of the EKS cluster. IF not provided, defaults to 'eu-west-2'
        required: false
        type: string
        default: eu-west-2
      s3-bucket:
        description: The S3 bucket to copy SBOMs to.
        required: true
        type: string
        default: dgtest-trivy-sbom-crd-to-s3
      customer:
        description: The customer to copy SBOM's and vulnerability reports for
        required: false
        type: string
        default: test
      role-override:
        description: The AWS role to assume instead of the one that will be automatically selected based on the cluster
        required: false
        type: string
        default: auto-select

env:
  AWS_DEFAULT_REGION: ${{ github.event.inputs.region || 'eu-west-2' }}
  AWS_ROLE: ${{ github.event.inputs.role-override || 'auto-select' }}
  CLUSTER: ${{ github.event.inputs.cluster || 'devops-cluster' }}
  CUSTOMER: ${{ github.event.inputs.customer || 'test' }}
  S3_BUCKET: ${{ github.event.inputs.s3-bucket || 'dgtest-trivy-sbom-crd-to-s3' }}
  RELEASE_PREFIX: 'chore(main): release telicent-core'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release-created }}
    steps:
      - name: Get release please PR info from commit message
        id: release
        run: |
          RELEASE_CREATED=${{ contains(github.event.head_commit.message, env.RELEASE_PREFIX) }} && \
          echo "release-created=$RELEASE_CREATED" >> $GITHUB_OUTPUT && echo "RELEASE_CREATED: $RELEASE_CREATED"

  copy-objects:
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.release-created == 'true' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            '.dev/copy-sboms-and-scans/**'
            'charts/telicent-core/**'
          sparse-checkout-cone-mode: false
      - name: Select AWS role based on cluster
        if: env.AWS_ROLE == 'auto-select'
        uses: thaitype/actions-switch-case@v1
        id: select-aws-role
        with:
          default: Invalid cluster selected
          conditionals-with-values: |
            ${{ env.CLUSTER == 'devops-cluster' }} => arn:aws:iam::228894611417:role/SBOMCopyRole
            ${{ env.CLUSTER == 'system-integration-cluster' }} => arn:aws:iam::228894611417:role/SBOMCopyRole
            ${{ env.CLUSTER == 'system-release-cluster' }} => arn:aws:iam::471112974740:role/SBOMCopyRole
      - name: Configure AWS credentials from main account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.select-aws-role.outputs.match || env.AWS_ROLE }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          mask-aws-account-id: false
      - name: Configure KubeConfig
        run: |
          mkdir -p $HOME/.kube
          aws eks update-kubeconfig --region ${{ env.AWS_DEFAULT_REGION }} --name ${{ env.CLUSTER }}
        shell: bash
      - name: Install Python packages
        run: |
          python -m pip install -r .dev/copy-sboms-and-scans/requirements.txt
        shell: bash
      - name: Copy SBOMs from Kubernetes to S3
        run: |
          python .dev/copy-sboms-and-scans/main.py --customer ${{ env.CUSTOMER }} --bucket ${{ env.S3_BUCKET }} --region ${{ env.AWS_DEFAULT_REGION }}
        shell: bash
