fullnameOverride: ""
nameOverride: ""

storageCapacity: "10G"
existingUserPwdSecretName: ""
pipelinePassword: ""
smartCachePassword: ""
externalPassword: ""

# External access configuration
externalAccess:
  enabled: false
  # External bootstrap hostname/IP - required for external clients to connect
  bootstrapHost: ""
  # Bootstrap LoadBalancer port (clients connect here first)
  bootstrapLoadBalancerPort: 9094
  # Broker LoadBalancer port (must be different from bootstrap)
  brokerLoadBalancerPort: 9095
  # TLS configuration for external listener
  tls: false

topics: []
