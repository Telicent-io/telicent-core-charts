fullnameOverride: ""
nameOverride: ""

storageCapacity: "10G"
existingUserPwdSecretName: ""
pipelinePassword: ""
smartCachePassword: ""
externalPassword: ""

# External access configuration
externalAccess:
  enabled: false
  # External bootstrap hostname/IP - required for external clients to connect
  bootstrapHost: ""
  # Bootstrap NodePort (must be in range 30000-32767)
  bootstrapNodePort: 30092
  # Broker NodePort (must be different from bootstrap, range 30000-32767)
  brokerNodePort: 30093
  # TLS configuration for external listener
  tls: false

topics: []
