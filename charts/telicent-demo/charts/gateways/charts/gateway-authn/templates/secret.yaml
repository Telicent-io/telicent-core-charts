{{- if not .Values.tlsCredentialName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway-authn.tlsCredentialName" . }}
  labels:
    {{- include "gateway-authn.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.crt | b64enc }}
  tls.key: {{ .Values.tls.key | b64enc }}
{{- end }}
