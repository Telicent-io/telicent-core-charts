apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "demo-prereqs-postgres.fullname" . }}
  labels:
  {{- include "demo-prereqs-postgres.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - {{ include "demo-prereqs-postgres.authPrincipal" . }}
        - {{ include "demo-prereqs-postgres.userPreferencesPrincipal" . }}
    to:
    - operation:
        ports:
        - "{{ .Values.service.port }}"
  selector:
    matchLabels:
      {{- include "demo-prereqs-postgres.selectorLabels" . | nindent 6 }}
