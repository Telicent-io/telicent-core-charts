# Default values for demo-prereqs-postgres.
# Simple PostgreSQL deployment for demo/development purposes.

# @section Image
# @descStart
# PostgreSQL image configuration
# @descEnd
image:
  # @key image.repository PostgreSQL image repository
  repository: postgres
  # @key image.pullPolicy Image pull policy
  pullPolicy: IfNotPresent
  # @key image.tag Overrides the image tag whose default is the chart appVersion.
  tag: ""

# @key imagePullSecrets Specify registry secret names as an array
imagePullSecrets: []
# @key nameOverride Override the name of the chart
nameOverride: ""
# @key fullnameOverride Override the full name of the chart
fullnameOverride: ""

# @section PostgreSQL
# @descStart
# PostgreSQL configuration
# @descEnd
postgres:
  # @key postgres.database Database name to create
  database: postgres
  # @key postgres.user Username (superuser)
  user: postgres
  # @key postgres.password Password for the user (required)
  password: postgres
  # @key postgres.extraEnv Additional PostgreSQL configuration parameters
  # These are passed as environment variables
  extraEnv: []
  #   - name: POSTGRES_INITDB_ARGS
  #     value: "--encoding=UTF8"

# @section Persistence
# @descStart
# Persistence configuration
# @descEnd
persistence:
  # @key persistence.enabled Enable persistence using Persistent Volume Claims
  enabled: true
  # @key persistence.storageClass Storage class - leave empty for default
  storageClass: ""
  # @key persistence.accessMode Access mode
  accessMode: ReadWriteOnce
  # @key persistence.size Size of the persistent volume
  size: 1Gi
  # @key persistence.annotations Annotations for the PVC
  annotations: {}

# @section Service
# @descStart
# Service configuration
# @descEnd
service:
  # @key service.type Service type
  type: ClusterIP
  # @key service.port Service port
  port: 5432

# @section Service Account
# @descStart
# Service account configuration
# @descEnd
serviceAccount:
  # @key serviceAccount.create Create a ServiceAccount
  create: false
  # @key serviceAccount.automount Automount service account token
  automount: true
  # @key serviceAccount.annotations Annotations for the ServiceAccount
  annotations: {}
  # @key serviceAccount.name Name of the ServiceAccount
  name: ""

# @key podAnnotations Pod annotations and labels
podAnnotations: {}

# @key podLabels Pod labels
podLabels: {}

# @key podSecurityContext Security context for the pod
podSecurityContext: {}
  # fsGroup: 999

# @key securityContext Security context for the container
securityContext: {}
  # runAsUser: 999
  # runAsGroup: 999

# @key resources Resource limits and requests
resources: {}
  # For demo purposes, you might want to set minimal resources:
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

# @key nodeSelector Node selector
nodeSelector: {}

# @key tolerations Tolerations
tolerations: []

# @key affinity Affinity rules
affinity: {}

# @section Auth
# @descStart
# Authentication configuration for Istio AuthorizationPolicy
# @descEnd
auth:
  # @key auth.enabled Enable Istio AuthorizationPolicy for PostgreSQL connections
  enabled: true
  # @key auth.namespace Namespace of the service account allowed to connect
  namespace: tc-core-dev
  # @key auth.serviceAccountName Service account name allowed to connect to PostgreSQL
  serviceAccountName: telicent-core-auth
