{{- if and (.Values.enabled) (.Values.serviceAccount.create) -}}
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ include "data-preparation.serviceAccountName" . }}
  namespace: {{ include "data-preparation.namespace" . | quote }}
  labels:
    {{- include "data-preparation.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
