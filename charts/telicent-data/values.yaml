      tag: "0.9.1"
      # @key image.pullPolicy Access image pull policy
      pullPolicy: IfNotPresent
      # @key image.pullSecrets Specify registry secret names as an array
      pullSecrets: []

    imagePullSecrets: []
    nameOverride: ""
    fullnameOverride: ""

    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""

    podAnnotations: {}
    podLabels: {}

    podSecurityContext: {}
    securityContext: {}

    # Job-specific configuration
    restartPolicy: Never
    command: []
    args: []
    env: {}
    envFrom: []

    # Job spec configuration
    job:
      backoffLimit: 3
      activeDeadlineSeconds: null
      completions: 1
      parallelism: 1
      ttlSecondsAfterFinished: null

    service:
      type: ClusterIP
      port: 80

    resources: {}

    livenessProbe:
      httpGet:
        path: /
        port: http
    readinessProbe:
      httpGet:
        path: /
        port: http

    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80

