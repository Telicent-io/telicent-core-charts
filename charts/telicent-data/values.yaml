# Telicent Data stand-alone chart

# @section Global Parameters
# @descStart
# Contains global parameters. Not explicitly used in this chart, added to maintain consistency across Telicent charts.
# These parameters can be referenced in sub-charts as `.Values.global.<parameter-name>`.
# @descEnd

global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - registryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.enterprise Enable enterprise mode, adding additional features and configurations
  enterprise: false

  # @key global.appHostDomain Domain associated with Telicent application services. This value cannot be changed after it is set
  appHostDomain: ""
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers. This value cannot be changed after it is set
  authHostDomain: ""
  # @key global.groupsClaim Key used to retrieve groups from the OIDC provider
  groupsClaim: "groups"
  # @key global.jwksUrl Endpoint exposing multiple public keys represented as JWKs (JSON Web Key Set)
  # Note: For Dex the endpoint would be https://{yourDexDomain}/keys
  jwksUrl: "https://{yourAuthdomain}/.well-known/jwks.json"

  # @key global.istioNamespace Namespace in which Istio is deployed
  # Note: By default, Istio namespace is set to 'istio-system'
  istioNamespace: istio-system
  # @key global.istioServiceAccountName Name of the Istio service account
  istioServiceAccountName: istio-ingress
  # @key global.istioGatewayName Name of the Istio Gateway Resource (LB operating at the edge of the mesh)
  istioGatewayName: ingress-gateway

  # @section Kafka Parameters
  kafka:
    # @key global.kafka.bootstrapServers Comma separated list containing Kafka bootstrap servers
    bootstrapServers: "kafka-bootstrap.kafka.svc.cluster.local:9092"
    # @key global.kafka.existingConfigSecretName Name of an existing secret containing Kafka configuration (preferred over individual settings below for security)
    existingConfigSecretName: ""
    # @key global.kafka.username Username for Kafka authentication
    username: "your.kafka.username.here"
    # @key global.kafka.password Password for Kafka authentication
    password: "your.kafka.password.here"
    # @key global.kafka.protocol Protocol used for Kafka communication
    protocol: "SASL_SSL"
    # @key global.kafka.mechanism SASL mechanism used for Kafka authentication
    mechanism: "SCRAM-SHA-512"

  truststore:
    # @key global.truststore.existingSecret Name of an existing secret containing the truststore
    existingSecret: ""
    # @key global.truststore.mountPath The mount path for the truststore in the container
    mountPath: /app/config/truststore

## ACLED mappers
##
# The ACLED mappers (`acled-locations-mapper`, `acled-participants-mapper` and
# `acled-validation-mapper`) are gated on `global.enterprise` by default. Each one also
# accepts its own `enabled` toggle which, when set, takes precedence over
# `global.enterprise` for that chart:
#
#   --set acled-locations-mapper.enabled=false   # off, even with enterprise enabled
#   --set acled-locations-mapper.enabled=true    # on, even without enterprise enabled
#
# The toggles are deliberately absent from this file rather than defaulted here. Helm
# resolves a dependency's comma-separated condition to the *first* path present in the
# values, so setting them here would permanently shadow the `global.enterprise` fallback
# declared in Chart.yaml. For the same reason those conditions must not contain a space
# after the comma - Helm trims the condition string as a whole and not each element, so
# ` global.enterprise` would never resolve.
##

# @section Kafka Topics Parameters
kafkaTopics:
  # @key kafkaTopics.enabled Enable or disable the creation of Kafka topics during installation
  enabled: false
  # @key kafkaTopics.topics List of Kafka topics to be created
  topics: []
