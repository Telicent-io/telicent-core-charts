{{- if not .Values.tls.existingCredentialName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway-apps.tlsCredentialName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gateway-apps.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.crt | b64enc }}
  tls.key: {{ .Values.tls.key | b64enc }}
{{- end }}
