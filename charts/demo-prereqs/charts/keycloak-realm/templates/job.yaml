apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "keycloak-realm.fullname" . }}
  labels:
    {{- include "keycloak-realm.labels" . | nindent 4 }}
    {{- with .Values.job.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.job.useHelmHooks }}
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
    {{- with .Values.job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  {{- with .Values.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .Values.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/realms: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "keycloak-realm.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: {{ .Values.job.restartPolicy }}
      serviceAccountName: {{ include "keycloak-realm.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keycloak-config-cli
          image: "{{ .Values.image.repository }}:{{ include "keycloak-realm.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: KEYCLOAK_LOGINREALM
              value: {{ .Values.keycloak.loginRealm | quote }}
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak-realm.envSecretName" . | quote }}
                  key: {{ .Values.keycloak.usernameKey | quote }}
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak-realm.envSecretName" . | quote }}
                  key: {{ .Values.keycloak.passwordKey | quote }}
            - name: IMPORT_FILES_LOCATIONS
              value: "/config/*.json"
            - name: IMPORT_VALIDATE
              value: {{ .Values.configCli.importValidate | quote }}
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: {{ .Values.configCli.varSubstitution | quote }}
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: {{ .Values.configCli.availabilityCheck.enabled | quote }}
            {{- if .Values.configCli.availabilityCheck.enabled }}
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: {{ .Values.configCli.availabilityCheck.timeout | quote }}
            {{- end }}
            {{- with .Values.configCli.logLevel }}
            - name: LOGGING_LEVEL_KEYCLOAKCONFIGCLI
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.configCli.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: realms
              mountPath: /config
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: realms
          configMap:
            name: {{ include "keycloak-realm.fullname" . }}-realms
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
