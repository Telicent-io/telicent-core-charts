apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak-realm.fullname" . }}-realms
  labels:
    {{- include "keycloak-realm.labels" . | nindent 4 }}
  {{- if .Values.job.useHelmHooks }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
data:
  {{- $files := .Files.Glob "realms/*.json" }}
  {{- $valueRealms := .Values.realms | default dict }}
  {{- if and (not $files) (not $valueRealms) }}
  {{- fail "No realms found: add files under realms/*.json or define .Values.realms" }}
  {{- end }}
  {{- /* File-based realms; skipped when a value-defined realm of the same name overrides it. */}}
  {{- range $path, $_ := $files }}
  {{- if not (hasKey $valueRealms (base $path)) }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
  {{- end }}
  {{- /* Value-defined realms; these clobber any file-based realm of the same name. */}}
  {{- range $name, $content := $valueRealms }}
  {{ $name }}: |-
{{ $content | indent 4 }}
  {{- end }}
