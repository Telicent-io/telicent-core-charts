apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ include "kafka.fullname" . }}
  namespace: {{ include "kafka.namespace" . }}
  labels:
  {{- include "kafka.labels" . | nindent 4 }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Chart.AppVersion }}
    # KRaft metadata version must be supported by Kafka version
    metadataVersion: 3.9-IV0
    authorization:
      type: simple
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: "scram-sha-512"
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: "scram-sha-512"
      {{- if .Values.externalAccess.enabled }}
      - name: external
        port: 9094
        type: nodeport
        tls: {{ .Values.externalAccess.tls }}
        authentication:
          type: "scram-sha-512"
        configuration:
          bootstrap:
            nodePort: {{ .Values.externalAccess.bootstrapNodePort }}
            advertisedHost: {{ .Values.externalAccess.bootstrapHost }}
          brokers:
            - broker: 0
              nodePort: {{ .Values.externalAccess.brokerNodePort }}
              advertisedHost: {{ .Values.externalAccess.bootstrapHost }}
      {{- end }}
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator:
      watchedNamespace: {{ .Release.Namespace }}
    userOperator:
      watchedNamespace: {{ .Release.Namespace }}

