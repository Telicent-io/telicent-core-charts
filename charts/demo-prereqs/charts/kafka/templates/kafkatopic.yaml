{{- range $topic := .Values.topics -}}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ $topic.name }}
  namespace: {{ include "kafka.namespace" $ }}
  labels:
    {{- include "kafka.labels" $ | nindent 4 }}
    strimzi.io/cluster: {{ include "kafka.fullname" $ }}
spec:
  partitions: {{ $topic.partitions | default 1 }}
  replicas: {{ $topic.replicas | default 1 }}
  config:
    retention.ms: {{ $topic.retentionMs | default -1 }}
    retention.bytes: {{ $topic.retentionBytes | default -1 }}
{{ end }}
