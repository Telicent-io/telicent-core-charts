{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "demo-prereqs-postgres.fullname" . }}
  labels:
    {{- include "demo-prereqs-postgres.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgres.password | b64enc | quote }}
{{- end }}
