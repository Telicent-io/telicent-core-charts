apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "kafka-ui-deps.gatewayName" . }}
  namespace: {{ .Values.istioNamespace }}
  labels:
    {{- include "kafka-ui-deps.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts:
              - {{ .Values.host }}
              - {{ .Values.host }}:*
            paths:
              - "/*"
              - "/"
  selector:
    matchLabels:
      {{- .Values.ingress.selectors | toYaml | nindent 6 }}
