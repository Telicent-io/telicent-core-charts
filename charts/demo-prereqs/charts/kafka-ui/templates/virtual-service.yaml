apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "kafka-ui-deps.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-ui-deps.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.host }}
  gateways:
    - {{ .Values.istioNamespace }}/{{ include "kafka-ui-deps.gatewayName" . }}
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ include "kafka-ui-deps.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.ingress.port }}