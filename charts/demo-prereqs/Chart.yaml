apiVersion: v2
name: demo-prereqs
description: |
  Telicent demo cluster prerequisites. This chart is used to install all of the
  required dependencies for the Telicent demo cluster.

type: application

version: 0.1.5

appVersion: "0.1.0"

dependencies:
  - name: gateways
    version: "^0.x"
    repository: file://./charts/gateways
    condition: gateways.enabled
  - name: kafka
    version: "^0.x"
    repository: file://./charts/kafka
    condition: kafka.enabled
  - name: kafka-ui
    version: "^0.x"
    repository: file://./charts/kafka-ui
    condition: kafka-ui.enabled
  - name: keycloak
    version: "^0.x"
    repository: file://./charts/keycloak
    condition: keycloak.enabled
  - name: opensearch
    version: "^0.x"
    repository: file://./charts/opensearch
    condition: opensearch.enabled
  - name: postgres
    version: "^0.x"
    repository: file://./charts/postgres
    condition: postgres.enabled

icon: "https://avatars.githubusercontent.com/u/65304240?s=200&v=4"

# The name of the chart's maintainers.
maintainers:
  - name: Telicent
    url: https://github.com/Telicent-IO
