# Telicent *Auth* stand-alone chart

#
# @section Global Parameters
#
# @descStart
# Contains global parameters; these parameters are mirrored within the Telicent core umbrella chart.
# Note: Only global parameters used within this chart will be listed below.
# @descEnd
global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.releaseNameTelicentPreview Release name used during the Telicent Preview chart installation. Note: ensure the value is correct, otherwise there will be no access to data-catalog, user-portal & paperback-writer
  # If installed through the parent-chart this value needs to reflect the name of the release name used when 'telicent-preview' chart was installed.
  # If all applications were installed through sub-charts, leaving this value empty will provide the correct behavior.
  releaseNameTelicentPreview: ""

  # @key global.enterprise Enable enterprise mode, adding additional features and configurations
  enterprise: false

  # @key global.appHostDomain Domain associated with Telicent application/ui services. This value cannot be changed after it is set
  appHostDomain: ""
  # @key global.apiHostDomain Domain associated with Telicent Api services. This value cannot be changed after it is set
  apiHostDomain: ""
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers. This value cannot be changed after it is set
  authHostDomain: ""

  truststore:
    # @key global.truststore.existingSecret Name of an existing secret containing the truststore
    existingSecret: ""
    # @key global.truststore.mountPath The mount path for the truststore in the container
    mountPath: /app/config/truststore

#
# @section Application Parameters - Identity Provider (IDP) and Secret
#
# @descStart
# Contains details pertinent to the OIDC Identity Provider to be used by the *Auth* OAuth application.
# It is recommended to store sensitive information including passwords in a Kubernetes secret and not in Helm values.
# For Quick Start purposes, a secret named `tc-auth-gen-idp-auth` will be created if one is not set.
# @descEnd
idp:
  # @key idp.issuerUrl The OpenID Connect issuer URL
  issuerUrl: ""
  # @key idp.authorizationPath The path to use in combination with the issuer URL for authorization
  authorizationPath: "/auth"
  # @key idp.jwksPath The path to use in combination with the issuer URL for JWKS
  jwksPath: "/keys"
  # @key idp.tokenPath The path to use in combination with the issuer URL for generating tokens
  tokenPath: "/token"
  # @key idp.userinfoPath The path to use in combination with the issuer URL for userinfo
  userinfoPath: "/userinfo"

  # @key idp.cookieParentDomain Cookie domain scope
  cookieParentDomain: ".telicent.io"
  # @key idp.cookieSecure Enable secure cookies
  cookieSecure: true

  # @key idp.superUserIdentifier Super user identification, set to 'ALL' to allow for everyone to be a superuser
  superUserIdentifier: "ALL"

  # @key idp.clientName The OAuth Client Name (used for display)
  clientName: ""
  # @key idp.usernameClaim The OIDC claim containing the attribute to be used as the username
  usernameClaim: "sub"

  # @key idp.existingSecret Name of an existing secret. The secret must contain 2 keys: 'clientid', 'clientsecret'
  # Note: Left unset, it will create a secret named: tc-auth-gen-idp-auth
  existingSecret: ""
  # @key idp.clientId The OAuth Client ID
  clientId: ""
  # @key idp.clientSecret The OAuth Client Secret
  clientSecret: ""

  # @key idp.sessionTtl Default session time-to-live duration (in hours)
  sessionTtl: PT2H
  # @key idp.sessionIdleTtl Default session idle time-to-live duration (in minutes)
  sessionIdleTtl: PT30M

  # @key idp.clientRefreshTokenTtl Client refresh token time-to-live duration (in hours). Total time will not exceed idp.sessionTtl even if this value is higher
  clientRefreshTokenTtl: PT2H
  # @key idp.clientAccessTokenTtl Client access token time-to-live duration (in minutes)
  clientAccessTokenTtl: PT15M

#
# @section Application Parameters - ForwardAuth and Secret
#
# @descStart
# When making requests to the `/auth/forward` endpoint (used by reverse proxies), `X-ForwardAuth-Secret` header is required.
# The secret associated with that header is defined within this section.
# It is recommended to store sensitive information including passwords in a Kubernetes secret and not in Helm values.
# For Quick Start purposes, a secret named `tc-auth-gen-forward-auth` will be created if one is not set.
# @descEnd
forwardAuth:
  # @key forwardAuth.existingSecret Name of an existing secret. The secret must contain 1 key: 'header'
  # Note: Left unset, it will create a secret named: tc-auth-gen-forward-auth
  existingSecret: ""
  # @key forwardAuth.header The header value to be associated with the `X-ForwardAuth-Secret`
  header: ""

#
# @section Application Parameters - Java
#
# @descStart
# Contains Java parameters to be used by the *Auth* application
# @descEnd
java:
  # @key java.jvmOptions JVM options for the application
  jvmOptions: "-XX:MaxRAMPercentage=80.0"

  spring:
    # @key java.spring.profile Sets the Spring profile to be used. Options are: default, docker, test, and production
    profile: production

#
# @section Application Parameters - Logs
#
logs:
  api:
    # @key logs.api.level Api package Logging Level. Values include: ERROR, WARN, INFO, DEBUG, TRACE
    level: "INFO"
  service:
    # @key logs.service.level Service package Logging Level. Values include: ERROR, WARN, INFO, DEBUG, TRACE
    level: "INFO"
  repo:
    # @key logs.repo.level Repo package Logging Level. Values include: ERROR, WARN, INFO, DEBUG, TRACE
    level: "WARN"
  security:
    # @key logs.security.level Security packageLogging Level. Values include: ERROR, WARN, INFO, DEBUG, TRACE
    level: "WARN"
  oauth2:
    # @key logs.oauth2.level Oauth2 package Logging Level. Values include: ERROR, WARN, INFO, DEBUG, TRACE
    level: "WARN"
  general:
    # @key logs.general.level Logging Level for 'io.telicent.auth'. Values include: ERROR, WARN, INFO, DEBUG, TRACE
    level: "INFO"
  trace:
    # @key logs.trace.level Logging Level for 'Spring RestTemplate'. Values include: ERROR, WARN, INFO, DEBUG, TRACE
    level: "ERROR"

#
# @section Application Parameters - PostgreSQL and Secret
#
# @descStart
# The following contains connection details to a PostgreSQL instance, on which the application relies.
# It is recommended to store sensitive information including passwords in a Kubernetes secret and not in Helm values.
# For Quick Start purposes, a secret named `tc-auth-usr-psql-auth` will be created if one is not set.
# @descEnd
postgresSql:
  # @key postgresSql.uri PostgreSQL connection URI
  uri: ""
  # @key postgresSql.existingSecret Name of an existing secret. The secret must contain 2 keys: 'username', 'password'
  # Note: Left unset, it will create a secret named: tc-auth-usr-psql-auth
  existingSecret: ""
  # @key postgresSql.username PostgreSQL username
  # Note: For additional security, the username is read from the secret, as defined by 'existingSecret' and not from this value!
  username: ""
  # @key postgresSql.password PostgreSQL password
  password: ""

#
# @section Application Parameters - Bootstrap
#
# @descStart
# Contains configuration to be used to bootstrap a clean instance of the Auth application to a working state.
# @descEnd

bootstrap:
  clients:
    # @key bootstrap.clients.existingConfigMap Name of an existing config map resource containing all required public and confidential clients. If specified, the values for clients.public and clients.confidential will be ignored
    existingConfigMap: ""
    # @key bootstrap.clients.public A list of public client objects
    public: []
    # - client_id: spa-client
    #   redirect_uris:
    #     - http://spa.telicent.localhost/callback.html
    #   post_logout_redirect_uris:
    #     - http://spa.telicent.localhost/
    # @key bootstrap.clients.confidential A list of confidential client objects
    confidential: []
    # - client_id: client-1
    #   client_name: 'Secret Client'
    #   client_secret: password-1
    #   client_authentication_method: client_secret_post
    #   scope: write
    # To avoid embedding a secret in values, use client_secret_env_var_name instead of client_secret.
    # The application will read the secret from the named environment variable at runtime.
    # Supply the variable via extraEnvVars using a secretKeyRef (see extraEnvVars below).
    # - client_id: client-1
    #   client_name: 'Secret Client'
    #   client_secret_env_var_name: CLIENT_1_SECRET
    #   client_authentication_method: client_secret_post
    #   scope: write

  groups:
    # @key bootstrap.groups.existingConfigMap Name of an existing config map containing a list of group objects
    existingConfigMap: ""
    # @key bootstrap.groups.list  A list containing group objects
    list: []
    # Description of each field:
    # name       : Human readable name of the group for admins to identify it by
    # urn        : Unique identifier for representing the groups
    # description: String explaining the groups useage and applicability.
    # Example:
    # list:
    # - name: admin
    #   urn: urn:telicent:groups:admin
    #   description: 'Administrator group'

#
# @section ConfigMap Parameters
#
configMap:
  # @key configMap.existingEnvConfigMap Name of existing configmap containing *Auth* Environment Configuration
  # Note: When it's set, it will disable configmap creation.
  existingEnvConfigMap: ""

#
# @section Common Parameters
#
# @key nameOverride String to partially override fullname (will maintain the release name)
nameOverride: ""
# @key fullnameOverride String to fully override the generated release name
fullnameOverride: ""
# @key namespaceOverride String to fully override all deployed resources namespace
namespaceOverride: ""
# @key commonLabels Add labels to all the deployed resources
commonLabels: {}

#
# @section Deployment Parameters
#
# @key replicas Number of *Auth* replicas to deploy
replicas: 1
# @key revisionHistoryLimit Number of controller revisions to keep
revisionHistoryLimit: 5

# @key annotations Add extra annotations to the deployment object
annotations: {}
# @key podLabels Add extra labels to the *Auth* pod
podLabels: {}
# @key podAnnotations Add extra annotations to the *Auth* pod
podAnnotations: {}
# @key extraEnvVars Array with extra environment variables to add to *Auth* pod
# Supports both plain values and valueFrom (e.g. secretKeyRef) for injecting secret values.
# Use valueFrom.secretKeyRef to supply a confidential client secret referenced by client_secret_env_var_name.
# Example:
# extraEnvVars:
# - name: FOO
#   value: instance
# - name: CLIENT_1_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: my-k8s-secret
#       key: client_secret
extraEnvVars: []
# @key extraVolumes Optionally specify extra list of additional volumes
extraVolumes: []
# @key extraVolumeMounts Optionally specify extra list of additional volumeMounts
extraVolumeMounts: []
# @key initContainers Add init containers to the pod
initContainers: []
# Example:
# sidecars:
# - name: your-image-name
#   image: your-image
#   ports:
#   - name: portname
#     containerPort: 1234
# @key sidecars Add sidecars to the pod
sidecars: []

#
# @section Deployment Image Parameters
#
image:
  # @key image.registry *Auth* image registry
  registry: quay.io
  # @key image.repository *Auth* image name
  repository: telicent/telicent-auth-server
  # @key image.tag *Auth* image tag. If not set, a tag is generated using the appVersion
  tag: ""
  # @key image.pullPolicy *Auth* image pull policy
  pullPolicy: IfNotPresent
  # @key image.pullSecrets Specify registry secret names as an array
  pullSecrets: []

#
# @section Deployment Resources Parameters - Requests and Limits
#
# @key resources Resources for *Auth* containers
resources: {}
#  requests:
#    # @key resources.requests.cpu Set containers' CPU request
#    cpu: "700m"
#    # @key resources.requests.memory Set containers' memory request
#    memory: "1024Mi"
#  limits:
#    # @key resources.limits.cpu Set containers' CPU limit
#    cpu: "1500m"
#    # @key resources.limits.memory Set containers' memory limit
#    memory: "2048Mi"

#
# @section Deployment Security Context Parameters - Default Security Context
#
podSecurityContext:
  # @key podSecurityContext.runAsUser Set the provisioning pod's Security Context runAsUser User ID
  runAsUser: 185
  # @key podSecurityContext.runAsGroup Set the provisioning pod's Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key podSecurityContext.runAsNonRoot Set the provisioning pod's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key podSecurityContext.fsGroup Set the provisioning pod's Group ID for the mounted volumes' filesystem
  fsGroup: 185
  seccompProfile:
    # @key podSecurityContext.seccompProfile.type Set the provisioning pod's Security Context seccomp profile
    type: RuntimeDefault
containerSecurityContext:
  # @key containerSecurityContext.runAsUser Set containers' Security Context runAsUser User ID
  runAsUser: 185
  # @key containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
  allowPrivilegeEscalation: false
  capabilities:
    # @key containerSecurityContext.capabilities.drop List of capabilities to be dropped
    drop:
      - ALL
  seccompProfile:
    # @key containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
    type: RuntimeDefault

#
# @section Deployment Affinity Parameters
#
# @key affinity Affinity for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
affinity: {}
# @key nodeSelector Node labels for pod assignment
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
nodeSelector: {}
# @key tolerations Tolerations for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

#
# @section Service Account Parameters
#
serviceAccount:
  # @key serviceAccount.create Specifies whether a service account should be created
  create: true
  # @key serviceAccount.name Name of the ServiceAccount to use. If not set, a name is generated using the fullname
  name: ""
  # @key serviceAccount.annotations Additional custom annotations for the ServiceAccount
  annotations: {}
  # @key serviceAccount.automount Automatically mount a ServiceAccount's API credentials
  automount: true

#
# @section Traffic Exposure Parameters
#
service:
  # @key service.name *Auth* service name. If not set, a name is generated using the fullname
  name: ""
  # @key service.port *Auth* service port
  port: 8080
  # @key service.type *Auth* service port
  type: ClusterIP

#
# @section Host(s) Parameters - Contains host information for applications deployed via *telicent-core* chart.
#
# @descStart
# *Auth* interacts directly with other Telicent Applications using their default service/serviceAccount and port.
# If either of those details changes, you can use this section to correctly refer to those applications.
# @descEnd
hosts:
  # @key hosts.enableAutoCorrect Allow for the release name to be automatically pre-fixed to each host value when required (default behavior when installing through the parent chart). Alternatively, the host value will be used as it is, without any modification
  enableAutoCorrect: true
  # @key hosts.traefikProxy Traefik Proxy application default host value, as defined by 'service/serviceAccount:port'
  traefikProxy: "traefik-proxy:8080"
  # @key hosts.userPreferences User Preferences host value, If not set a host is generated using service:'user-preferences',port:'8080' and Release namespace & name
  userPreferences: "user-preferences:8080"
  # @key hosts.search Search application default host value, as defined by 'service/serviceAccount:port'
  search: "search:8080"
  # @key hosts.graph Graph application default host value, as defined by 'service/serviceAccount:port'
  graph: "graph:8080"

#
# @section Host(s) Preview Parameters - Contains host information for applications deployed via *telicent-preview* chart
#
# @descStart
# Host values will be used as defined in this section, release name cannot be autocorrected, as the release name is unknown.
# @descEnd
hostsPreview:
  # @key hostsPreview.enableAutoCorrect Prefix 'global.releaseNameTelicentPreview' value to each host value. Alternatively, the host value will be used as it is, without any modification
  enableAutoCorrect: true
  # @key hostsPreview.paperbackWriter Paperback Writer application host value, as defined by 'service/serviceAccount:port'
  paperbackWriter: "paperback-writer:8080"
  # @key hostsPreview.aiSparqlBuilder AI SPARQL Builder application host value, as defined by 'service/serviceAccount:port'
  aiSparqlBuilder: "ai-sparql-builder:8080"
  # @key hostsPreview.notifications Notifications application host value, as defined by 'service/serviceAccount:port'
  notifications: "notifications:8080"
  # @key hostsPreview.apicurio Apicurio application host value, as defined by 'service/serviceAccount:port'
  apicurio: "apicurio:8080"
