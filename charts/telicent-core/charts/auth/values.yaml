# Telicent Auth stand-alone chart

# @section Global Parameters
# @descStart
# Contains global parameters, these parameters are mirrored within the Telicent core umbrella chart
# @descEnd

global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry:
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.enterprise Enable enterprise mode, adding additional features and configurations
  enterprise: false

  # @key global.appHostDomain Domain associated with Telicent application services
  appHostDomain: "apps.telicent.io"
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers
  authHostDomain: "auth.telicent.io"
  # @key global.groupsClaim Key used to retrieve groups from the OIDC provider
  groupsClaim: "groups"

  # @key global.istioNamespace Namespace in which Istio is deployed
  # Note: By default, Istio namespace is set to 'istio-system'
  istioNamespace: istio-system
  # @key global.istioServiceAccountName Name of the Istio service account
  istioServiceAccountName: istio-ingress
  # @key global.istioGatewayName Name of the Istio Gateway Resource (LB operating at the edge of the mesh)
  istioGatewayName: ingress-gateway
  # @key global.istioVirtualServiceEnabled Enable Istio traffic routing to a named destination service
  istioVirtualServiceEnabled: true

# @section Configuration Parameters
# Contains configuration parameters specific to the Auth application
configuration:
  # @key configuration.tokenIssuerUrl JWT token issuer URL
  tokenIssuerUrl: "{baseUrl}"
  # @key configuration.superUserIdentifier Super user identification if blank all users will be super users
  superUserIdentifier: ""
  # @key configuration.cookieParentDomain Cookie domain scope
  cookieParentDomain: .telicent.localhost
  # @key configuration.cookieSecure Enable secure cookies
  cookieSecure: true

# @section External IDP
# Note: It is recommended to use a Kubernetes secret for sensitive information like passwords
externalIdp:
  # @key externalIdp.url External identity provider URL
  url: ""
  # @key externalIdp.clientName Identity provider display name
  clientName: Enterprise
  # @key externalIdp.clientId OAuth2 client ID
  clientId: ""
  # @key externalIdp.clientSecret OAuth2 client secret
  clientSecret: ""
  # @key externalIdp.existingSecret Name of an existing secret resource containing the OAuth2 client ID and secret
  # Note: If specified, existing secret must contain data for EXTERNAL_IDP_CLIENT_ID and EXTERNAL_IDP_CLIENT_SECRET, and values for externalIdp.clientId and externalIdp.clientSecret will be ignored
  existingSecret: ""

# @section ForwardAuth
# Note: It is recommended to use a Kubernetes secret for sensitive information like passwords
forwardAuth:
  # @key forwardAuth.secretValue ForwardAuth security secret
  secretValue: ""
  # @key forwardAuth.existingSecret Name of an existing secret resource containing the ForwardAuth secret value
  # Note: If specified, existing secret must contain data for POSTGRES_PASSWORD, and the value for postgres.password will be ignored
  existingSecret: ""

# @section PostgreSQL
# Note: It is recommended to use a Kubernetes secret for sensitive information like passwords
postgres:
  # @key postgres.uri PostgreSQL connection URL
  uri: ""
  # @key postgres.username PostgreSQL username
  username: ""
  # @key postgres.password PostgreSQL password
  password: ""
  # @key postgres.existingSecret Name of an existing secret resource containing the PostgreSQL password
  # Note: If specified, existing secret must contain data for POSTGRES_PASSWORD, and the value for postgres.password will be ignored
  existingSecret: ""

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: telicent-auth-server
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag:

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 9000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
readinessProbe:
  httpGet:
    path: /actuator/health
    port: http

nodeSelector: {}

tolerations: []

affinity: {}

istio:
  ingress:
    # @key istio.ingress.principal Principal used for ingress traffic to this application by the Istio AuthorizationPolicy. If not set, a principal is generated using 'global.istioNamespace' and 'global.istioServiceAccountName'
    principal: ""