apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "auth.fullname" . }}
  namespace: {{ include "auth.namespace" . | quote }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations: 
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "auth.labels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        checksum/configEnv: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        checksum/configClients: {{ include (print $.Template.BasePath "/configmap-clients.yaml") . | sha256sum }}
        checksum/secretIdp: {{ include (print $.Template.BasePath "/secret-idp.yaml") . | sha256sum }}
        checksum/secretForward: {{ include (print $.Template.BasePath "/secret-forward-auth.yaml") . | sha256sum }}
        checksum/secretPsql: {{ include (print $.Template.BasePath "/secret-psql.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      serviceAccountName: {{ include "auth.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- $pullSecret := .Values.global.imagePullSecrets | default .Values.image.pullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
      {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: auth
        image: {{ include "auth.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        securityContext: {{- toYaml .Values.containerSecurityContext | nindent 10 }}

        env:
        - name: EXTERNAL_IDP_CLIENT_ID
          valueFrom:
            secretKeyRef:
              key: clientid
              name: {{ include "auth.idpSecretName" . }}
        - name: EXTERNAL_IDP_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: clientsecret
              name: {{ include "auth.idpSecretName" . }}
        - name: POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: {{ include "auth.postgresSqlSecretName" . }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "auth.postgresSqlSecretName" . }}
        - name: FORWARD_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              key: header
              name: {{ include "auth.forwardAuthSecretName" . }}

        {{- range .Values.extraEnvVars }}
        - name: {{ .name }}
          value: {{ .value }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "auth.envConfigMapName" . }}
        - secretRef:
            name: {{ include "auth.forwardAuthSecretName" . }}

        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 3000
          timeoutSeconds: 3

        volumeMounts:
        - name: clients-volume
          mountPath: data/registered-clients
          readOnly: true
        {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}

      {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: clients-volume
        configMap:
          name: {{ include "auth.clientsConfigMapName" . }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
