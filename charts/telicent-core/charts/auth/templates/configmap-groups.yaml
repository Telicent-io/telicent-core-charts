{{- if not .Values.startup.groups.existingConfigMap }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "auth.groupsConfigMapName" . }}
  namespace: {{ include "auth.namespace" . | quote }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}

data:
  groups.yaml: |
    groups:
      {{- toYaml .Values.startup.groups.list | nindent 8 }}

{{- end }}
