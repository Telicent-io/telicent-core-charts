{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret

metadata:
  name: {{ include "auth.postgresSecretName" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}

data:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
{{- end }}
