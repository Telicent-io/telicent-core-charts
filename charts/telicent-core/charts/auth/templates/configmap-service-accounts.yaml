apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "auth.serviceAccountsConfigMapName" . }}
  namespace: {{ include "auth.namespace" . | quote }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}

data:
  service-accounts.yaml: |
    {{- if .Values.bootstrap.serviceAccounts }}
    serviceAccounts:
      {{- toYaml .Values.bootstrap.serviceAccounts | nindent 6 }}
    {{- else }}
    serviceAccounts: []
    {{- end }}
