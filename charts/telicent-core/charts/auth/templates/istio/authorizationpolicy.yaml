apiVersion: security.istio.io/v1
kind: AuthorizationPolicy

metadata:
  name: {{ include "auth.fullname" . }}-ingress
  namespace: {{ include "auth.namespace" . | quote }}
  labels:
  {{- include "auth.labels" . | nindent 4 }}

spec:
  selector:
    matchLabels:
    {{- include "auth.selectorLabels" . | nindent 6 }}

  action: ALLOW
  rules:
  - from:
      - source:
          principals:
          - {{ include "auth.ingressPrincipal" . }}
          # todo: ab source this properly
          - cluster.local/ns/tc-core/sa/graph
          - cluster.local/ns/tc-core/sa/search
          - cluster.local/ns/tc-core/sa/paperback-writer

    to:
      - operation:
          methods:
            - '*'
