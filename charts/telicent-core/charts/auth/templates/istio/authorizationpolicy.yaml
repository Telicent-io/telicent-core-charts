apiVersion: security.istio.io/v1
kind: AuthorizationPolicy

metadata:
  name: {{ include "auth.fullname" . }}-ingress
  labels:
  {{- include "auth.labels" . | nindent 4 }}

spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
            - {{ include "auth.ingressPrincipal" . }}
      to:
        - operation:
            methods:
              - '*'
  selector:
    matchLabels:
    {{- include "auth.selectorLabels" . | nindent 6 }}
