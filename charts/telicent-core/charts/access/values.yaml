# Telicent Access stand-alone chart

# @section Global Parameters
# @descStart
# Contains global parameters, these parameters are mirrored within the Telicent core umbrella chart
# @descEnd

global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.enterprise Enable enterprise mode, adding additional features and configurations
  enterprise: false

  # @key global.appHostDomain Domain associated with Telicent application services
  appHostDomain: "apps.telicent.io"
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers
  authHostDomain: "auth.telicent.io"
  # @key global.groupsClaim Key used to retrieve groups from the OIDC provider
  groupsClaim: "groups"

  # @key global.istioNamespace Namespace in which Istio is deployed
  # Note: By default, Istio namespace is set to 'istio-system'
  istioNamespace: istio-system
  # @key global.istioServiceAccountName Name of the Istio service account
  istioServiceAccountName: istio-ingress
  # @key global.istioGatewayName Name of the Istio Gateway Resource (LB operating at the edge of the mesh)
  istioGatewayName: ingress-gateway
  # @key global.istioVirtualServiceEnabled Enable Istio traffic routing to a named destination service
  istioVirtualServiceEnabled: true

# @section Configuration Parameters
# @descStart
# Contains configuration parameters specific to the Access application
# @descEnd
configuration:
  # @key configuration.debug Enable debug logging
  debug: true
  # @key configuration.openidProviderUrl The URL of the OIDC provider
  openidProviderUrl: "https://oidc.example.com"
  # @key configuration.scimEnabled Enable SCIM user management
  scimEnabled: true
  # @key configuration.telicentPreviewReleaseName Release name of the Telicent Preview chart
  telicentPreviewReleaseName: "telicent-preview"

# @section Common Parameters
# @key fullnameOverride String to fully override the generated release name
fullnameOverride: ""
# @key existingConfigmap Name of the existing configmap for configuration
existingConfigmap: ""
# @key existingCacertConfigmap Name of the existing configmap for extra certificates
existingCacertConfigmap: ""
# @key existingCacertSecretName Name of the secret containing extra CA certificates
existingCacertSecretName: ""
# @key cacert Path to the CA certificate file
cacert: ""

# @section MongoDB Parameters
mongo:
  # @key mongo.host MongoDB One or more host addresses, 'host1[:port1][,...hostN[:portN]]'
  host: "<host1>:<port1>,<host2>:<port2>,<host3>:<port3>"
  # @key mongo.existingSecret Name of an existing secret resource containing the MongoDB username & password
  existingSecret: ""
  # @key mongo.username MongoDB username
  username: ""
  # @key mongo.password MongoDB password
  password: ""
  # @key mongo.database MongoDB database
  database: access
  # @key mongo.connectionStringOptions MongoDB additional connection values
  connectionStringOptions: "authMechanism=SCRAM-SHA-1&retryWrites=false"
  # @key mongo.retryRewrites Enable Retryable Writes
  retryRewrites: "false"
 # @key mongo.existingCaSecret existingCaSecret If you have an existing secret for the CA certificate, you can specify it here. If you've specified to use TLS in the url, you must provide a CA certificate.
  existingCaSecret: ""
  # @key mongo.cacertPath Path to the CA certificate file, must be set if TLS is enabled in the url and mirror the path in the connectionStringOptions
  cacertPath: ""

# @section Access Deployment Parameters
# @key replicas Number of Access replicas to deploy
replicas: 1
# @key revisionHistoryLimit Number of controller revisions to keep
revisionHistoryLimit: 5

image:
  # @key image.registry [default: REGISTRY_NAME] Access image registry
  registry: quay.io
  # @key image.repository [default: REPOSITORY_NAME/telicent-access-api] Access image name
  repository: telicent/telicent-access-api
  # @key image.tag Access image tag. If not set, a tag is generated using the appVersion
  tag: ""
  # @key image.pullPolicy Access image pull policy
  pullPolicy: IfNotPresent
  # @key image.pullSecrets Specify registry secret names as an array
  pullSecrets: []

resources:
  requests:
    # @key resources.requests.cpu Set containers' CPU request
    cpu: "250m"
    # @key resources.requests.memory Set containers' memory request
    memory: "512Mi"
  limits:
    # @key resources.limits.cpu Set containers' CPU limit
    cpu: "350m"
    # @key resources.limits.memory Set containers' memory limit
    memory: "768Mi"

containerSecurityContext:
  # @key containerSecurityContext.runAsUser Set containers' Security Context runAsUser User ID
  runAsUser: 185
  # @key containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
  allowPrivilegeEscalation: false
  capabilities:
    # @key containerSecurityContext.capabilities.drop List of capabilities to be dropped
    drop:
      - ALL
  seccompProfile:
    # @key containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
    type: RuntimeDefault

podSecurityContext:
  # @key podSecurityContext.runAsUser Set the provisioning pod's Security Context runAsUser User ID
  runAsUser: 185
  # @key podSecurityContext.runAsGroup Set the provisioning pod's Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key podSecurityContext.runAsNonRoot Set the provisioning pod's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key podSecurityContext.fsGroup Set the provisioning pod's Group ID for the mounted volumes' filesystem
  fsGroup: 185
  seccompProfile:
    # @key podSecurityContext.seccompProfile.type Set the provisioning pod's Security Context seccomp profile
    type: RuntimeDefault

# @section Traffic Exposure Parameters
service:
  # @key service.port Access service port
  port: 8080
  # @key service.type Access service type
  type: ClusterIP

istio:
  ingress:
    # @key istio.ingress.principal Principal used for ingress traffic to this application by the Istio AuthorizationPolicy. If not set, a principal is generated using 'global.istioNamespace' and 'global.istioServiceAccountName'
    principal: ""

  search:
    # @key istio.search.principal Principal used for Search traffic by the Istio AuthorizationPolicy. If not set, a principal is generated using Release name, 'serviceAccountName' and the current namespace
    # Note: principal must be overridden when installing access via a sub chart, as the auto-generated principal (based on the release name) will be incorrect.
    principal: ""
    # @key istio.search.serviceAccountName Name of the Search service account
    serviceAccountName: "search"

  graph:
    # @key istio.graph.principal Principal used for Graph traffic by the Istio AuthorizationPolicy. If not set, a principal is generated using Release name, 'serviceAccountName' and the current namespace
    # Note: principal must be overridden when installing access via a sub chart, as the auto-generated principal (based on the release name) will be incorrect.
    principal: ""
    # @key istio.graph.serviceAccountName Name of the Graph service account
    serviceAccountName: "graph"

  paperback-writer:
    # @key istio.paperback-writer.principal Principal used for Paperback Writer traffic by the Istio AuthorizationPolicy. If not set, a principal is generated using 'serviceAccountName' and the current namespace
    # Note: principal must be overridden when installing access via a sub chart, as the auto-generated principal (based on the release name) will be incorrect.
    principal: ""
    # @key istio.paperback-writer.serviceAccountName Name of the Paperback Writer service account
    serviceAccountName: "paperback-writer"

# @section Extra Containers Parameters
# @key extraContainers Additional containers to be added to the pod
extraContainers: []
# Example:
# extraContainers:
#   - name: sidecar
#     image: nginx:alpine
#     ports:
#       - containerPort: 80

# @section Service Account Parameters
serviceAccount:
  # @key serviceAccount.name Name of the ServiceAccount to use. If not set, a name is generated using the fullname
  name: ""
  # @key serviceAccount.annotations Additional custom annotations for the ServiceAccount
  annotations: {}
