apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "access.fullname" . }}
  labels:
  {{- include "access.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
    {{- include "access.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
      {{- include "access.selectorLabels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "access.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
     
      {{- $pullSecret := .Values.global.imagePullSecrets | default .Values.image.pullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: access
        image: {{ include "access.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        securityContext: {{- toYaml .Values.containerSecurityContext | nindent 10 }}

        env:
        {{- range $key, $value := .Values.extraEnv }}
        - name: {{ $key }}
          value: {{ $value }}
        {{- end }}
        {{- if or .Values.existingCacertConfigmap .Values.existingCacertSecretName .Values.cacert }}
        - name: NODE_EXTRA_CA_CERTS
          value: "/certs/ca.crt"
        {{- end }}
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: {{ include "access.mongoSecretName" . }}
        - name: MONGO_PWD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "access.mongoSecretName" . }}
        envFrom:
        - configMapRef:
            name: {{ include "access.envConfigmapName" . }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }} 
          protocol: TCP
              
        volumeMounts:
        {{- if or .Values.existingCacertConfigmap .Values.existingCacertSecretName .Values.cacert }}
        - name: cert-volume
          mountPath: /certs
        {{- end }}
        {{- if contains "tls=true" .Values.mongo.connectionStringOptions }}
        - name: ca-certificate-volume
          mountPath: {{ .Values.mongo.cacertPath | default "/app/config/ca-certificate" }}
        {{- end }}
      {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 6 }}
      {{- end }}

      volumes:
      {{- if or .Values.existingCacertConfigmap .Values.existingCacertSecretName .Values.cacert }}
      - name: cert-volume
        {{- if .Values.existingCacertSecretName }}
        secret:
          secretName: {{ .Values.existingCacertSecretName }}
        {{- else }}
        configMap:
          name: {{ include "access.cacertConfigmapName" . }}
        {{- end }}
      {{- end }}
      {{- if .Values.mongo.existingCaSecret }}
      - name: ca-certificate-volume
        secret:
          secretName: {{ .Values.mongo.existingCaSecret }}
      {{- end }}
     