{{- if not .Values.mongo.existingMongoPasswordSecret -}}
apiVersion: v1
kind: Secret

type: kubernetes.io/basic-auth
metadata:
  name: {{ include "access.mongoSecretName" . }}
  labels:
    {{- include "access.labels" . | nindent 4 }}

data:
  username: {{ .Values.mongo.username | b64enc | quote }}
  password: {{ .Values.mongo.password | b64enc | quote }}
{{- end -}}
