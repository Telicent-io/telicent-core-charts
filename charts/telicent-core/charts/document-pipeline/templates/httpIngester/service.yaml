{{- if .Values.enabled -}}
apiVersion: v1
kind: Service

metadata:
  name: {{ include "http-ingester.fullname" . }}
  namespace: {{ include "document-pipeline.namespace" . | quote }}
  labels:
    {{- include "http-ingester.labels" . | nindent 4 }}

spec:
  type: ClusterIP
  selector:
    {{- include "http-ingester.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      appProtocol: http
      protocol: TCP
      targetPort: http
      port:  {{ .Values.httpIngester.service.port }}
{{- end -}}
