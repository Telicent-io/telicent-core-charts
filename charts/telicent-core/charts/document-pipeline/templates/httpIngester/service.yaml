{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "document-pipeline.fullname" . }}
  labels:
    {{- include "document-pipeline.labels" . | nindent 4 }}
    {{- include "http-ingester.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.httpIngester.service.type }}
  ports:
    - port: {{ .Values.httpIngester.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "http-ingester.selectorLabels" . | nindent 4 }}
{{- end -}}