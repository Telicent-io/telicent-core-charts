{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "content-indexer.fullname" . }}
  namespace: {{ include "document-pipeline.namespace" . | quote }}
  labels:
    {{- include "content-indexer.labels" . | nindent 4 }}
  {{- with .Values.contentIndexer.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  replicas: {{ .Values.contentIndexer.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "content-indexer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "content-indexer.labels" . | nindent 8 }}
      {{- with .Values.contentIndexer.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentIndexer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      {{- $metrics := .Values.metrics | default dict }}
      serviceAccountName: {{ include "document-pipeline.serviceAccountName" . }}
      securityContext: {{ .Values.contentIndexer.podSecurityContext | default .Values.podSecurityContext | toYaml | nindent 8 }}

      {{- $pullSecret := .Values.global.imagePullSecrets | default .Values.contentIndexer.image.pullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.contentIndexer.initContainers }}
      initContainers:
      {{- with .Values.contentIndexer.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "content-indexer.image" . }}
        imagePullPolicy: {{ .Values.contentIndexer.image.pullPolicy }}
        resources: {{ .Values.contentIndexer.resources | default .Values.resources | toYaml | nindent 10 }}
        securityContext: {{ .Values.contentIndexer.containerSecurityContext | default .Values.containerSecurityContext | toYaml | nindent 10 }}

        env:
        - name: KAFKA_CONFIG_FILE_PATH
          value: /app/config/kafka-auth/kafka-config.properties
        - name: BOOTSTRAP_SERVERS
          value: {{ .Values.global.kafka.bootstrapServers | quote }}
        - name: INPUT_TOPIC
          value: {{ .Values.contentIndexer.elastic.topic | quote }}
        - name: ELASTIC_HOST
          value: {{ .Values.contentIndexer.elastic.host | quote }}
        - name: ELASTIC_PORT
          value: {{ .Values.contentIndexer.elastic.port | quote }}
        - name: ELASTIC_INDEX
          value: {{ .Values.contentIndexer.elastic.index | quote }}
        - name: JAVA_OPTIONS
          value: {{ .Values.contentIndexer.java.jvmOptions | quote }}
        - name: OPENSEARCH_COMPATIBILITY
          value: {{ .Values.contentIndexer.elastic.opensearchCompatibility | quote }}
        - name: DLQ_TOPIC
          value: {{ .Values.contentIndexer.elastic.dlqTopic | quote }}
        {{- if $metrics.enabled }}
        - name: OTEL_METRICS_EXPORTER
          value: "prometheus"
        - name: OTEL_TRACES_EXPORTER
          value: "none"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        {{- end }}
        - name: ELASTIC_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: {{ include "contentIndexer.elasticSecretName" . }}
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "contentIndexer.elasticSecretName" . }}
        {{- range .Values.contentIndexer.extraEnvVars }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}  

        ports:
        - name: http
          protocol: TCP
          containerPort: 10101

        readinessProbe:
          httpGet:
            path: /version-info
            port: 10101
        livenessProbe:
          httpGet:
            path: /healthz
            port: 10101

        volumeMounts:
        - name: kafka-auth-config
          mountPath: /app/config/kafka-auth/
        {{- if .Values.global.truststore.existingSecret }}
        - name: java-truststore
          mountPath: {{ .Values.global.truststore.mountPath | default "/app/config/truststore" }}
        {{- end }}
        {{- with .Values.contentIndexer.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}

      {{- with .Values.contentIndexer.sidecars }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: kafka-auth-config
        secret:
        {{- if .Values.global.kafka.existingConfigSecretName }}
          secretName: {{ .Values.global.kafka.existingConfigSecretName }}
        {{- else }}
          secretName: {{ include "document-pipeline.fullname" . }}-kafka-config
        {{- end }}
      {{- if .Values.global.truststore.existingSecret }}
      - name: java-truststore
        secret:
          secretName: {{ .Values.global.truststore.existingSecret }}
      {{- end }}
      {{- with .Values.contentIndexer.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.contentIndexer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentIndexer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentIndexer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
