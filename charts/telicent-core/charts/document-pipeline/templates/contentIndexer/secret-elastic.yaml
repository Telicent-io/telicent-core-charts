{{- if not .Values.contentIndexer.elasticSecret.existingSecret }}

apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth

metadata:
  name: {{ include "contentIndexer.elasticSecretName" . }}
  labels:
    {{- include "document-pipeline.labels" . | nindent 4 }}

data:
  username: {{ .Values.contentIndexer.elasticSecret.username | b64enc | quote }}
  password: {{ .Values.contentIndexer.elasticSecret.password | b64enc | quote }}
{{- end }}
