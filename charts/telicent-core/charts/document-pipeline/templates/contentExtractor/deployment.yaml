{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "content-extractor.fullname" . }}
  namespace: {{ include "document-pipeline.namespace" . | quote }}
  labels:
    {{- include "content-extractor.labels" . | nindent 4 }}
  {{- with .Values.contentExtractor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}  

spec:
  replicas: {{ .Values.contentExtractor.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "content-extractor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "content-extractor.labels" . | nindent 8 }}
      {{- with .Values.contentExtractor.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentExtractor.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      serviceAccountName: {{ include "document-pipeline.serviceAccountName" . }}
      securityContext: {{ .Values.contentExtractor.podSecurityContext | default .Values.podSecurityContext | toYaml | nindent 8 }}

      {{- $pullSecret := .Values.global.imagePullSecrets | default .Values.contentExtractor.image.pullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.contentExtractor.initContainers }}
      initContainers:
      {{- with .Values.contentExtractor.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "content-extractor.image" . }}
        imagePullPolicy: {{ .Values.contentExtractor.image.pullPolicy }}
        resources: {{ .Values.contentExtractor.resources | default .Values.resources | toYaml | nindent 10 }}
        securityContext: {{ .Values.contentExtractor.containerSecurityContext | default .Values.containerSecurityContext | toYaml | nindent 10 }}

        env:
        - name: KAFKA_CONFIG_FILE_PATH
          value: /app/config/kafka-auth/kafka-config.properties
        - name: BOOTSTRAP_SERVERS
          value: {{ .Values.global.kafka.bootstrapServers | quote }}
        - name: INPUT_TOPIC
          value: {{ .Values.contentExtractor.topics.inputTopic | quote }}
        - name: OUTPUT_TOPIC
          value: {{ .Values.contentExtractor.topics.outputTopic | quote }}
        - name: DLQ_TOPIC
          value: {{ .Values.contentExtractor.topics.dlqTopic | quote }}
        {{- range .Values.contentExtractor.extraEnvVars }}
        - name: {{ .name | quote  }}
          value: {{ .value | quote }}
        {{- end }}  

        ports:
        - name: http
          protocol: TCP
          containerPort: 10101

        readinessProbe:
          httpGet:
            path: /version-info
            port: 10101
        livenessProbe:
          httpGet:
            path: /healthz
            port: 10101

        volumeMounts:
        - name: kafka-auth-config
          mountPath: /app/config/kafka-auth/
        {{- with .Values.contentExtractor.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}

      {{- with .Values.contentExtractor.sidecars }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: kafka-auth-config
        secret:
        {{- if .Values.global.kafka.existingConfigSecretName }}
          secretName: {{ .Values.global.kafka.existingConfigSecretName }}
        {{- else }}
          secretName: {{ include "document-pipeline.fullname" . }}-kafka-config
        {{- end }}
      {{- with .Values.contentExtractor.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
   
      {{- with .Values.contentExtractor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentExtractor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentExtractor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
