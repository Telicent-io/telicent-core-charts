{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "content-extractor.fullname" . }}
  labels:
    {{- include "document-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.contentExtractor.replicaCount }}
  selector:
    matchLabels:
      {{- include "content-extractor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.contentExtractor.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "document-pipeline.labels" . | nindent 8 }}
        {{- include "content-extractor.selectorLabels" . | nindent 8 }}
        {{- with .Values.contentExtractor.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.contentExtractor.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "document-pipeline.serviceAccountName" . }}
      {{- with .Values.contentExtractor.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $pullSecret := .Values.global.imagePullSecrets | default .Values.imagePullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.contentExtractor.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: BOOTSTRAP_SERVERS
              value: {{ .Values.global.kafka.bootstrapServers | quote }}
            - name: INPUT_TOPIC
              value: {{ .Values.contentExtractor.configuration.inputTopic | quote }}
            - name: OUTPUT_TOPIC
              value: {{ .Values.contentExtractor.configuration.outputTopic | quote }}
            - name: KAFKA_CONFIG_FILE_PATH
              value: /app/config/kafka-auth/kafka-config.properties
            - name: DLQ_TOPIC
              value: {{ .Values.contentExtractor.configuration.dlqTopic | quote }}

          image: "{{ .Values.contentExtractor.image.repository }}:{{ .Values.contentExtractor.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.contentExtractor.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.contentExtractor.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10101
          readinessProbe:
            httpGet:
              path: /version-info
              port: 10101
          {{- with .Values.contentExtractor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - mountPath: /app/config/kafka-auth/
            name: kafka-auth-config
          {{- with .Values.contentExtractor.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
      - name: kafka-auth-config
        secret:
        {{- if .Values.global.kafka.existingConfigSecretName }}
          secretName: {{ .Values.global.kafka.existingConfigSecretName }}
        {{- else }}
          secretName: {{ include "document-pipeline.fullname" . }}-kafka-config
        {{- end }}
      {{- with .Values.contentExtractor.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentExtractor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentExtractor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.contentExtractor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}