# Telicent Document Pipeline stand-alone chart

# @key enabled Enable Document Pipeline chart
enabled: false

# @section Extra Containers Parameters
# @key extraContainers Additional containers to be added to all pods in the document pipeline
extraContainers: []

# @section Global Parameters
# @descStart
# Contains global parameters, these parameters are mirrored within the Telicent core umbrella chart
# @descEnd
global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.enterprise Enable enterprise mode, adding additional features and configurations
  enterprise: false

  # @key global.appHostDomain Domain associated with Telicent application services
  appHostDomain: "apps.telicent.io"
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers
  authHostDomain: "auth.telicent.io"
  # @key global.jwksUrl Endpoint exposing multiple public keys represented as JWKs (JSON Web Key Set)
  # Note: For Dex the endpoint would be https://{yourDexDomain}/keys
  jwksUrl: "https://{yourAuthdomain}/.well-known/jwks.json"

  # @key global.istioNamespace Namespace in which Istio is deployed
  # Note: By default, Istio namespace is set to 'istio-system'
  istioNamespace: istio-system
  # @key global.istioServiceAccountName Name of the Istio service account
  istioServiceAccountName: istio-ingress
  # @key global.istioGatewayName Name of the Istio Gateway Resource (LB operating at the edge of the mesh)
  istioGatewayName: ingress-gateway
  kafka:
    # @key global.kafka.bootstrapServers Comma separated list containing Kafka bootstrap servers
    bootstrapServers: "kafka-bootstrap.kafka.svc.cluster.local:9092"
    # @key global.kafka.existingConfigSecretName Name of an existing secret containing Kafka configuration (preferred over individual settings below for security)
    existingConfigSecretName: ""
    # @key global.kafka.username Username for Kafka authentication
    username: "your.kafka.username.here"
    # @key global.kafka.password Password for Kafka authentication
    password: "your.kafka.password.here"
    # @key global.kafka.protocol Protocol used for Kafka communication
    protocol: "SASL_SSL"
    # @key global.kafka.mechanism SASL mechanism used for Kafka authentication
    mechanism: "SCRAM-SHA-512"

  # @key global.existingTruststoreSecretName Name of an existing secret containing the truststore
  existingTruststoreSecretName: ""
  truststore:
    # @key global.truststore.mountPath The mount path for the truststore in the container
    mountPath: /app/config/truststore
# @section Service Account
# @descStart
# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
# @descEnd
serviceAccount:
  # @key serviceAccount.create Specifies whether a service account should be created
  create: true
  # @key serviceAccount.automount Automatically mount a ServiceAccount's API credentials?
  automount: true
  # @key serviceAccount.annotations Annotations to add to the service account
  annotations: {}
  # @key serviceAccount.name The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""
# @section HTTP Ingester
# @descStart
# This section builds out the HTTP Ingester configuration
# The application configuration is contained within the 'configuration' key or can be overriden by providing an existing ConfigMap name
# @descEnd
httpIngester:
  # @key httpIngester.replicaCount The number of replicas for the HTTP Ingester
  replicaCount: 1

  image:
    # @key httpIngester.image.registry [default: REGISTRY_NAME] image registry
    registry: quay.io
    # @key httpIngester.image.repository The container image repository for the HTTP Ingester
    repository: telicent/telicent-document-http-ingester
    # @key httpIngester.image.pullPolicy The image pull policy for the HTTP Ingester
    pullPolicy: IfNotPresent
    # @key httpIngester.image.tag The image tag for the HTTP Ingester
    tag: "3.1.4"

  # @key httpIngester.imagePullSecrets Secrets for pulling an image from a private repository
  imagePullSecrets: []
  # @key httpIngester.nameOverride Override the chart name for the HTTP Ingester
  nameOverride: ""
  # @key httpIngester.fullnameOverride Override the full name for the HTTP Ingester
  fullnameOverride: ""

  # @key httpIngester.podAnnotations Annotations to add to the HTTP Ingester pods
  podAnnotations: {}
  # @key httpIngester.podLabels Labels to add to the HTTP Ingester pods
  podLabels: {}

  podSecurityContext:
    # @key httpIngester.podSecurityContext Security context for the HTTP Ingester pods
    {}

  securityContext:
    # @key httpIngester.securityContext Security context for the HTTP Ingester containers
    {}
  # @key httpIngester.resources Resource requests and limits for the HTTP Ingester
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # @key httpIngester.volumes Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # @key httpIngester.volumeMounts Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true
  # @key httpIngester.nodeSelector Node selector for the HTTP Ingester pods
  nodeSelector: {}
  # @key httpIngester.tolerations Tolerations for the HTTP Ingester pods
  tolerations: []
  # @key httpIngester.affinity Affinity for the HTTP Ingester pods
  affinity: {}

  # @key httpIngester.existingConfigMapName If you want to use an existing ConfigMap for configuration then set the name here. If not set then a new ConfigMap will be created using the configuration in this values
  existingConfigMapName: ""
  # @key httpIngester.existingCacertConfigmapName Name of a ConfigMap containing a CA certificate to be mounted within the container
  existingCacertConfigmapName: trust-bundle
  # @key httpIngester.cacert Name of a ConfigMap containing a CA certificate to be mounted within the container
  cacert: ""
  configuration:
    # @key httpIngester.configuration.javaOpts Java options to pass to the JVM
    javaOpts: "-Djavax.net.ssl.trustStore=/app/config/truststore/truststore.jks"
    # @key httpIngester.configuration.jwksUrl Override the global JWKS URL for the HTTP Ingester
    jwksUrl: ""
    routes:
      # @key httpIngester.configuration.routes[0].name A unique name for the route
      - name: local
        # @key httpIngester.configuration.routes[0].topic The destination Kafka topic for the route
        topic: document.extractrequest
        # @key httpIngester.configuration.routes[0].securityLabel In this test configuration the label is simply test=true
        securityLabel: dGVzdD10cnVl
        # @key httpIngester.configuration.routes[0].namespace The Namespace URI that will be used to assign a unique URI to a document URIs are generated deterministically based on this and the ingested document content
        namespace: https://example.org/ns#
        headers:
          # @key httpIngester.configuration.routes[0].headers[0].name The Owner header, configured such that even if the header is present in the request then the defaultValue here takes precedence
          - name: Owner
            # @key httpIngester.configuration.routes[0].headers[0].defaultValue The default value for the Owner header
            defaultValue: Platform Team
            # @key httpIngester.configuration.routes[0].headers[0].priority The priority for the Owner header
            priority: CONFIGURATION
          # @key httpIngester.configuration.routes[0].headers[1].name The (deprecated) Data-Source-Name, configured such that if the header is present in the request then the request value takes precedence
          - name: Data-Source-Name
            # @key httpIngester.configuration.routes[0].headers[1].defaultValue The default value for the (deprecated) Data-Source-Name header
            defaultValue: Test Data
            # @key httpIngester.configuration.routes[0].headers[1].priority The priority for the (deprecated) Data-Source-Name header
            priority: REQUEST
          # @key httpIngester.configuration.routes[0].headers[2].name The Distribution ID header. This is necessary to indicate what data catalogue details are associated to the incoming request. NOTE: marked as REQUEST for time being to make development/testing easier but should be REQUEST_ONLY when deployed.
          - name: Data-Source-Reference
            # @key httpIngester.configuration.routes[0].headers[2].defaultValue The default value for the Distribution ID header
            defaultValue: Telicent Document Pipeline
            # @key httpIngester.configuration.routes[0].headers[2].priority The priority for the Distribution ID header
            priority: REQUEST
          # @key httpIngester.configuration.routes[0].headers[3].name The Distribution ID header. This is necessary to indicate what data catalogue details are associated to the incoming request. NOTE: marked as REQUEST for time being to make development/testing easier but should be REQUEST_ONLY when deployed.
          - name: Distribution-Id
            # @key httpIngester.configuration.routes[0].headers[3].defaultValue The default value for the Distribution ID header
            defaultValue: 13bce3bf-7edb-4efb-a54f-574327458dd7
            # @key httpIngester.configuration.routes[0].headers[3].priority The priority for the Distribution ID header
            priority: REQUEST
          # @key httpIngester.configuration.routes[0].headers[4].name The EDH/IDH policy information header
          - name: Policy-Information
            # @key httpIngester.configuration.routes[0].headers[4].defaultValue The default value for the EDH/IDH policy information header
            defaultValue: '{"EDH":{"classification":"O","permittedNats":["GBR"],"permittedOrgs":["Telicent"],"orGroups":[],"andGroups":[]}}'
            # @key httpIngester.configuration.routes[0].headers[4].priority The priority for the EDH/IDH policy information header
            priority: REQUEST

# @section Content Extractor
# @descStart
# This section builds out the Content Extractor configuration
# The application configuration is contained within the 'configuration' key
# @descEnd
contentExtractor:
  # @key contentExtractor.replicaCount The number of replicas for the Content Extractor
  replicaCount: 1

  image:
    # @key contentExtractor.image.registry [default: REGISTRY_NAME] image registry
    registry: quay.io
    # @key contentExtractor.image.repository The container image repository for the Content Extractor
    repository: telicent/telicent-document-content-extractor
    # @key contentExtractor.image.pullPolicy The image pull policy for the Content Extractor
    pullPolicy: IfNotPresent
    # @key contentExtractor.image.tag The image tag for the Content Extractor
    tag: "3.1.4"

  # @key contentExtractor.imagePullSecrets Secrets for pulling an image from a private repository
  imagePullSecrets: []
  # @key contentExtractor.nameOverride Override the chart name for the Content Extractor
  nameOverride: ""
  # @key contentExtractor.fullnameOverride Override the full name for the Content Extractor
  fullnameOverride: ""

  # @key contentExtractor.podAnnotations Annotations to add to the Content Extractor pods
  podAnnotations: {}
  # @key contentExtractor.podLabels Labels to add to the Content Extractor pods
  podLabels: {}

  # @key contentExtractor.podSecurityContext Security context for the Content Extractor pods
  podSecurityContext: {}
    # fsGroup: 2000

  # @key contentExtractor.securityContext Security context for the Content Extractor containers
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    # @key contentExtractor.service.type The service type for the Content Extractor
    type: ClusterIP
    # @key contentExtractor.service.port The service port for the Content Extractor
    port: 80

  # @key contentExtractor.resources Resource requests and limits for the Content Extractor
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      # @key contentExtractor.livenessProbe.httpGet.path The HTTP path for the liveness probe
      path: /
      # @key contentExtractor.livenessProbe.httpGet.port The HTTP port for the liveness probe
      port: http
  readinessProbe:
    httpGet:
      # @key contentExtractor.readinessProbe.httpGet.path The HTTP path for the readiness probe
      path: /
      # @key contentExtractor.readinessProbe.httpGet.port The HTTP port for the readiness probe
      port: http

  # @key contentExtractor.volumes Additional volumes for the Content Extractor
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # @key contentExtractor.volumeMounts Additional volume mounts for the Content Extractor
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  # @key contentExtractor.nodeSelector Node selector for the Content Extractor pods
  nodeSelector: {}

  # @key contentExtractor.tolerations Tolerations for the Content Extractor pods
  tolerations: []

  # @key contentExtractor.affinity Affinity rules for the Content Extractor pods
  affinity: {}

  configuration:
    # @key contentExtractor.configuration.inputTopic The Kafka topic from which the content extractor will consume messages
    inputTopic: document.extractrequest
    # @key contentExtractor.configuration.outputTopic The Kafka topic to which the content extractor will produce messages
    outputTopic: document.textandmetadata
    # @key contentExtractor.configuration.dlqTopic The Kafka topic to which the content extractor will produce dead-lettered messages
    dlqTopic: document.extractrequest.dlq

