#
# @section *Content Tagger*
#
# @descStart
# The *Content Tagger* is responsible for tagging documents that have been ingested.
# The application settings are defined within the 'topics' key
# @descEnd
contentTagger:

  #
  # @section *Content Tagger* - Application Parameters - Topics
  #
  topics:
    # @key contentTagger.topics.inputTopic The Kafka topic from which the *Content Tagger* will consume messages
    inputTopic: document.textandmetadata
    # @key contentTagger.topics.outputTopic The Kafka topic to which the *Content Tagger* will produce
    outputTopic: knowledge
    # @key contentTagger.topics.rdfTaggerDataUriStub The URI for the RDF Tagger service
    rdfTaggerDataUriStub: http://telicent.io/data#
    # @key contentTagger.topics.dctUri The URI for Dublin Core Terms
    dctUri: http://purl.org/dc/terms/
    # @key contentTagger.topics.iesUri The URI for the IES Ontology
    iesUri: http://ies.data.gov.uk/ontology/ies4#
    # @key contentTagger.topics.tontUri The URI for the Telicent Ontology
    tontUri: "http://telicent.io/ontology/"
    # @key contentTagger.topics.iso3166Uri The URI for the ISO 3166 standard
    iso3166Uri: "http://iso.org/iso3166#"
    # @key contentTagger.topics.loggingLevel The logging level for the *Content Tagger*, e.g., DEBUG, INFO, WARN, ERROR
    loggingLevel: INFO
    # @key contentTagger.topics.kafkaConfigMode The configuration mode for Kafka, either 'basic' or 'toml'
    kafkaConfigMode: toml

  #
  # @section *Content Tagger* - Common Parameters
  #
  # @key contentTagger.nameOverride Override the chart name for the *Content Tagger*
  nameOverride: ""
  # @key contentTagger.fullnameOverride Override the full name for the *Content Tagger*
  fullnameOverride: ""
  
  #
  # @section *Content Tagger* - Deployment Parameters
  #
  # @key contentTagger.replicas The number of replicas for the *Content Tagger*
  replicas: 1

  # @key contentTagger.annotations Add extra annotations to the deployment object
  annotations: {}
  # @key contentTagger.podLabels Labels to add to the *Content Tagger* pods
  podLabels: {}
  # @key contentTagger.podAnnotations Annotations to add to the *Content Tagger* pods
  podAnnotations: {}
