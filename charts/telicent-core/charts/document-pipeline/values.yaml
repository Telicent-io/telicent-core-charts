#
# @section *Content Indexer*
#
# @descStart
# The *Content Indexer* is responsible for indexing documents.
# The application settings are defined within the 'java' & 'elastic' keys
# @descEnd
contentIndexer:

  #
  # @section *Content Indexer* - Application Parameters - Java
  #
  java:
     # @key contentIndexer.java.jvmOptions JVM options for the application
    jvmOptions: "-XX:MaxRAMPercentage=80.0"

  #
  # @section *Content Indexer* Application Parameters - Elastic/OpenSearch and Secret
  #
  # @descStart
  # The following contains connection details to an Elastic/OpenSearch service, on which the application relies.
  # It is recommended to store sensitive information including passwords in a Kubernetes secret and not in Helm values.
  # For Quick Start purposes, a secret named `tc-auth-usr-elastic-document-pipeline-content-indexer` will be created if one is not set.
  # @descEnd
  elastic:
    # @key contentIndexer.elastic.host Elastic/OpenSearch host
    # Note: This should be the URL of your Elastic/OpenSearch service, including protocol (https or http)
    host: https://your.opensearch.host
    # @key contentIndexer.elastic.port Elastic/OpenSearch port number
    port: "443"
    # @key contentIndexer.elastic.opensearchCompatibility Enable OpenSearch compatibility
    opensearchCompatibility: true
    # @key contentIndexer.elastic.index Elastic/OpenSearch index to be used
    index: doc-content
    # @key contentIndexer.elastic.topic The Kafka topic from which the content indexer will consume messages
    topic: document.textandmetadata,document.entities
     # @key contentIndexer.elastic.dlqTopic The Kafka topic to which the content indexer will produce dead-lettered messages
    dlqTopic: document.textandmetadata.dlq

    # @key contentIndexer.elastic.existingSecret Name of an existing secret. The secret must contain 2 keys: 'username', 'password'
    # Note: Left unset, it will create a secret named: tc-auth-usr-elastic-document-pipeline-content-indexer
    existingSecret: ""
    # @key contentIndexer.elastic.username OpenSearch/Elastic username
    # Note: For additional security, the username is read from the secret, as defined by 'existingSecret' and not from this value!
    username: ""
    # @key contentIndexer.elastic.password OpenSearch/Elastic user password
    password: ""

  #
  # @section *Content Indexer* - Common Parameters
  #
  # @key contentIndexer.nameOverride Override the chart name for the *Content Indexer*
  nameOverride: ""
  # @key contentIndexer.fullnameOverride Override the full name for the *Content Indexer*
  fullnameOverride: ""

  #
  # @section *Content Indexer* - Deployment Parameters
  #
  # @key contentIndexer.replicas Number of replicas to deploy
  replicas: 1

  # @key contentIndexer.annotations Add extra annotations to the deployment object
  annotations: {}
  # @key contentIndexer.podLabels Labels to add to the *Content Indexer* pods
  podLabels: {}
  # @key contentIndexer.podAnnotations Annotations to add to the *Content Indexer* pods
  podAnnotations: {}
  # @key contentIndexer.extraEnvVars Array with extra environment variables to add
  extraEnvVars: []
  # @key contentIndexer.extraVolumes Additional volumes for the *Content Indexer*
  extraVolumes: []
  # @key contentIndexer.extraVolumeMounts Additional volume mounts for the *Content Indexer*
  extraVolumeMounts: []
  # @key contentIndexer.initContainers Add init containers to the pod
  initContainers: []
  # @key contentIndexer.sidecars Add sidecars to the pod.
  sidecars: []

  image:
    # @key contentIndexer.image.registry  *Content Indexer* image registry
    registry: quay.io
    # @key contentIndexer.image.repository The container image repository for the *Content Indexer*
    repository: telicent/telicent-document-content-indexer
    # @key contentIndexer.image.pullPolicy The image pull policy for the *Content Indexer*
    # @key contentIndexer.image.tag The image tag for the *Content Indexer*
    tag: "3.3.0"
    pullPolicy: IfNotPresent
    # @key contentIndexer.image.pullSecrets Secrets for pulling an image from a private repository
    pullSecrets: []

  # @key contentIndexer.affinity Affinity rules for the *Content Indexer* pods
  affinity: {}
  # @key contentIndexer.nodeSelector Node selector for the *Content Indexer* pods
  nodeSelector: {}
  # @key contentIndexer.tolerations Tolerations for the *Content Indexer* pods
  tolerations: []

  # @key contentIndexer.resources Resource requests and limits for the *Content Indexer*. Optional override, otherwise inherited from the root resource definition
  resources: {}
  # @key contentIndexer.podSecurityContext Security context for the pod(s). Optional override, otherwise inherited from the root security context definition
  podSecurityContext: {}
  # @key contentIndexer.containerSecurityContext Security context for the container(s). Optional override, otherwise inherited from the root security context definition
  containerSecurityContext: {}

