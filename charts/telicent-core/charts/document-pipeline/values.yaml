  elasticSecrets:
    # @key contentIndexer.elasticSecrets.elasticUser OpenSearch username
    elasticUser: ""
    # @key contentIndexer.elasticSecrets.elasticPassword OpenSearch user password
    elasticPassword: ""
    # @key contentIndexer.elasticSecrets.truststorePass Password for the truststore
    truststorePass: ""
    # @key contentIndexer.elasticSecrets.existingEnvironmentSecretName Name of an existing environment secret
    existingEnvironmentSecretName: ""

