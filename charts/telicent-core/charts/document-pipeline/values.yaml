# @key enabled Enable Document Pipeline chart
enabled: false

#
# @section Global Parameters
#
# @descStart
# Contains global parameters; these parameters are mirrored within the Telicent core umbrella chart
# Note: Only global parameters used within this chart will be listed below
# @descEnd
global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.appHostDomain Domain associated with Telicent application/ui services
  appHostDomain: "apps.telicent.io"
  # @key global.apiHostDomain Domain associated with Telicent Api services
  apiHostDomain: "api.telicent.io"
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers
  authHostDomain: "auth.telicent.io"

  kafka:
    # @key global.kafka.bootstrapServers Comma separated list containing Kafka bootstrap servers
    bootstrapServers: "kafka-bootstrap.kafka.svc.cluster.local:9092"
    # @key global.kafka.existingConfigSecretName Name of an existing secret containing Kafka configuration (preferred over individual settings below for security)
    existingConfigSecretName: ""
    # @key global.kafka.username Username for Kafka authentication
    username: "your.kafka.username.here"
    # @key global.kafka.password Password for Kafka authentication
    password: "your.kafka.password.here"
    # @key global.kafka.protocol Protocol used for Kafka communication
    protocol: "SASL_SSL"
    # @key global.kafka.mechanism SASL mechanism used for Kafka authentication
    mechanism: "SCRAM-SHA-512"

  truststore:
    # @key global.truststore.existingSecret Name of an existing secret containing the truststore
    existingSecret: ""
    # @key global.truststore.mountPath The mount path for the truststore in the container
    mountPath: /app/config/truststore

#
# @section Deployment Resources Parameters - Default resource allocation applied to all sub-chart deployments
#
resources:
  requests:
    # @key resources.requests.cpu Set containers' CPU request
    cpu: "500m"
    # @key resources.requests.memory Set containers' memory request
    memory: "750Mi"
  limits:
    # @key resources.limits.cpu Set containers' CPU limit
    cpu: "1000m"
    # @key resources.limits.memory Set containers' memory limit
    memory: "1000Mi"

#
# @section Deployment Security Context Parameters - Default security context applied to all sub-chart deployments
#
podSecurityContext:
  # @key podSecurityContext.runAsUser Set the provisioning pod's Security Context runAsUser User ID
  runAsUser: 185
  # @key podSecurityContext.runAsGroup Set the provisioning pod's Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key podSecurityContext.runAsNonRoot Set the provisioning pod's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key podSecurityContext.fsGroup Set the provisioning pod's Group ID for the mounted volumes' filesystem
  fsGroup: 185
  seccompProfile:
    # @key podSecurityContext.seccompProfile.type Set the provisioning pod's Security Context seccomp profile
    type: RuntimeDefault
containerSecurityContext:
  # @key containerSecurityContext.runAsUser Set containers' Security Context runAsUser User ID
  runAsUser: 185
  # @key containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
  allowPrivilegeEscalation: false
  capabilities:
    # @key containerSecurityContext.capabilities.drop List of capabilities to be dropped
    drop:
      - ALL
  seccompProfile:
    # @key containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
    type: RuntimeDefault

#
# @section Service Account - Shared by sub-chart resources
#
# @descStart
# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
# @descEnd
serviceAccount:
  # @key serviceAccount.create Specifies whether a service account should be created
  create: true
  # @key serviceAccount.automount Automatically mount a ServiceAccount's API credentials
  automount: true
  # @key serviceAccount.annotations Annotations to add to the service account
  annotations: {}
  # @key serviceAccount.name The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

#
# @section Host(s) Parameters - Contains host information for applications deployed via *telicent-core* chart
#
# @descStart
# *Document Pipeline* interacts directly with other Telicent Applications using their default service/serviceAccount and port.
# If either of those details changes, you can use this section to correctly referer to those applications.
# @descEnd
hosts:
  # @key hosts.enableAutoCorrect Allow for the release name to be automatically pre-fixed to each host value when required (default behavior when installing through the parent chart). Alternatively, the host value will be used as it is, without any modification
  enableAutoCorrect: true
  # @key hosts.auth Auth application default host value, as defined by 'service/serviceAccount:port'
  auth: "auth:8080"
  # @key hosts.traefikProxy Traefik Proxy application default host value, as defined by 'service/serviceAccount:port'
  traefikProxy: "traefik-proxy:8080"

#
# @section *HTTP Ingester*
#
# @descStart
# The *HTTP Ingester* is responsible for ingesting documents via https.
# The application settings are defined within the 'java' & 'routes' keys
# @descEnd
httpIngester:

  #
  # @section *HTTP Ingester* - Application Parameters - Java
  #
  java:
    # @key httpIngester.java.jvmOptions Java options to pass to the JVM
    jvmOptions: "-XX:MaxRAMPercentage=80.0"

  #
  # @section *HTTP Ingester* - Application Parameters - Routes
  #
  routes:
    # @key httpIngester.routes[0].name A unique name for the route
    - name: local
      # @key httpIngester.routes[0].topic The destination Kafka topic for the route
      topic: document.extractrequest
      # @key httpIngester.routes[0].securityLabel In this test configuration the label is simply test=true
      securityLabel: dGVzdD10cnVl
      # @key httpIngester.routes[0].namespace The Namespace URI that will be used to assign a unique URI to a document URIs are generated deterministically based on this and the ingested document content
      namespace: https://example.org/ns#
      headers:
        # @key httpIngester.routes[0].headers[0].name The Owner header, configured such that even if the header is present in the request then the defaultValue here takes precedence
        - name: Owner
          # @key httpIngester.routes[0].headers[0].defaultValue The default value for the Owner header
          defaultValue: Platform Team
          # @key httpIngester.routes[0].headers[0].priority The priority for the Owner header
          priority: CONFIGURATION
        # @key httpIngester.routes[0].headers[1].name The (deprecated) Data-Source-Name, configured such that if the header is present in the request then the request value takes precedence
        - name: Data-Source-Name
          # @key httpIngester.routes[0].headers[1].defaultValue The default value for the (deprecated) Data-Source-Name header
          defaultValue: Test Data
          # @key httpIngester.routes[0].headers[1].priority The priority for the (deprecated) Data-Source-Name header
          priority: REQUEST
        # @key httpIngester.routes[0].headers[2].name The Distribution ID header. This is necessary to indicate what data catalogue details are associated to the incoming request. NOTE: marked as REQUEST for time being to make development/testing easier but should be REQUEST_ONLY when deployed.
        - name: Data-Source-Reference
          # @key httpIngester.routes[0].headers[2].defaultValue The default value for the Distribution ID header
          defaultValue: Telicent Document Pipeline
          # @key httpIngester.routes[0].headers[2].priority The priority for the Distribution ID header
          priority: REQUEST
        # @key httpIngester.routes[0].headers[3].name The Distribution ID header. This is necessary to indicate what data catalogue details are associated to the incoming request. NOTE: marked as REQUEST for time being to make development/testing easier but should be REQUEST_ONLY when deployed.
        - name: Distribution-Id
          # @key httpIngester.routes[0].headers[3].defaultValue The default value for the Distribution ID header
          defaultValue: 13bce3bf-7edb-4efb-a54f-574327458dd7
          # @key httpIngester.routes[0].headers[3].priority The priority for the Distribution ID header
          priority: REQUEST
        # @key httpIngester.routes[0].headers[4].name The EDH/IDH policy information header
        - name: Policy-Information
          # @key httpIngester.routes[0].headers[4].defaultValue The default value for the EDH/IDH policy information header
          defaultValue: '{"EDH":{"classification":"O","permittedNats":["GBR"],"permittedOrgs":["Telicent"],"orGroups":[],"andGroups":[]}}'
          # @key httpIngester.routes[0].headers[4].priority The priority for the EDH/IDH policy information header
          priority: REQUEST
    #
    # @section *HTTP Ingester* - Configmap Parameters
    #
  configMap:
    # @key httpIngester.configMap.existingRoutesConfigMap Name of existing configmap containing Routes Configuration
    # Note: When it's set it will disable the routes configmap creation.
    existingRoutesConfigMap: ""

  #
  # @section *HTTP Ingester* - Common Parameters
  #
  # @key httpIngester.nameOverride Override the chart name for the *HTTP Ingester*
  nameOverride: ""
  # @key httpIngester.fullnameOverride Override the full name for the *HTTP Ingester*
  fullnameOverride: ""

  #
  # @section *HTTP Ingester* - Deployment Parameters
  #
  # @key httpIngester.replicas Number of replicas to deploy
  replicas: 1

  # @key httpIngester.annotations Add extra annotations to the deployment object
  annotations: {}
  # @key httpIngester.podLabels Labels to add to the *HTTP Ingester* pods
  podLabels: {}
  # @key httpIngester.podAnnotations Annotations to add to the *HTTP Ingester* pods
  podAnnotations: {}
  # @key httpIngester.extraEnvVars Array with extra environment variables to add
  extraEnvVars: []
  # @key httpIngester.extraVolumes Additional volumes on the output Deployment definition
  extraVolumes: []
  # @key httpIngester.extraVolumeMounts Additional volumeMounts on the output Deployment definition
  extraVolumeMounts: []
  # @key httpIngester.initContainers Add init containers to the pod
  initContainers: []
  # @key httpIngester.sidecars Add sidecars to the pod.
  sidecars: []

  #
  # @section *HTTP Ingester* - Deployment Image Parameters
  #
  image:
    # @key httpIngester.image.registry *HTTP Ingester* image registry
    registry: quay.io
    # @key httpIngester.image.repository The container image repository for the *HTTP Ingester*
    repository: telicent/telicent-document-http-ingester
    # @key httpIngester.image.tag The image tag for the *HTTP Ingester*
    tag: "3.3.0"
    # @key httpIngester.image.pullPolicy The image pull policy for the *HTTP Ingester*
    pullPolicy: IfNotPresent
    # @key httpIngester.image.pullSecrets Specify registry secret names as an array
    pullSecrets: []

  #
  # @section *HTTP Ingester* - Deployment Resources Parameters - Requests and Limits
  #
  resources:
    requests:
      # @key httpIngester.resources.requests.cpu Set containers' CPU request
      cpu: "500m"
      # @key httpIngester.resources.requests.memory Set containers' memory request
      memory: "1000Mi"
    limits:
      # @key httpIngester.resources.limits.cpu Set containers' CPU limit
      cpu: "1000m"
      # @key httpIngester.resources.limits.memory Set containers' memory limit
      memory: "1500Mi"

  #
  # @section *HTTP Ingester* - Deployment Affinity Parameters
  #
  # @key httpIngester.affinity Affinity for pod assignment
  affinity: {}
  # @key httpIngester.nodeSelector Node labels for pod assignment
  nodeSelector: {}
  # @key httpIngester.tolerations Tolerations for pod assignment
  tolerations: []

  #
  # @section *HTTP Ingester* - Deployment Security Context Parameters - Default Security Context
  #
  # @key httpIngester.podSecurityContext Security context for the pod(s). Optional override, otherwise inherited from the root security context definition
  podSecurityContext: {}
  # @key httpIngester.containerSecurityContext Security context for the container(s). Optional override, otherwise inherited from the root security context definition
  containerSecurityContext: {}

  #
  # @section *HTTP Ingester* - Traffic Exposure Parameters
  #
  service:
    # @key httpIngester.service.name *HTTP Ingester* service name. If not set, a name is generated using the fullname
    name: ""
    # @key httpIngester.service.port *HTTP Ingester* service port
    port: 8080
    # @key httpIngester.service.type *HTTP Ingester* service port
    type: ClusterIP

