    dctUri: http://purl.org/dc/terms/
    # @key contentTagger.configuration.iesUri The URI for the IES Ontology
    iesUri: http://ies.data.gov.uk/ontology/ies4#
    # @key contentTagger.configuration.tontUri The URI for the Telicent Ontology
    tontUri: "http://telicent.io/ontology/"
    # @key contentTagger.configuration.iso3166Uri The URI for the ISO 3166 standard
    iso3166Uri: "http://iso.org/iso3166#"
    # @key contentTagger.configuration.loggingLevel The logging level for the Content Tagger, e.g., DEBUG, INFO, WARN, ERROR
    loggingLevel: INFO
    # @key contentTagger.configuration.kafkaConfigMode The configuration mode for Kafka, either 'basic' or 'toml'
    kafkaConfigMode: toml

# @section Entity Extractor
# @descStart
# This section builds out the Entity Extractor configuration
# The application configuration is contained within the 'configuration' key
# @descEnd
entityExtractor:
  # @key entityExtractor.replicaCount The number of replicas for the Entity Extractor
  replicaCount: 1

  image:
    # @key entityExtractor.image.registry [default: REGISTRY_NAME] image registry
    registry: quay.io
    # @key entityExtractor.image.repository The container image repository for the Entity Extractor
    repository: telicent/telicent-pipeline-entity-extraction
    # @key entityExtractor.image.pullPolicy The image pull policy for the Entity Extractor
    pullPolicy: IfNotPresent
    # @key entityExtractor.image.tag The image tag for the Entity Extractor
    tag: "3.0.1"

  # @key entityExtractor.imagePullSecrets Secrets for pulling an image from a private repository
  imagePullSecrets: []
  # @key entityExtractor.nameOverride Override the chart name for the Entity Extractor
  nameOverride: ""
  # @key entityExtractor.fullnameOverride Override the full name for the Entity Extractor
  fullnameOverride: ""

  # @key entityExtractor.podAnnotations Annotations to add to the Entity Extractor pods
  podAnnotations: {}
  # @key entityExtractor.podLabels Labels to add to the Entity Extractor pods
  podLabels: {}

  # @key entityExtractor.podSecurityContext Security context for the Entity Extractor pods
  podSecurityContext: {}
    # fsGroup: 2000

  # @key entityExtractor.securityContext Security context for the Entity Extractor containers
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    # @key entityExtractor.service.type The service type for the Entity Extractor
    type: ClusterIP
    # @key entityExtractor.service.port The service port for the Entity Extractor
    port: 80

  # @key entityExtractor.resources Resource requests and limits for the Entity Extractor
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/

  # @key entityExtractor.volumes Additional volumes for the Entity Extractor
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # @key entityExtractor.volumeMounts Additional volume mounts for the Entity Extractor
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  # @key entityExtractor.nodeSelector Node selector for the Entity Extractor pods
  nodeSelector: {}

  # @key entityExtractor.tolerations Tolerations for the Entity Extractor pods
  tolerations: []

  # @key entityExtractor.affinity Affinity rules for the Entity Extractor pods
  affinity: {}

  configuration:
    # @key entityExtractor.configuration.inputTopic The Kafka topic from which the content tagger will consume messages
    inputTopic: document.textandmetadata
    # @key entityExtractor.configuration.outputTopic The Kafka topic to which the content tagger will produce
    outputTopic: knowledge
    # @key entityExtractor.configuration.kafkaConfigMode The configuration mode for Kafka, either 'basic' or 'toml'
    kafkaConfigMode: toml
