# Telicent OAuth2 Proxy Internal stand-alone chart

global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.appHostDomain Domain associated with Telicent application services
  appHostDomain: "apps.telicent.io"
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers
  authHostDomain: "auth.telicent.io"
  # @key global.groupsClaim Key used to retrieve groups from the OIDC provider
  groupsClaim: "groups"
  # @key global.istioNamespace Namespace in which Istio is deployed
  # NOTE: Istio, by default, is deployed within the 'istio-system' namespace
  istioNamespace: istio-system
  # @key global.istioServiceAccountName Name of the Istio service account
  istioServiceAccountName: istio-ingress
  # @key global.istioGatewayName Name of the Istio Gateway Resource (LB operating at the edge of the mesh)
  istioGatewayName: ingress-gateway
  kafka:
    # @key global.kafka.bootstrapServers Comma separated list containing Kafka bootstrap servers
    bootstrapServers: "kafka-bootstrap.kafka.svc.cluster.local:9092"
    # @key global.existingKafkaConfigSecretName Name of an existing secret containing Kafka configuration (preferred over individual settings below for security)
    existingKafkaConfigSecretName: ""
    # @key global.kafka.username Username for Kafka authentication
    username: "your.kafka.username.here"
    # @key global.kafka.password Password for Kafka authentication
    password: "your.kafka.password.here"
    # @key global.kafka.protocol Protocol used for Kafka communication
    protocol: "SASL_SSL"
    # @key global.kafka.mechanism SASL mechanism used for Kafka authentication
    mechanism: "SCRAM-SHA-512"
# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
# @key replicaCount Number of replicas for the Data Catalog deployment
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # @key image.repository Data Catalog image repository
  repository: quay.io/telicent/telicent-data-catalog
  # @key image.pullPolicy Data Catalog image pull policy
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # @key image.tag Data Catalog image tag (defaults to chart appVersion if not set)
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
# @key imagePullSecrets Specify registry secret names as an array
imagePullSecrets: []
# This is to override the chart name.
# @key nameOverride String to partially override the chart name
nameOverride: ""
# @key fullnameOverride String to fully override the generated release name
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # @key serviceAccount.create Specifies whether a service account should be created
  # Specifies whether a service account should be created
  create: true
  # @key serviceAccount.automount Automatically mount a ServiceAccount's API credentials?
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # @key serviceAccount.annotations Annotations to add to the service account
  # Annotations to add to the service account
  annotations: {}
  # @key serviceAccount.name The name of the service account to use
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
# @key podAnnotations Annotations to add to the Data Catalog pods
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
# @key podLabels Labels to add to the Data Catalog pods
podLabels: {}

# @key podSecurityContext Security context for the Data Catalog pods
podSecurityContext: {}
  # fsGroup: 2000

# @key securityContext Security context for the Data Catalog containers
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # @key service.type The service type for the Data Catalog
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # @key service.port The service port for the Data Catalog
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# @key resources Resource requests and limits for the Data Catalog
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    # @key livenessProbe.httpGet.path The HTTP path for the liveness probe
    path: /
    # @key livenessProbe.httpGet.port The HTTP port for the liveness probe
    port: http
readinessProbe:
  httpGet:
    # @key readinessProbe.httpGet.path The HTTP path for the readiness probe
    path: /
    # @key readinessProbe.httpGet.port The HTTP port for the readiness probe
    port: http

# @key volumes Additional volumes for the Data Catalog
# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# @key volumeMounts Additional volume mounts for the Data Catalog
# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# @key nodeSelector Node selector for the Data Catalog pods
nodeSelector: {}

# @key tolerations Tolerations for the Data Catalog pods
tolerations: []

# @key affinity Affinity rules for the Data Catalog pods
affinity: {}

istio:
  ingress:
    # @key istio.ingress.principal Principal used for ingress traffic by the Istio AuthorizationPolicy. If not set, a principal is generated using 'global.istioNamespace' and 'global.istioServiceAccountName'
    principal: ""
