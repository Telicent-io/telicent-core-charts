{{- if .Values.global.istioEnabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "data-catalog.fullname" . }}
  labels:
  {{- include "data-catalog.labels" . | nindent 4 }}
spec:
  gateways:
  - {{ .Values.global.istioNamespace }}/{{ .Values.global.istioGatewayName }}
  hosts:
  - {{ .Values.global.appHostDomain }}
  http:
  - match:
    - uri:
        exact: /data-catalog
    redirect:
      uri: /data-catalog/
  - match:
    - uri:
        prefix: /data-catalog/
    route:
    - destination:
        host: {{ include "data-catalog.fullname" . }}
        port:
          number: {{ .Values.service.port }}
{{- end }}
