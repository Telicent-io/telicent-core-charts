{{- if .Values.istio.virtualService.enabled  }}
apiVersion: networking.istio.io/v1
kind: VirtualService

metadata:
  name: {{ include "traefik-proxy.fullname" . }}-auth
  namespace: {{ include "traefik-proxy.namespace" . | quote }}
  labels:
    {{- include "traefik-proxy.labels" . | nindent 4 }}

spec:
  gateways:
  - {{ required "A valid .Values.global.istioNamespace entry required!" .Values.global.istioNamespace }}/{{ required "A valid .Values.global.istioGatewayName entry required!"  .Values.global.istioGatewayName }}
  hosts:
  - {{ required "A valid .Values.global.authHostDomain entry required!" .Values.global.authHostDomain }}
  http:
   - route:
      - destination:
          host: {{ include "traefik-proxy.serviceName" . }}
          port:
            number: {{ .Values.service.auth.port }}

{{- end }}
