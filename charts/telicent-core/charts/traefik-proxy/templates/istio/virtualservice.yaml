{{- if .Values.istio.virtualService.enabled  }}
apiVersion: networking.istio.io/v1
kind: VirtualService

metadata:
  name: {{ include "traefik-proxy.fullname" . }}
  namespace: {{ include "traefik-proxy.namespace" . | quote }}
  labels:
    {{- include "traefik-proxy.labels" . | nindent 4 }}

spec:
  gateways:
  - {{ .Values.global.istioNamespace }}/{{ .Values.global.istioGatewayName }}
  hosts:
  - {{ .Values.global.appHostDomain }}
  {{- toYaml .Values.istio.virtualService.extraHosts | nindent 2 }}
  http:
   - route:
      - destination:
          host: {{ include "traefik-proxy.serviceName" . }}
          port:
            number: {{ .Values.service.port }}

{{- end }}
