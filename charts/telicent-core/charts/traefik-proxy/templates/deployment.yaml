apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "traefik-proxy.fullname" . }}
  namespace: {{ include "traefik-proxy.namespace" . | quote }}
  labels:
    {{- include "traefik-proxy.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations: 
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "traefik-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "traefik-proxy.selectorLabels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        checksum/configRoutesApp: {{ include (print $.Template.BasePath "/configmap-routes-app.yaml") . | sha256sum }}
        checksum/configRoutesApi: {{ include (print $.Template.BasePath "/configmap-routes-api.yaml") . | sha256sum }}
        checksum/configRoutesAuth: {{ include (print $.Template.BasePath "/configmap-routes-auth.yaml") . | sha256sum }}
        checksum/configRoutesCommon: {{ include (print $.Template.BasePath "/configmap-routes-common.yaml") . | sha256sum }}
        checksum/configStartup: {{ include (print $.Template.BasePath "/configmap-startup.yaml") . | sha256sum }}
        checksum/secretForward: {{ include (print $.Template.BasePath "/secret-forward-auth.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      serviceAccountName: {{ include "traefik-proxy.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- $pullSecret := .Values.image.pullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
      {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "traefik-proxy.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        securityContext: {{- toYaml .Values.containerSecurityContext | nindent 10 }}

        env:
        - name: X_FORWARD_AUTH
          valueFrom:
            secretKeyRef:
              key: header
              name: {{ include "traefik-proxy.forwardAuthSecretName" . }}
        {{- range .Values.extraEnvVars }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        args:
        - --configFile=/app/config/config.yaml

        ports:
        # "app" HTTP listener
        - name: http-app
          protocol: TCP
          containerPort: {{ .Values.service.app.port }}

        # "api" HTTP listener
        - name: http-api
          protocol: TCP
          containerPort: {{ .Values.service.api.port }}

          # "auth" HTTP listener
        - name: http-auth
          protocol: TCP
          containerPort: {{ .Values.service.auth.port }}

        # "ping" HTTP
        - name: http-ping
          protocol: TCP
          containerPort: 9000

        {{- if .Values.dashboard.enabled }}
        # traefik api + dashboard
        - name: http-dashboard
          protocol: TCP
          containerPort: 9001
        {{- end }}

        readinessProbe:
          httpGet:
            path: /ping
            port: http-ping
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /ping
            port: http-ping
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 2

        volumeMounts:
        - name: traefik-config-volume
          mountPath: /app/config
          readOnly: true
        - name: traefik-routes-volume
          mountPath: /app/config/routes
          readOnly: true

        {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}

      {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: traefik-config-volume
        configMap:
          name: {{ include "traefik-proxy.startupConfigMapName" . }}
      - name: traefik-routes-volume
        projected:
          sources:
          - configMap:
              name: {{ include "traefik-proxy.routesAppConfigMapName" . }}
          - configMap:
              name: {{ include "traefik-proxy.routesApiConfigMapName" . }}
          - configMap:
              name: {{ include "traefik-proxy.routesAuthConfigMapName" . }}
          - configMap:
              name: {{ include "traefik-proxy.routesCommonConfigMapName" . }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
 
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

