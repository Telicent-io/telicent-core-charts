apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "traefik-proxy.routesCommonConfigMapName" . }}
  namespace: {{ include "traefik-proxy.namespace" . | quote }}
  labels:
    {{- include "traefik-proxy.labels" . | nindent 4 }}

data:
  {{- range $path, $content := .Files.Glob "configs/routes/common/*.yaml" }}
  {{ printf "common-%s" ($path | base) }}: |-
  {{- tpl ($.Files.Get $path) $ | toString | nindent 4 }}
  {{- end }}
