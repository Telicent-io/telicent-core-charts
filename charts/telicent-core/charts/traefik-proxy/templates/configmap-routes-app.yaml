apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "traefik-proxy.routesAppConfigMapName" . }}
  namespace: {{ include "traefik-proxy.namespace" . | quote }}
  labels:
    {{- include "traefik-proxy.labels" . | nindent 4 }}

data:
  {{- range $path, $content := .Files.Glob "configs/routes/app/*.yaml" }}
  {{ printf "app-%s" ($path | base) }}: |-
  {{- tpl ($.Files.Get $path) $ | toString | nindent 4 }}
  {{- end }}
