# Telicent Traefik Proxy stand-alone chart

#
# @section Global Parameters
#
# @descStart
# Contains global parameters, these parameters are mirrored within the Telicent core umbrella chart
# @descEnd
global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.appHostDomain Domain associated with Telicent application/ui services
  appHostDomain: "apps.telicent.io"
  # @key global.apiHostDomain Domain associated with Telicent Api application services
  apiHostDomain: "api.telicent.io"
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers
  authHostDomain: "auth.telicent.live"
  # @key global.groupsClaim Key used to retrieve groups from the OIDC provider
  groupsClaim: "groups"
  # @key global.istioNamespace Namespace in which Istio is deployed
  # Note: By default, Istio namespace is set to 'istio-system'
  istioNamespace: istio-system
  # @key global.istioServiceAccountName Name of the Istio service account
  istioServiceAccountName: istio-ingress
  # @key global.istioGatewayName Name of the Istio Gateway Resource (LB operating at the edge of the mesh)
  istioGatewayName: ingress-gateway
  # @key global.istioVirtualServiceEnabled Enable Istio traffic routing to a named destination service
  istioVirtualServiceEnabled: true

#
# @section Traefik Proxy Logs Parameters
#
logs:
  general:
    # @key logs.general.level Set logging levels, values are: TRACE, DEBUG, INFO, WARN, ERROR, FATAL, and PANIC.
    level: "INFO"
  access:
    # @key logs.access.enabled Enable access logging. Note: should only be enabled in development environments.
    enabled: false

#
# @section Traefik Proxy Dashboard Parameters
#
dashboard:
  # @key dashboard.enabled Enable Traefik dashboard. Note: should only be enabled in development environments.
  enabled: false
  # @key dashboard.domain Domain associated with Traefik dashboard. If not set, 'appHostDomain' will be used
  domain: ""
  # @key dashboard.basepath Set the base path to be used for accessing the dashboard
  basepath: "/traefik"

#
# @section Common Parameters
#
# @key nameOverride String to partially override fullname (will maintain the release name)
nameOverride: ""
# @key fullnameOverride String to fully override the generated release name
fullnameOverride: ""
# @key namespaceOverride String to fully override all deployed resources namespace
namespaceOverride: ""
# @key commonLabels Add labels to all the deployed resources
commonLabels: {}

#
# @section Deployment Parameters
#
# @key replicas Number of Traefik Proxy replicas to deploy
replicas: 1
# @key revisionHistoryLimit Number of controller revisions to keep
revisionHistoryLimit: 5
# @key annotations Add extra annotations to the Deployment Object
annotations: {}
# @key podLabels Add extra labels to the Traefik Proxy pod
podLabels: {}
# @key podAnnotations Add extra annotations to the Traefik Proxy pod
podAnnotations: {}
# @key extraEnvs List of Additional environment variables to set in the pod
extraEnvs: []
# @key extraContainers Additional containers to be added to the pod
extraContainers: []

image:
  # @key image.registry [default: REGISTRY_NAME] Traefik Proxy image registry
  registry: docker.io
  # @key image.repository [default: REPOSITORY_NAME/traefik] Traefik Proxy image name
  repository: traefik
  # @key image.tag Traefik Proxy image tag. If not set, a tag is generated using the appVersion
  tag: ""
  # @key image.pullPolicy Traefik Proxy image pull policy
  pullPolicy: IfNotPresent
# @key imagePullSecrets Specify registry secret names as an array
imagePullSecrets: []

resources:
  requests:
    # @key resources.requests.cpu Set containers' CPU request
    cpu: "125m"
    # @key resources.requests.memory Set containers' memory request
    memory: "512Mi"
  limits:
    # @key resources.limits.cpu Set containers' CPU limit
    cpu: "250m"
    # @key resources.limits.memory Set containers' memory limit
    memory: "768Mi"

containerSecurityContext:
  # @key containerSecurityContext.runAsUser Set containers' Security Context runAsUser User ID
  runAsUser: 185
  # @key containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
  allowPrivilegeEscalation: false
  capabilities:
    # @key containerSecurityContext.capabilities.drop List of capabilities to be dropped
    drop:
      - ALL
  seccompProfile:
    # @key containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
    type: RuntimeDefault

podSecurityContext:
  # @key podSecurityContext.runAsUser Set the provisioning pod's Security Context runAsUser User ID
  runAsUser: 185
  # @key podSecurityContext.runAsGroup Set the provisioning pod's Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key podSecurityContext.runAsNonRoot Set the provisioning pod's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key podSecurityContext.fsGroup Set the provisioning pod's Group ID for the mounted volumes' filesystem
  fsGroup: 185
  seccompProfile:
    # @key podSecurityContext.seccompProfile.type Set the provisioning pod's Security Context seccomp profile
    type: RuntimeDefault

# @key affinity Affinity for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
affinity: {}
# @key nodeSelector Node labels for pod assignment
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
nodeSelector: {}
# @key tolerations Tolerations for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

#
# @section Service Account Parameters
#
serviceAccount:
  # @key serviceAccount.create Specifies whether a service account should be created
  create: true
  # @key serviceAccount.name Name of the ServiceAccount to use. If not set, a name is generated using the fullname
  name: ""
  # @key serviceAccount.annotations Additional custom annotations for the ServiceAccount
  annotations: {}
  # @key serviceAccount.automount Automatically mount a ServiceAccount's API credentials
  automount: true

#
# @section Traefik Proxy Exposure Parameters
#
service:
  app:
    # @key service.app.port Traefik Proxy App/UI service port
    port: 8080
    # @key service.app.type Traefik Proxy App/UI service type
    type: ClusterIP
  api:
    # @key service.api.port Traefik Proxy Api service port
    port: 8081
    # @key service.api.type Traefik Proxy Api service type
    type: ClusterIP

istio:
  virtualService:
    # @key istio.virtualService.enabled Enable Istio traffic into Traefik Proxy
    enabled: true
    # @key istio.virtualService.extraHosts Additional hosts (excluding appHostDomain) to be managed by Traefik Proxy
    extraHosts: []
  ingress:
    # @key istio.ingress.principal Principal used for ingress traffic by the Istio AuthorizationPolicy. If not set, a principal is generated using Release namespace and serviceAccountName
    principal: "cluster.local/ns/istio-system/sa/istio-ingress"
    # @key istio.ingress.serviceAccountName Name of the Ingress service account (istio currently supported)
    serviceAccountName: "istio-ingress"

#
# @section Traefik Proxy Hosts Parameters
#
# @descStart
# Traefik Proxy routes traffic to the various Telicent Apps using their default service names and ports.
# If either of those details changes, you can use this section to correctly referer to those apps.
# Example: overriding Search UI chart value `fullnameOverride: "search-ui"` the correct host value would be `searchUi:"search-ui:8080"`
# @descEnd
hosts:
  # @key hosts.auth Auth host value, If not set a host is generated using service:'auth',port:'9000' and Release namespace & name.
  auth: ""
  # @key hosts.access Access host value, If not set a host is generated using service:'access',port:'8080' and Release namespace & name.
  access: ""
  # @key hosts.accessUi Access host value, If not set a host is generated using service:'access-ui',port:'8080' and Release namespace & name.
  accessUi: ""
  # @key hosts.searchUi Access host value, If not set a host is generated using service:'search-ui',port:'8080' and Release namespace & name.
  searchUi: ""
  # @key hosts.graphUi Graph UI host value, If not set a host is generated using service:'graph-ui',port:'8080' and Release namespace & name.
  graphUi: ""
  # @key hosts.queryUi Query UI host value, If not set a host is generated using service:'query-ui',port:'8080' and Release namespace & name.
  queryUi: ""
  # @key hosts.search Search host value, If not set a host is generated using service:'search',port:'8181' and Release namespace & name.
  search: ""
  # @key hosts.graph Graph host value, If not set a host is generated using service:'graph',port:'3030' and Release namespace & name.
  graph: ""
  # @key hosts.userPreferences User Preferences host value, If not set a host is generated using service:'user-preferences',port:'11111' and Release namespace & name.
  userPreferences: ""
  # @key hosts.oauth2Proxy Oauth2 Proxy host value, If not set a host is generated using service:'oauth2-proxy',port:'4080' and Release namespace & name.
  oauth2Proxy: ""
  # @key hosts.whoami Whoami host value, If not set a host is generated using service:'whoami',port:'8080' and Release namespace & name. AB:test purposes, be removed afterwards
  whoami: ""
