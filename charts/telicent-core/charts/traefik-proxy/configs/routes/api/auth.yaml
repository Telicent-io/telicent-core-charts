# Declare routers / services / middlewares
# users|clients|groups|roles|permissions|sessions
http:
  routers:
    auth-admin:
      rule: {{ printf "Host(`%s`) && PathPrefix(`/auth`)" .Values.global.apiHostDomain }}
      service: auth
      entryPoints:
        - web-api
      middleWares:
        - path-auth-admin
        - host-auth

  middlewares:
    path-auth-admin:
      replacePathRegex:
        regex: "^/auth/(.*)"
        replacement: "/$1"
