apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ include "graph.serviceAccountName" . }}
  namespace: {{ include "graph.namespace" . | quote }}
  labels:
    {{- include "graph.labels" . | nindent 4 }}

  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
