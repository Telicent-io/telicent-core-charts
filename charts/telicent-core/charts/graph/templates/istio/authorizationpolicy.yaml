apiVersion: security.istio.io/v1
kind: AuthorizationPolicy

metadata:
  name: {{ include "graph.fullname" . }}-ingress
  labels:
  {{- include "graph.labels" . | nindent 4 }}

spec:
  selector:
    matchLabels:
    {{- include "graph.selectorLabels" . | nindent 6 }}

  action: ALLOW

  rules:
  - from:
    - source:
        principals:
        - {{ include "graph.ingressPrincipal" . }}
    to:
    - operation:
        methods:
          - GET
          - POST
        paths:
        - /knowledge/sparql
        - /knowledge/sparql/*
        - /knowledge/query
        - /knowledge/query/*
        - /ontology/sparql
        - /ontology/sparql/*
        - /ontology/query
        - /ontology/query/*
        - /catalog/sparql
        - /catalog/sparql/*
        - /catalog/query
        - /catalog/query/*
    - operation:
        methods:
        - POST
        paths:
        - /knowledge/graphql
        - /knowledge/graphql/*
        - /knowledge/shacl
        - /knowledge/shacl/*
