apiVersion: security.istio.io/v1
kind: AuthorizationPolicy

metadata:
  name: {{ include "graph.fullname" . }}-ingress
  labels:
    {{- include "graph.labels" . | nindent 4 }}

spec:
  selector:
    matchLabels:
      {{- include "graph.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
          {{- include "graph.ingressPrincipal" . | nindent 8 }}
    to:
    - operation:
        paths:
        - /knowledge/backups/*
        - /knowledge/sparql
        - /knowledge/sparql/*
        - /knowledge/query
        - /knowledge/query/*
        - /ontology/sparql
        - /ontology/sparql/*
        - /ontology/query
        - /ontology/query/*
        - /catalog/sparql
        - /catalog/sparql/*
        - /catalog/query
        - /catalog/query/*
        methods: ["GET", "POST"]
    - operation:
        paths:
        - /knowledge/graphql
        - /knowledge/graphql/*
        - /knowledge/shacl
        - /knowledge/shacl/*
        methods: ["POST"]
