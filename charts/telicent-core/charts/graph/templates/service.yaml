apiVersion: v1
kind: Service

metadata:
  name: {{ include "graph.serviceName" .}}
  namespace: {{ include "graph.namespace" . | quote }}
  labels:
    {{- include "graph.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "graph.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      appProtocol: http
      targetPort: http
      protocol: TCP
      port: {{ .Values.service.port }}
    
    {{- if .Values.metrics.enabled }}
    - name: {{ .Values.metrics.service.name | default "metrics" }}
      appProtocol: http
      targetPort: metrics
      protocol: TCP
      port: {{ .Values.metrics.service.port }}
     {{- end }}
