{{- if not .Values.configMap.existingEnvConfigMap -}}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "search.envConfigMapName" . }}
  namespace: {{ include "search.namespace" . | quote }}
  labels:
    {{- include "search.labels" . | nindent 4 }}

data:
  FEATURE_FLAG_AUTHZ: "true"
  
  # Elastic Configuration
  ELASTIC_HOST: {{ .Values.elastic.host | quote }}
  ELASTIC_PORT: {{ .Values.elastic.port | quote }}
  OPENSEARCH_COMPATIBILITY: {{ .Values.elastic.opensearchCompatibility | quote }}
  ELASTIC_INDEX: {{ .Values.elastic.index | quote }}

  # Search API Configuration
  FIELD_OPTIONS: {{ .Values.elastic.searchFieldOptions | quote }}
  INDEX_BATCH_SIZE: {{ .Values.elastic.indexBatchSize | quote }}
  JWKS_URL: {{ printf "%s%s%s" "https://" .Values.global.authHostDomain "/oauth2/jwks" | quote }}
  USERINFO_URL: {{ printf "http://%s%s" (include "search.hostAuth" . ) "/userinfo" | quote }}

  # Kafka Connection Details
  BOOTSTRAP_SERVERS: {{ .Values.global.kafka.bootstrapServers | quote }}
  KAFKA_CONFIG_FILE_PATH: /app/config/kafka-auth/kafka-config.properties
  ACTION_TOPIC: {{ .Values.elastic.actionsTopic | quote }}

  # Java Options
  JAVA_OPTIONS: {{ .Values.java.jvmOptions | quote }}
  
  {{- if .Values.metrics.enabled }}
  # Metrics Configuration
  OTEL_METRICS_EXPORTER: "prometheus"
  OTEL_TRACES_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  {{- end }}
{{- end }}