# Telicent OAuth2 Proxy Internal stand-alone chart

global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.appHostDomain Domain associated with Telicent application services
  appHostDomain: "apps.telicent.io"
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers
  authHostDomain: "auth.telicent.io"
  # @key global.groupsClaim Key used to retrieve groups from the OIDC provider
  groupsClaim: "groups"
  # @key global.istioNamespace Namespace in which Istio is deployed
  # Note: By default, Istio namespace is set to 'istio-system'
  istioNamespace: istio-system
  # @key global.istioServiceAccountName Name of the Istio service account
  istioServiceAccountName: istio-ingress
  # @key global.istioGatewayName Name of the Istio Gateway Resource (LB operating at the edge of the mesh)
  istioGatewayName: ingress-gateway

# @section Replica Parameters
# @descStart
# Controls the number of pod replicas for the deployment.
# @descEnd
# @key replicaCount Number of pod replicas to deploy
replicaCount: 1

# @section Existing Config/Secret Parameters
# @descStart
# References to existing ConfigMaps or Secrets for environment and CA certificates.
# @descEnd
# @key existingEnvConfigmapName Name of an existing ConfigMap for environment variables
existingEnvConfigmapName: ""
# @key existingCacertConfigmapName Name of an existing ConfigMap for CA certificates
existingCacertConfigmapName: ""
# @key existingCacertSecretName Name of the secret containing the CA certificates
existingCacertSecretName: ""

# @key existingEnvSecretName Name of an existing Secret for environment variables
existingEnvSecretName: ""

# @section Image Parameters
# @descStart
# Container image configuration for the OAuth2 Proxy.
# @descEnd
image:
  # @key image.repository Container image repository
  repository: quay.io/oauth2-proxy/oauth2-proxy
  # @key image.pullPolicy Image pull policy
  pullPolicy: IfNotPresent
  # @key image.tag Image tag (defaults to chart appVersion if not set)
  tag: "v7.12.0"
# @section Configuration Parameters
# @descStart
# Application Specific configuration for the OAuth2 Proxy.
# @descEnd
configuration:
  # @key configuration.cookieDomain Domain that the cookie is valid for
  cookieDomain: "127.0.0.1.nip.io"
  # @key configuration.cookieExpire Cookie expiration duration
  cookieExpire: "15m"
  # @key configuration.cookieRefresh Cookie refresh duration
  cookieRefresh: "10m"
  # @key configuration.cookieSecret Cookie secret (should be set via existingEnvSecretName) defaults to a random value if not set
  cookieSecret: ""
  # @key configuration.oidcIssuerUrl OIDC issuer URL
  oidcIssuerUrl: "https://127.0.0.1.nip.io/realms/core"
  # @key configuration.redirectUrlOverride OIDC redirect URL override (if not set, appHostDomain + /oauth2/callback will be used)
  redirectUrlOverride: ""
  # @key configuration.oidcClientID OIDC client ID
  oidcClientID: "change-me"
  # @key configuration.clientSecret OIDC client secret (should be set via existingEnvSecretName)
  clientSecret: "change-me"
  # @key configuration.cacert Optional CA certificate data (PEM format) for validating the OIDC provider's TLS certificate
  cacert: ""

# @key imagePullSecrets Registry secret names as an array for private image repositories
imagePullSecrets: []

# @section Chart Naming Parameters
# @descStart
# Override chart and release naming conventions.
# @descEnd
# @key nameOverride String to partially override the chart name
nameOverride: ""
# @key fullnameOverride String to fully override the generated release name
fullnameOverride: ""

# @section Service Account Parameters
# @descStart
# Service account configuration for the deployment.
# @descEnd
serviceAccount:
  # @key serviceAccount.create Specifies whether a service account should be created
  create: true
  # @key serviceAccount.automount Automatically mount a ServiceAccount's API credentials
  automount: true
  # @key serviceAccount.annotations Annotations to add to the service account
  annotations: {}
  # @key serviceAccount.name The name of the service account to use
  name: ""

# @section Pod Metadata Parameters
# @descStart
# Pod-level annotations and labels.
# @descEnd
# @key podAnnotations Annotations to add to the pod
podAnnotations: {}
# @key podLabels Labels to add to the pod
podLabels: {}

# @section Security Context Parameters
# @descStart
# Security context for the pod and container.
# @descEnd
# @key podSecurityContext Pod-level security context
podSecurityContext: {}
  # fsGroup: 2000
# @key securityContext Container-level security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# @section Service Parameters
# @descStart
# Kubernetes Service configuration.
# @descEnd
service:
  # @key service.type Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # @key service.port Service port
  port: 4080

# @section Resources Parameters
# @descStart
# Resource requests and limits for the container.
# @descEnd
# @key resources Resource requests and limits for the container
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# @section Additional Volumes and Mounts
# @descStart
# Additional volumes and volume mounts for the deployment.
# @descEnd
# @key volumes Additional volumes to be added to the pod
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false
# @key volumeMounts Additional volume mounts to be added to the container
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# @section Scheduling Parameters
# @descStart
# Node selection, tolerations, and affinity for pod scheduling.
# @descEnd
# @key nodeSelector Node selector for pod scheduling
nodeSelector: {}

# @key tolerations Tolerations for pod scheduling
tolerations: []

# @key affinity Affinity rules for pod scheduling
affinity: {}

istio:
  ingress:
    # @key istio.ingress.principal Principal used for ingress traffic by the Istio AuthorizationPolicy. If not set, a principal is generated using 'global.istioNamespace' and 'global.istioServiceAccountName'
    principal: ""
