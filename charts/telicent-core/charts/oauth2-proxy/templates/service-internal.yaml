apiVersion: v1
kind: Service
metadata:
  name: {{ include "oauth2-proxy.fullname" . }}-internal
  labels:
    {{- include "oauth2-proxy.labels" . | nindent 4 }}
    {{- include "oauth2-proxy.internalSelectorLabels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "oauth2-proxy.internalSelectorLabels" . | nindent 4 }}
