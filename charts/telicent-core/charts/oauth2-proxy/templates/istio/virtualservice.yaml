{{- if .Values.global.istioVirtualServiceEnabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService

metadata:
  name: {{ include "oauth2-proxy.fullname" . }}
  namespace: {{ include "oauth2-prox.namespace" . | quote }}
  labels:
    {{- include "oauth2-proxy.labels" . | nindent 4 }}

spec:
  gateways:
  - {{ .Values.global.istioNamespace }}/{{ .Values.global.istioGatewayName }}
  hosts:
  - {{ .Values.istio.virtualService.host | default .Values.global.appHostDomain }}
  http:
  - match:
    - uri:
        prefix: /oauth2
    route:
    - destination:
        host: {{ include "oauth2-proxy.serviceName" . }}
        port:
          number: {{ .Values.service.port }}

{{- end }}
