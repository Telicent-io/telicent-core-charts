apiVersion: v1
kind: Service

metadata:
  name: {{ include "oauth2-proxy.serviceName" . }}
  namespace: {{ include "oauth2-proxy.namespace" . | quote }}
  labels:
    {{- include "oauth2-proxy.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "oauth2-proxy.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    appProtocol: http
    targetPort: http
    protocol: TCP
    port: {{ .Values.service.port }}
