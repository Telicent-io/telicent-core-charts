{{- if not .Values.configuration.existingEnvConfigMap -}}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "oauth2-proxy.envConfigMapName" . }}
  namespace: {{ include "oauth2-prox.namespace" . | quote }}
  labels:
    {{- include "oauth2-proxy.labels" . | nindent 4 }}

data:
  OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4080

  OAUTH2_PROXY_PROVIDER: "oidc"
  OAUTH2_PROXY_OIDC_ISSUER_URL: {{ required "You must supply OAUTH2_PROXY_OIDC_ISSUER_URL" .Values.configuration.oidcIssuerUrl | quote }}
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"

  OAUTH2_PROXY_REDIRECT_URL: {{ include "oauth2-proxy.oidcRedirectUrl" . | quote }}

  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
  OAUTH2_PROXY_APPROVAL_PROMPT: none

  # todo: ab: check 'X-Forwarded-Access-Token' should reduce header size (both these were set to true on in helm version)
  OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
  OAUTH2_PROXY_SET_XAUTHREQUEST: "false"

  OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
  OAUTH2_PROXY_SCOPE: openid email groups offline_access profile

  OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_COOKIE_NAME: __Secure-session
  OAUTH2_PROXY_COOKIE_SAMESITE: lax

  OAUTH2_PROXY_COOKIE_EXPIRE: {{ .Values.configuration.cookieExpire | quote }}
  OAUTH2_PROXY_COOKIE_REFRESH: {{ .Values.configuration.cookieRefresh | quote }}

  OAUTH2_PROXY_COOKIE_PATH: "/"
  OAUTH2_PROXY_COOKIE_DOMAINS: {{ .Values.configuration.cookieDomains| default .Values.global.authHostDomain | quote }}
  OAUTH2_PROXY_WHITELIST_DOMAINS:  {{ .Values.configuration.cookieWhiteListDomains | default .Values.global.authHostDomain | quote }}

  # todo: ab: check headers are stripped, should reduce header size
  # strip X-Forwarded-* & Authorization headers, if set by oauth2-proxy
  OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "true"

  # fix - 403 Unable to find a valid CSRF token
  OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST_LIMIT: "5"
  OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
  OAUTH2_PROXY_COOKIE_CSRF_EXPIRE:  {{ .Values.configuration.cookieCsrfExpire | quote }}

  OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"

  # trust 'X-Forwarded-*' headers
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_UPSTREAMS: static://200

  # requests to these paths must already be authenticated with a cookie, or a
  # JWT (if --skip-jwt-bearer-tokens is set). No redirect to login will be done. Return 401 if not
  OAUTH2_PROXY_API_ROUTES: /api/.*$
  # provide developer access via Bearer Token, configure via extraEnvs[]
  # OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"

  # logging
  OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"

{{- end -}}
