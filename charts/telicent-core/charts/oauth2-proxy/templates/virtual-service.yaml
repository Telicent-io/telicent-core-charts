apiVersion: networking.istio.io/v1alpha3
kind: VirtualService

metadata:
  name: {{ include "oauth2-proxy.fullname" . }}
  labels:
  {{- include "oauth2-proxy.labels" . | nindent 4 }}

spec:
  gateways:
  - {{ .Values.global.istioNamespace }}/{{ .Values.global.istioGatewayName }}
  hosts:
  - {{ .Values.global.appHostDomain }}
  http:
  - match:
    - uri:
        prefix: /oauth2
    route:
    - destination:
        host: {{ include "oauth2-proxy.fullname" . }}-external
        port:
          number: {{ .Values.service.port }}
