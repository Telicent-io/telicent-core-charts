apiVersion: v1
kind: Service

metadata:
  name: {{ include "search-projector.serviceName" . }}
  namespace: {{ include "search-projector.namespace" . | quote }}
  labels:
    {{- include "search-projector.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "search-projector.selectorLabels" . | nindent 4 }}
  ports:
  - name: metrics
    appProtocol: http
    protocol: TCP
    targetPort: metrics
    port: {{ .Values.metrics.service.port }}
