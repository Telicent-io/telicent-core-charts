apiVersion: v1
kind: Service

metadata:
  name: {{ include "user-preferences.serviceName" . }}
  namespace: {{ include "user-preferences.namespace" . | quote }}
  labels:
    {{- include "user-preferences.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "user-preferences.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      appProtocol: http
      targetPort: http
      protocol: TCP
      port: {{ .Values.service.port }}

