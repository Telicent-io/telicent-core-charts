apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "user-preferences.envConfigMapName" . }}
  labels:
    {{- include "user-preferences.labels" . | nindent 6 }}

data:
  # Environment variables for the user preferences container
  MONGO_URL: {{ .Values.mongo.url | quote }}
  MONGO_DATABASE: {{ .Values.mongo.database | quote }}
  MONGO_AUTH_DATABASE : {{ .Values.mongo.authDatabase | quote }}
  JAVA_OPTIONS: {{ .Values.configuration.javaOptions | quote }}
  JWKS_URL: {{ printf "%s%s%s" "https://" .Values.global.authHostDomain "/oauth2/jwks" | quote }}
  USERINFO_URL: {{ printf "http://%s.%s:%s%s" "auth" .Release.Namespace "9000" "/userinfo" | quote }}
  FEATURE_FLAG_AUTHZ: "true"
