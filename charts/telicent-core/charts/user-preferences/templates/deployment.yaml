apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "user-preferences.fullname" . }}
  namespace: {{ include "user-preferences.namespace" . | quote }}
  labels:
    {{- include "user-preferences.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations: 
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "user-preferences.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "user-preferences.labels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        checksum/configEnv: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      serviceAccountName: {{ include "user-preferences.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- $pullSecret := .Values.global.imagePullSecrets | default .Values.image.pullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
      {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "user-preferences.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        securityContext: {{- toYaml .Values.containerSecurityContext | nindent 10 }}

        env:
        {{- if .Values.mongo.enabled }}
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: {{ include "user-preferences.mongoSecretName" . }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "user-preferences.mongoSecretName" . }}
        {{- end }}
        {{- if .Values.postgres.enabled }}
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: {{ include "user-preferences.postgresSecretName" . }}
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "user-preferences.postgresSecretName" . }}
        {{- end }}

        {{- range .Values.extraEnvVars }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "user-preferences.envConfigMapName" . }}

        ports:
        - name: http
          protocol: TCP
          containerPort: 11111
 
        {{- if .Values.metrics.enabled }}
        - name: metrics
          protocol: TCP
          containerPort: 9464
        {{- end }}

        readinessProbe:
          httpGet:
            path: /healthz
            port: 11111
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /version-info
            port: 11111
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 5
       
        volumeMounts:
        {{- if .Values.global.truststore.existingSecret }}
        - name: java-truststore
          mountPath: /app/config/truststore
        {{- end }}
        {{- if contains "tls=true" .Values.mongo.url }}
        - name: ca-certificate-volume
          mountPath: {{ .Values.mongo.cacertPath | default "/app/config/ca-certificate" }}
          readOnly: true
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}

      {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- if .Values.global.truststore.existingSecret }}
      - name: java-truststore
        secret:
          secretName: {{ .Values.global.truststore.existingSecret }}
      {{- end }}
      {{- if .Values.mongo.existingCaSecret }}
      - name: ca-certificate-volume
        secret:
          secretName: {{ .Values.mongo.existingCaSecret }}
      {{- end }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
