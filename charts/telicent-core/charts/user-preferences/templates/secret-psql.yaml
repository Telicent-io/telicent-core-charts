{{- if not .Values.postgresSql.existingSecret }}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth

metadata:
  name: {{ include "user-preferences.postgresSqlSecretName" . }}
  namespace: {{ include "user-preferences.namespace" . | quote }}
  labels:
    {{- include "user-preferences.labels" . | nindent 4 }}

data:
  username: {{ .Values.postgresSql.username | b64enc | quote }}
  password: {{ .Values.postgresSql.password | b64enc | quote }}

{{- end -}}
