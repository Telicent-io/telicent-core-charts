{{- if not .Values.ui.existingMapConfigSecretName }}
apiVersion: v1
kind: Secret

metadata:
  name: {{ include "graph-ui.fullname" . }}-secret-config-js
  namespace: {{ include "graph-ui.namespace" . | quote }}
  labels:
    {{- include "graph-ui.labels" . | nindent 4 }}
type: Opaque
data:
    secret-config.js: {{- (include "graph-ui.secretConfigJs" . ) | b64enc | toYaml | indent 1 }}
{{- end }}
