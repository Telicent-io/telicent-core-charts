{{- if not .Values.ui.existingMapConfigSecret }}
apiVersion: v1
kind: Secret
type: Opaque

metadata:
  name: {{ include "graph-ui.mapSecretName" . }}
  namespace: {{ include "graph-ui.namespace" . | quote }}
  labels:
    {{- include "graph-ui.labels" . | nindent 4 }}
data:
  secret-config.js: {{ include "graph-ui.mapJs" . | b64enc }}
{{- end }}
