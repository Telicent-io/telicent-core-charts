{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "ai-model-provider.fullname" . }}
  namespace: {{ include "ai-model-provider.namespace" . | quote }}
  labels:
    {{- include "ai-model-provider.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations: 
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "ai-model-provider.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "ai-model-provider.labels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.metrics.service.port | quote }}
        prometheus.io/scrape: "true"
        {{- end }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      serviceAccountName: {{ include "ai-model-provider.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.gpu.enabled .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}

      {{- $pullSecret := .Values.global.imagePullSecrets | default .Values.image.pullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
      {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "ai-model-provider.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.gpu.enabled }}
        resources:
          {{- $gpuResource := dict .Values.gpu.type (.Values.gpu.count | int64) }}
          {{- if .Values.resources }}
          {{- $limits := merge (default dict (get .Values.resources "limits")) $gpuResource }}
          {{- $merged := merge (dict "limits" $limits) .Values.resources }}
          {{- toYaml $merged | nindent 10 }}
          {{- else }}
          limits:
            {{ .Values.gpu.type }}: {{ .Values.gpu.count }}
          {{- end }}
        {{- else }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        securityContext: {{- toYaml .Values.containerSecurityContext | nindent 10 }}

        env:
        {{- range .Values.extraEnvVars }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}

        ports:
        - name: http
          protocol: TCP
          containerPort: 8181
        {{- if .Values.metrics.enabled }}
        - name: metrics
          protocol: TCP
          containerPort: {{ .Values.metrics.service.port }}
        {{- end }}

        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5

        volumeMounts:
        {{- if .Values.global.truststore.existingSecret }}
        - name: java-truststore
          mountPath: {{ .Values.global.truststore.mountPath | default "/app/config/truststore" }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}

      {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
     
      volumes:
      {{- if .Values.global.truststore.existingSecret }}
      - name: java-truststore
        secret:
          secretName: {{ .Values.global.truststore.existingSecret }}
      {{- end }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
     
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $allTolerations := concat (default list .Values.tolerations) (default list (ternary .Values.gpu.tolerations list .Values.gpu.enabled)) }}
      {{- with $allTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end -}}
