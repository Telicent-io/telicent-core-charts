{{- if .Values.enabled -}}
{{- $root := . -}}
{{- range $instanceName, $instanceConfig := .Values.instances }}
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "data-preparation.fullname" $root }}-{{ $instanceName }}
  namespace: {{ include "data-preparation.namespace" $root | quote }}
  labels:
    {{- include "data-preparation.instanceLabels" (dict "root" $root "instanceName" $instanceName) | nindent 4 }}
  {{- with $root.Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  replicas: {{ $root.Values.replicas }}
  revisionHistoryLimit: {{ $root.Values.revisionHistoryLimit }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "data-preparation.instanceSelectorLabels" (dict "root" $root "instanceName" $instanceName) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data-preparation.instanceLabels" (dict "root" $root "instanceName" $instanceName) | nindent 8 }}
        {{- with $root.Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "data-preparation.application-properties" (dict "instance" $instanceConfig "global" $root.Values.global) | sha256sum }}
      {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      serviceAccountName: {{ include "data-preparation.serviceAccountName" $root }}
      securityContext: {{- toYaml $root.Values.podSecurityContext | nindent 8 }}

      {{- $pullSecret := $root.Values.global.imagePullSecrets | default $root.Values.image.pullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if $root.Values.initContainers }}
      initContainers:
      {{- with $root.Values.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ $root.Chart.Name }}
        image: {{ include "data-preparation.image" $root }}
        imagePullPolicy: {{ $root.Values.image.pullPolicy }}
        resources: {{- toYaml $root.Values.resources | nindent 10 }}
        securityContext: {{- toYaml $root.Values.containerSecurityContext | nindent 10 }}

        env:
        - name: CLIENT_PROPERTIES
          value: /app/config/startup/application.properties
        {{- range $root.Values.extraEnvVars }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}

        ports:
        - name: http
          protocol: TCP
          containerPort: 8000

        readinessProbe:
          httpGet:
            path: /readiness
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /readiness
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 5

        volumeMounts:
        - name: config
          mountPath: /app/config/startup/
          readOnly: true
        {{- with $root.Values.extraVolumeMounts }}
          {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with $root.Values.sidecars }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "data-preparation.fullname" $root }}-{{ $instanceName }}
      {{- with $root.Values.extraVolumes }}
        {{- toYaml . | nindent 6 }}
      {{- end }}

      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end -}}
