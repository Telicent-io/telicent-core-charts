{{- if and (.Values.enabled) (not .Values.existingConfigMapName) -}}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "data-preparation.configMapName" . }}
  namespace: {{ include "data-preparation.namespace" . | quote }}
  labels:
    {{- include "data-preparation.labels" . | nindent 4 }}

data:
  SPARQL_DEFAULT_LABEL: {{ .Values.sparql.defaultLabel | default "!" |  quote }}
  # point to internal graph service
  SPARQL_URL:  {{ printf "http://%s" (include "data-preparation.hostGraph" . )  | quote }}

  JWT_HEADER: "Authorization"
  JWT_USER_ID_ATTR: "preferred_name"
  JWT_ISSUER: {{ printf "https://%s" .Values.global.authHostDomain | quote }}
  # point to the internal auth service only!
  AUTH_SERVER_ALLOW_HTTP: "true"
  AUTH_SERVER_BASE_URL: {{ printf "http://%s" (include "data-preparation.hostAuth" . )  | quote }}


  {{- end }}
