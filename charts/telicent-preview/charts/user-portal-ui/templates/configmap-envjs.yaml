{{- if not .Values.existingUserPortalUIConfigName }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "user-portal-ui.configMapName" . }}
  namespace: {{ include "user-portal-ui.namespace" . }}
  labels:
    {{- include "user-portal-ui.labels" . | nindent 4 }}

data:
  env-config.js: |
    // Initialize window.env
    window.env = window.env || {};
    window.featureFlags = window.featureFlags || {};

    const APP_DOMAIN = "https://{{ .Values.global.appHostDomain }}";
    const API_DOMAIN = "https://{{ .Values.global.apiHostDomain }}";
    const AUTH_DOMAIN = "https://{{ .Values.global.authHostDomain }}";

    // Config
    window.env.SIGN_OUT_URL = `${AUTH_DOMAIN}/logout`;
    window.featureFlags.FF_SKIP_AUTH = false;
    window.featureFlags.FF_DISABLE_SAVED_SEARCHES = false;

    // `APPS_LIBRARY` configures the app cards on the user-portal app.
    //  Each app card renders a name, a short description, a call-to-action and link to open the app.
    window.env.APPS_LIBRARY = [
        {
            id: "telicent-graph",
            name: "GRAPH",
            telicentUITheme: "GraphOrange",
            shortDescription: "Easily navigate the web of information using our state-of-the-art knowledge graph app.",
            url: `${APP_DOMAIN}/graph`,
            buttonText: "Explore graph",
            buttonIconURL: "/user-portal/assets/icons/graph.svg",
            imageURL: `/user-portal/assets/images/graph.png`,
        },
        {
            id: "telicent-search",
            name: "SEARCH",
            telicentUITheme: "DocumentPink",
            shortDescription: "Discover insights with web-like search capability.",
            url: `${APP_DOMAIN}/search`,
            buttonText: "Start searching",
            buttonIconURL: "/user-portal/assets/icons/search.svg",
            imageURL: `/user-portal/assets/images/search.png`,
        },
        {
            id: "telicent-catalog",
            name: "CATALOG",
            telicentUITheme: "DataNavy",
            shortDescription: "Provides an organized overview of the datasets available to you for analysis.",
            url: `${APP_DOMAIN}/data-catalog/`,
            buttonText: "Find your dataset",
            buttonIconURL: "/user-portal/assets/icons/catalog.svg",
            imageURL: `/user-portal/assets/images/catalog.png`,
        },
        // {
        //     id: "telicent-ontology",
        //     name: "ONTOLOGY",
        //     telicentUITheme: "DataNavy",
        //     shortDescription: "A simple way to create, edit and manage ontologies.",
        //     url: `${APP_DOMAIN}/ontology`,
        //     buttonText: "Start modelling",
        //     buttonIconURL: "/user-portal/assets/icons/ontology.svg",
        //     imageURL: `/user-portal/assets/images/ontology.png`,
        // },
        // {
        //     id: "telicent-instance",
        //     name: "INSTANCE",
        //     telicentUITheme: "DocumentPink",
        //     shortDescription: "A tool to create and visualise diagrams for specific ontologies using the Resource Description Framework.",
        //     url: `${APP_DOMAIN}/instance`,
        //     buttonText: "Start building",
        //     buttonIconURL: "/user-portal/assets/icons/instance.svg",
        //     imageURL: `/user-portal/assets/images/instance.png`,
        // },
    ];

    // APIs
    window.env.ACCESS_API_URL = `${API_DOMAIN}/access`;

    // Apps

    window.env.ACCESS_APP_URL = `${APP_DOMAIN}/access`;
    window.env.SEARCH_APP_URL = `${APP_DOMAIN}/search`;

    window.env.FOOTER_LINKS = [
        {
        name: "Column 1 footer links",
        children: [
            {
            name: "FAQ",
            href: "https://telicent.io/faq",
            },
            {
            name: "Application help",
            href: "https://telicent.io/help",
            },
        ],
        },
        {
        name: "Column 2 links",
        children: [
            {
            name: "Accessibility statement",
            href: "https://telicent.io/accessibility",
            },
            {
            name: "GDPR",
            href: "https://telicent.io/gdpr",
            },
            {
            name: "Privacy Policy",
            href: "https://telicent.io/privacy",
            },
        ],
        },
        {
        name: "Column 3 links",
        children: [
            {
            name: "Address 4DY 3LZ \nRegistered office",
            href: "https://telicent.io/contact",
            },
        ],
        },
        { src: "telicent" },
    ];

    window.env.USER_PREF_API_URL = `${API_DOMAIN}/user-preferences`

    window.feAppOptions = {
    // 🚨 WARNING: ENCODE_SEARCH_PARAMS_MODE must be the same in search, graph, and user-portal 🚨
    // ENCODE_SEARCH_PARAMS_MODE: "as uri component", // default if unset
    ENCODE_SEARCH_PARAMS_MODE: 'as base64',
    };
    
    window.featureFlags = {
      FF_AI_TRANSLATE: false,
      FF_AUTH_V2: true,
    };
    
    window.AUTH_V2_CONFIG = {
      authServerUrl: "https://{{ .Values.global.authHostDomain }}",
      clientId: "{{ .Values.oauth.clientId }}",
      scope: "{{ .Values.oauth.scopes }}",
      redirectUri: "https://{{ .Values.global.appHostDomain }}/user-portal/callback",
      popupRedirectUri: "https://{{ .Values.global.appHostDomain }}/user-portal/auth-redirect-uri",
    };

{{- end }}
