apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "user-portal-ui.fullname" .}}-ingress
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - {{ include "user-portal-ui.ingressPrincipal" .}}
    to:
    - operation:
        methods:
        - GET
  selector:
    matchLabels:
      {{ include "user-portal-ui.selectorLabels" . }}
