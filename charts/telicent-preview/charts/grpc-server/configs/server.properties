#
# Data Sharing gRPC Server - Configuration
#
# ── Listening ────────────────────────

# gRPC server port (default: 8080)
server.port={{ .Values.server.port }}

# ── TLS / mTLS ───────────────────────

# Enable TLS for the gRPC server (default: false)
server.tlsEnabled={{ .Values.server.tls.enabled }}

# Enable mutual TLS client authentication; requires server.tlsEnabled=true (default: false)
server.mTLSAuth={{ .Values.server.tls.mTLS.enabled }}

# Path to server private key file (required when server.tlsEnabled=true)
server.privateKeyFile={{ ternary "/app/config/tls/tls.key" "" .Values.server.tls.enabled }}

# Path to server certificate chain PEM file (required when server.tlsEnabled=true)
server.certChainFile={{ ternary "/app/config/tls/tls.crt" "" .Values.server.tls.enabled }}

# Path to CA PEM file for client certificate verification (enables ClientAuth.REQUIRE)
server.caPem={{ ternary "/app/config/tls/ca.crt" "" .Values.server.tls.caIncluded }}

# ── gRPC Server Tuning ───────────────

# Keep-alive ping interval in seconds (default: 5)
server.keepAliveTime={{ .Values.server.keepAliveTimeSecs }}

# Keep-alive ping timeout in seconds (default: 1)
server.keepAliveTimeout={{ .Values.server.keepAliveTimeoutSecs }}

# ── Shared Headers ───────────────────

# Kafka headers to include in gRPC messages; '^' separated (default: Content-Type)
shared.headers={{ .Values.server.kafka.sharedHeaders }}

# ── Kafka (Source Consumer) ──────────

# Kafka bootstrap servers
kafka.bootstrapServers={{ .Values.global.kafka.bootstrapServers }}

# Kafka consumer group
kafka.consumerGroup={{ .Values.server.kafka.consumerGroup | default "server-cg" }}

# Maximum records per Kafka poll
kafka.pollRecords={{ .Values.server.kafka.pollRecords }}

# Kafka poll timeout in ISO-8601 duration format (default: PT2S)
kafka.pollDuration={{ .Values.server.kafka.pollDuration }}

# Starting offset; 0 = from beginning (default: 0)
kafka.offset={{ .Values.server.kafka.offset }}

# Key deserializer class for the Kafka consumer
kafka.defaultKeyDeserializerClass={{ .Values.server.kafka.keyDeserializerClass }}

# Value deserializer class for the Kafka consumer
kafka.defaultValueDeserializerClass={{ .Values.server.kafka.valueDeserializerClass }}

# Path to Kafka SASL/SSL auth properties file (empty = no auth)
kafka.auth.filepath=/app/config/kafka-auth/kafka-config.properties

# ── Authorization / Storage ──────────

# Path to the storage configuration properties file (data sharing agreement store)
ds.authz.config.filepath=/app/config/storage.properties

# Cache TTL in seconds for authorization lookups (default: 5)
data.sharing.authz.expiry={{ .Values.server.authzExpirySecs }}
