{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ include "notifications-projector.postgresSecretName" . }}
  namespace: {{ include "notifications-projector.namespace" . | quote }}
  labels:
    {{- include "notifications-projector.labels" . | nindent 4 }}

data:
  username: {{ .Values.postgres.username | b64enc | quote }}
  password: {{ .Values.postgres.password | b64enc | quote }}
{{- end }}
