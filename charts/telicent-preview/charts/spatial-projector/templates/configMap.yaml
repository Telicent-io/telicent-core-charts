{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spatial-projector.fullname" . }}-config
  labels:
    {{- include "spatial-projector.labels" . | nindent 4 }}
data:
  BOOTSTRAP_SERVERS: {{ .Values.global.kafka.bootstrapServers }}
  SOURCE_TOPIC: {{ .Values.configuration.sourceTopic}}
  AUTO_ENABLE_DLQ: "True"
  GEO_CLEAN_POSTGRESQL_SC: geo_clean
  GEO_CLEAN_POSTGRESQL_PORT: "5432"
  GEO_CLEAN_POSTGRESQL_HOST: {{.Values.postgres.uri }}
  GEO_CLEAN_POSTGRESQL_SC: {{ .Values.postgres.db }}
  KAFKA_CONFIG_MODE: "toml"
{{- end }} 
