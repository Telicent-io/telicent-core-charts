{{- if and .Values.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spatial-projector.postgresSecretName" . }}
  labels:
    {{- include "spatial-projector.labels" . | nindent 4 }}
data:
  POSTGRES_PASSWORD: {{ .Values.postgres.password }}

{{- end}}

