{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "notifications.fullname" . }}
  labels:
    {{- include "notifications.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 22222
      protocol: TCP
      name: http
  selector:
    {{- include "notifications.selectorLabels" . | nindent 4 }}
{{- end }}