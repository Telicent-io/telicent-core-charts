{{- if .Values.enabled -}}
apiVersion: v1
kind: Service

metadata:
  name: {{ include "notifications.fullname" . }}
  namespace: {{ include "notifications.namespace" . | quote }}
  labels:
    {{- include "notifications.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "notifications.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    appProtocol: http
    protocol: TCP
    targetPort: http
    port: {{ .Values.service.port }}
{{- end }}
