{{- if and .Values.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth

metadata:
  name: {{ include "notifications.postgresSecretName" . }}
  namespace: {{ include "notifications.namespace" . | quote }}
  labels:
    {{- include "notifications.labels" . | nindent 4 }}

data:
  username: {{ .Values.postgres.username | b64enc | quote }}
  password: {{ .Values.postgres.password | b64enc | quote }}
{{- end }}
