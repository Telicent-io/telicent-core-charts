# Telicent *Notifications* stand-alone chart

#
# @section Global Parameters
#
# @descStart
# Contains global parameters; these parameters are mirrored within the Telicent preview umbrella chart.
# Note: Only global parameters used within this chart will be listed below.
# @descEnd
global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.enabled enabled Enable *Notifications Projector* deployment
  enabled: false

  # @key global.releaseNameTelicentCore Release name used during the Telicent Core chart installation. Note: ensure the value is correct, otherwise there will be no access to auth
  # If installed through the parent-chart this value needs to reflect the name of the release name used when 'telicent-core' chart was installed.
  # If all applications were installed through sub-charts, leaving this value empty will provide the correct behavior.
  releaseNameTelicentCore: ""

  # @key global.appHostDomain Domain associated with Telicent application/ui services. This value cannot be changed after it is set
  appHostDomain: ""
  # @key global.apiHostDomain Domain associated with Telicent Api services. This value cannot be changed after it is set
  apiHostDomain: ""
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers. This value cannot be changed after it is set
  authHostDomain: ""

  kafka:
    # @key global.kafka.bootstrapServers Comma separated list containing Kafka bootstrap servers
    bootstrapServers: "kafka-bootstrap.kafka.svc.cluster.local:9092"
    # @key global.kafka.existingConfigSecretName Name of an existing secret containing Kafka configuration (preferred over individual settings below for security)
    existingConfigSecretName: ""
    # @key global.kafka.username Username for Kafka authentication
    username: "your.kafka.username.here"
    # @key global.kafka.password Password for Kafka authentication
    password: "your.kafka.password.here"
    # @key global.kafka.protocol Protocol used for Kafka communication
    protocol: "SASL_SSL"
    # @key global.kafka.mechanism SASL mechanism used for Kafka authentication
    mechanism: "SCRAM-SHA-512"

  truststore:
    # @key global.truststore.existingSecret Name of an existing secret containing the truststore
    existingSecret: ""
    # @key global.truststore.mountPath The mount path for the truststore in the container
    mountPath: /app/config/truststore

#
# @section Application Parameters - Kafka
#
# @descStart
# Contains Kafka topic configuration for the *Notifications* application
# @descEnd
notifications:
  topics:
    # @key notifications.topics.inputTopic Topic to consume messages from
    inputTopic: notifications
    # @key notifications.topics.dlqTopic Dead-letter topic for failed messages
    dlqTopic: notifications.dlq

#
# @section Application Parameters - Validation (Apicurio schema registry)
#
validation:
  # @key validation.enabled Enable JSON Schema validation
  enabled: false
  registry:
    # @key validation.registry.hostname Name for the Apicurio schema registry
    hostname: http://apicurio
    # @key validation.registry.port Port for the Apicurio schema registry
    port: 8080

#
# @section Application Parameters - PostgreSQL and Secret
#
# @descStart
# The following contains connection details to a PostgreSQL instance, on which the application relies.
# It is recommended to store sensitive information including passwords in a Kubernetes secret and not in Helm values.
# For Quick Start purposes, a secret named `tc-auth-usr-psql-notifications` will be created if one is not set.
# @descEnd
postgres:
  # @key postgres.jdbcUrl PostgreSQL connection URL format: "jdbc:postgresql://{host}:{port}/{database}"
  jdbcUrl: ""
 # @key postgres.existingSecret Name of an existing secret. The secret must contain 2 keys: 'username', 'password'
  # Note: Left unset, it will create a secret named: tc-auth-usr-psql-notifications
  existingSecret: ""
  # @key postgres.username PostgreSQL username
  # Note: For additional security, the username is read from the secret, as defined by 'existingSecret' and not from this value!
  username: ""
  # @key postgres.password PostgreSQL password
  password: ""

#
# @section ConfigMap Parameters
#
# @descStart
# Contains configuration parameters specific to the *Notifications* application
# @descEnd
configMap:
  # @key configMap.existingEnvConfigMap Name of existing configmap containing *Notifications* Environment Configuration
  # Note: When it's set it will disable configmap creation.
  existingEnvConfigMap: ""

#
# @section Common Parameters
#
# @key nameOverride String to partially override fullname (will maintain the release name)
nameOverride: ""
# @key fullnameOverride String to fully override the generated release name
fullnameOverride: ""
# @key namespaceOverride String to fully override all deployed resources namespace
namespaceOverride: ""
# @key commonLabels Add labels to all the deployed resources
commonLabels: {}

#
# @section Deployment Parameters
#
# @key replicas Number of *Notifications* replicas to deploy
replicas: 1
# @key revisionHistoryLimit Number of controller revisions to keep
revisionHistoryLimit: 5

# @key annotations Add extra annotations to the deployment object
annotations: {}
# @key podLabels Add extra labels to the *Notifications* pod
podLabels: {}
# @key podAnnotations Add extra annotations to the *Notifications* pod
podAnnotations: {}
# @key extraEnvVars Array with extra environment variables to add to *Notifications* pod
# Supports both plain values and valueFrom (e.g. secretKeyRef) for injecting secret values.
# Use valueFrom.secretKeyRef to supply a confidential client secret referenced by client_secret_env_var_name.
# Example:
# extraEnvVars:
# - name: FOO
#   value: instance
# - name: CLIENT_1_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: my-k8s-secret
#       key: client_secret
extraEnvVars: []
# @key extraVolumes Optionally specify extra list of additional volumes
extraVolumes: []
# @key extraVolumeMounts Optionally specify extra list of additional volumeMounts
extraVolumeMounts: []
# @key initContainers Add init containers to the pod
initContainers: []
# Example:
# sidecars:
# - name: your-image-name
#   image: your-image
#   ports:
#   - name: portname
#     containerPort: 1234
# @key sidecars Add sidecars to the pod
sidecars: []

#
# @section Deployment Image Parameters
#
image:
  # @key image.registry *Notifications* image registry
  registry: quay.io
  # @key image.repository *Notifications* image name
  repository: telicent/telicent-notifications-api-server
  # @key image.tag *Notifications* image tag. If not set, a tag is generated using the appVersion
  tag: ""
  # @key image.pullPolicy *Notifications* image pull policy
  pullPolicy: IfNotPresent
  # @key image.pullSecrets Specify registry secret names as an array
  pullSecrets: []

#
# @section Deployment Resources Parameters - Requests and Limits
#
# @key resources Resources for *Notifications* containers
resources: {}
#  requests:
#    # @key resources.requests.cpu Set containers' CPU request
#    cpu: "1000m"
#    # @key resources.requests.memory Set containers' memory request
#    memory: "4000Mi"
#  limits:
#    # @key resources.limits.cpu Set containers' CPU limit
#    cpu: "2000m"
#    # @key resources.limits.memory Set containers' memory limit
#    memory: "8000Mi"

#
# @section Deployment Security Context Parameters - Default Security Context
#
podSecurityContext:
  # @key podSecurityContext.runAsUser Set the provisioning pod's Security Context runAsUser User ID
  runAsUser: 185
  # @key podSecurityContext.runAsGroup Set the provisioning pod's Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key podSecurityContext.runAsNonRoot Set the provisioning pod's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key podSecurityContext.fsGroup Set the provisioning pod's Group ID for the mounted volumes' filesystem
  fsGroup: 185
  seccompProfile:
    # @key podSecurityContext.seccompProfile.type Set the provisioning pod's Security Context seccomp profile
    type: RuntimeDefault
containerSecurityContext:
  # @key containerSecurityContext.runAsUser Set containers' Security Context runAsUser User ID
  runAsUser: 185
  # @key containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
  allowPrivilegeEscalation: false
  capabilities:
    # @key containerSecurityContext.capabilities.drop List of capabilities to be dropped
    drop:
      - ALL
  seccompProfile:
    # @key containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
    type: RuntimeDefault

#
# @section Deployment Affinity Parameters
#
# @key affinity Affinity for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
affinity: {}
# @key nodeSelector Node labels for pod assignment
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
nodeSelector: {}
# @key tolerations Tolerations for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

#
# @section Service Account Parameters
#
serviceAccount:
  # @key serviceAccount.create Specifies whether a service account should be created
  create: true
  # @key serviceAccount.name Name of the ServiceAccount to use. If not set, a name is generated using the fullname
  name: ""
  # @key serviceAccount.annotations Additional custom annotations for the ServiceAccount
  annotations: {}
  # @key serviceAccount.automount Automatically mount a ServiceAccount's API credentials
  automount: true

#
# @section Traffic Exposure Parameters
#
service:
  # @key service.name *Notifications* service name. If not set, a name is generated using the fullname
  name: ""
  # @key service.port *Notifications* service port
  port: 8080
  # @key service.type *Notifications* service type
  type: ClusterIP

#
# @section Metrics (Prometheus) Exposure Parameters
#
metrics:
  # @key metrics.enabled Enable Prometheus metrics
  enabled: true
  service:
    # @key metrics.service.name Name for the Prometheus service
    name: metrics
    # @key metrics.service.port Port for the Prometheus service
    port: 9464

#
# @section Host(s) Core Parameters - Contains host information for applications deployed via *telicent-core* chart
#
# @descStart
# *Notifications* interacts with applications deployed via *telicent-core* using their default service/serviceAccount and port.
# If either of those details changes, you can use this section to correctly refer to those applications.
# @descEnd
hostsCore:
  # @key hostsCore.enableAutoCorrect Prefix 'global.releaseNameTelicentCore' value to each host value. Alternatively, the host value will be used as it is, without any modification
  enableAutoCorrect: true
  # @key hostsCore.traefikProxy Traefik Proxy application default host value, as defined by 'service/serviceAccount:port'
  traefikProxy: "traefik-proxy:8080"
  # @key hostsCore.auth Auth application default host value, as defined by 'service/serviceAccount:port'
  auth: "auth:8080"
