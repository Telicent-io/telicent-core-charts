#
# @section Global Parameters
#
# @descStart
# Contains global parameters; these parameters are mirrored within the Telicent preview umbrella chart.
# Note: Only global parameters used within this chart will be listed below.
# @descEnd
global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.enabled enabled Enable *GRPC Client* deployment
  enabled: false

  kafka:
    # @key global.kafka.bootstrapServers Comma separated list containing Kafka bootstrap servers
    bootstrapServers: "kafka-bootstrap.kafka.svc.cluster.local:9092"
    # @key global.kafka.existingConfigSecretName Name of an existing secret containing Kafka configuration
    existingConfigSecretName: ""
    # @key global.kafka.username Username for Kafka authentication
    username: "your.kafka.username.here"
    # @key global.kafka.password Password for Kafka authentication
    password: "your.kafka.password.here"
    # @key global.kafka.protocol Protocol used for Kafka communication
    protocol: "SASL_SSL"
    # @key global.kafka.mechanism SASL mechanism used for Kafka authentication
    mechanism: "SCRAM-SHA-512"

  truststore:
    # @key global.truststore.existingSecret Name of an existing secret containing the truststore
    existingSecret: ""
    # @key global.truststore.mountPath The mount path for the truststore in the container
    mountPath: /app/config/truststore/

#
# @section Application Parameters - PostgreSQL and Secret
#
# @descStart
# The following contains connection details to a PostgreSQL instance, on which the application relies.
# It is recommended to store sensitive information including passwords in a Kubernetes secret and not in Helm values.
# For Quick Start purposes, a secret named `tc-auth-usr-psql-grpc-client` will be created if one is not set.
# @descEnd
postgres:
 # @key postgres.jdbcUrl PostgreSQL connection URL format: "jdbc:postgresql://{host}:{port}/{database}"
  jdbcUrl: ""
  # @key postgres.existingSecret Name of an existing secret. The secret must contain 2 keys: 'username', 'password'
  # Note: Left unset, it will create a secret named: tc-auth-usr-psql-grpc-client
  existingSecret: ""
  # @key postgres.username PostgreSQL username
  # Note: For additional security, the username is read from the secret, as defined by 'existingSecret' and not from this value!
  username: ""
  # @key postgres.password PostgreSQL password
  password: ""

#
# @section Application Parameters - Client
#
# @descStart
# Contains parameters specific to the *GRPC Client* application
# @descEnd
client:
  # @key client.id Unique client identifier. Used for offset tracking, gRPC request identification, and server-side logging. Must be unique when multiple clients share a storage backend.
  id: "org1"
  server:
    # @key client.server.host Hostname of the gRPC data sharing server
    host: ""
    # @key client.server.port Port of the gRPC data sharing server
    port: 80
  tls:
    # @key client.tls.enabled Enable TLS for the gRPC channel
    enabled: false
    mTLS:
      # @key client.tls.mTLS.enabled IF TLS support is enabled, require clients to provide certificates
      enabled: false
      # @key client.tls.mTLS.existingSecret Name of an existing secret containing the secret
      existingSecret: ""

  grpc:
   # @key client.grpc.keepAliveTimeSecs Interval in seconds between gRPC keep-alive pings sent to the server
   keepAliveTimeSecs: 30
   # @key client.grpc.keepAliveTimeoutSecs Time in seconds to wait for a keep-alive ping response before considering the connection dead
   keepAliveTimeoutSecs: 10
   # @key client.grpc.idleTimeoutSecs Time in seconds after which an idle gRPC channel is closed
   idleTimeoutSecs: 10
  retry:
    # @key client.retry.maxAttempts Maximum number of retry attempts before giving up. Set to 0 for unlimited retries
    maxAttempts: 200
    # @key client.retry.initialBackoffMillis Initial backoff period in milliseconds. Doubles after each retry up to 'maxBackoffMilliSecs'
    initialBackoffMillis: 500
    # @key client.retry.maxBackoffMillis Maximum backoff period in milliseconds (ceiling for exponential backoff)
    maxBackoffMillis: 60000
    # @key client.retry.forever When true, the client loops continuously after processing completes, polling for new data. When false, exits after one successful cycle
    forever: true
  kafka:
    # @key client.kafka.consumerGroup Kafka consumer group ID, Left unset defaults to: {client-id}-cg
    consumerGroup: ""
    # @key client.kafka.topicSuffix Suffix appended to each topic name when producing to local Kafka. Final topic name is {remote-topic}-{client-id}{suffix}
    topicSuffix: "-staging"
    # @key client.kafka.keySerializerClass Fully qualified class name for the Kafka key serializer
    keySerializerClass: "org.apache.kafka.common.serialization.BytesSerializer"
     # @key client.kafka.valueSerializerClass Fully qualified class name for the Kafka value serializer
    valueSerializerClass: "org.apache.kafka.common.serialization.BytesSerializer"

#
# @section Application Parameters - Java
#
# @descStart
# Contains Java parameters to be used by the *GRPC Client* application
# @descEnd
java:
  # @key java.jvmOptions JVM options for the application
  jvmOptions: "-XX:MaxRAMPercentage=80.0"

#
# @section Application Parameters - Logs
#
logs:
  root:
    # @key logs.root.level Sets the baseline log level. Only warnings and errors from third-party libraries (gRPC, Netty, Flyway, etc.) are logged by default. Values include: ERROR, WARN, INFO, DEBUG, TRACE
    level: "WARN"
  app:
    # @key logs.app.level Controls log verbosity for all application code. Set to DEBUG for detailed troubleshooting. Values include: ERROR, WARN, INFO, DEBUG, TRACE
    level: "INFO"
  kafka:
    # @key logs.kafka.level Repo package Logging Level. ontrols Kafka client logging independently. Kafka clients are particularly verbose at INFO, so this defaults to WARN. Set to INFO or DEBUG to diagnose connectivity or consumer group issues. Values include: ERROR, WARN, INFO, DEBUG, TRACE
    level: "WARN"

