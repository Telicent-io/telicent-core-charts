#
# @section Deployment Image Parameters
#
image:
  # @key image.registry *GRPC Client* image registry
  registry: quay.io
  # @key image.repository *GRPC Client* image name
  repository: telicent/grpc-client
  # @key image.tag *GRPC Client* image tag. If not set, a tag is generated using the appVersion
  tag: ""
  # @key image.pullPolicy *GRPC Client* image pull policy
  pullPolicy: IfNotPresent
  # @key image.pullSecrets Specify registry secret names as an array
  pullSecrets: []

