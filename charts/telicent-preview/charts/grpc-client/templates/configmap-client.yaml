apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "grpc-client.clientConfigMapName" . }}
  namespace: {{ include "grpc-client.namespace" . | quote }}
  labels:
    {{- include "grpc-client.labels" . | nindent 4 }}

data:
  client.properties: |-
  {{- tpl ($.Files.Get "configs/client.properties") . | nindent 4 }}
