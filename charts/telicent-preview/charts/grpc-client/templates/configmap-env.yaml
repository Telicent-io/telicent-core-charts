{{- if and (.Values.enabled) (not .Values.existingConfigMapName) -}}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "grpc-client.configMapName" . }}
  namespace: {{ include "grpc-client.namespace" . | quote }}
  labels:
    {{- include "grpc-client.labels" . | nindent 4 }}

data:
  CLIENT_PROPERTIES: /app/config/client.properties
  LOG_LEVEL_ROOT: {{ .Values.logs.root.level | quote  }}
  LOG_LEVEL_APP: {{ .Values.logs.app.level | quote  }}
  LOG_LEVEL_KAFKA: {{ .Values.logs.kafka.level | quote  }}
  {{- end }}
