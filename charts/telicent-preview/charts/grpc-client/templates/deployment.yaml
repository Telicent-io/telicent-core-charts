{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "grpc-client.fullname" . }}
  namespace: {{ include "grpc-client.namespace" . | quote }}
  labels:
    {{- include "grpc-client.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "grpc-client.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grpc-client.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/configEnv: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        checksum/configStorage: {{ include (print $.Template.BasePath "/configmap-storage.yaml") . | sha256sum }}
        checksum/configClient: {{ include (print $.Template.BasePath "/configmap-client.yaml") . | sha256sum }}

      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      serviceAccountName: {{ include "grpc-client.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- $pullSecret := .Values.global.imagePullSecrets | default .Values.image.pullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
      {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "grpc-client.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        securityContext: {{- toYaml .Values.containerSecurityContext | nindent 10 }}

        env:
        - name: POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: {{ include "grpc-client.postgresSecretName" . }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "grpc-client.postgresSecretName" . }}

        {{- range .Values.extraEnvVars }}
        - name: {{ .name  }}
          value: {{ .value | quote }}
        {{- end }}

        envFrom:
        - configMapRef:
            name: {{ include "grpc-client.configMapName" . }}

        ports:
        - name: http
          protocol: TCP
          containerPort: 8000

        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 15021
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz/ready
            port: 15021
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 5

        volumeMounts:
        - name: kafka-auth-config
          mountPath: /app/config/kafka-auth/
        - name: client-config-volume
          mountPath: /app/config/client.properties
          subPath: client.properties
          readOnly: true
        - name: storage-config-volume
          mountPath: /app/config/storage.properties
          subPath: storage.properties
          readOnly: true
        {{- if .Values.global.truststore.existingSecret }}
        - name: java-truststore
          mountPath: {{ .Values.global.truststore.mountPath | default "/app/config/truststore" }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}

      {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: kafka-auth-config
        secret:
        {{- if .Values.global.kafka.existingConfigSecretName }}
          secretName: {{ .Values.global.kafka.existingConfigSecretName }}
        {{- else }}
          secretName: {{ include "grpc-client.fullname" . }}-kafka-config
        {{- end }}
      - name: client-config-volume
        configMap:
          name: {{ include "grpc-client.clientConfigMapName" . }}
      - name: storage-config-volume
        configMap:
          name: {{ include "grpc-client.storageConfigMapName" . }}
      {{- if .Values.global.truststore.existingSecret }}
      - name: java-truststore
        secret:
          secretName: {{ .Values.global.truststore.existingSecret }}
      {{- end }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end -}}
