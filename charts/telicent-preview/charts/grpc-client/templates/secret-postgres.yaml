{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth

metadata:
  name: {{ include "grpc-client.postgresSecretName" . }}
  namespace: {{ include "grpc-client.namespace" . | quote }}
  labels:
    {{- include "grpc-client.labels" . | nindent 4 }}

data:
  username: {{ .Values.postgres.username | b64enc | quote }}
  password: {{ .Values.postgres.password | b64enc | quote }}

{{- end -}}
