{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spatial.fullname" . }}
  labels:
    {{- include "spatial.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "spatial.selectorLabels" . | nindent 4 }}
{{- end }}
