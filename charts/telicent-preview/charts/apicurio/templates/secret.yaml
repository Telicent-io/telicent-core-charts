{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apicurio.postgresSecretName" . }}
  namespace: {{ include "apicurio.namespace" . | quote }}
  labels:
    {{- include "apicurio.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.postgres.username | b64enc | quote }}
  password: {{ .Values.postgres.password | b64enc | quote }}
{{- end }}