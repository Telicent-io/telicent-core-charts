{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "apicurio.fullname" . }}
  namespace: {{ include "apicurio.namespace" . | quote }}
  labels:
    {{- include "apicurio.labels" . | nindent 4 }}

data:
  QUARKUS_OIDC_TENANT_ENABLED: {{ .Values.config.oidcTenantEnabled | quote }}
  QUARKUS_OIDC_AUTH_SERVER_URL: {{ printf "http://%s" (include "apicurio.hostAuth" .) | quote }}
  QUARKUS_OIDC_CLIENT_ID: {{ .Values.config.oidcClientId | quote }}
  QUARKUS_OIDC_DISCOVERY_ENABLED: {{ .Values.config.oidcDiscoveryEnabled | quote }}
  QUARKUS_OIDC_JWKS_PATH: {{ .Values.config.oidcJwksPath | quote }}
  QUARKUS_OIDC_TOKEN_ISSUER: {{ .Values.config.oidcTokenIssuer | default (printf "https://%s" .Values.global.authHostDomain) | quote }}
  APICURIO_STORAGE_SQL_KIND: "postgresql"
  APICURIO_DATASOURCE_URL: {{ .Values.postgres.jdbcUrl | quote }}
{{- end }}