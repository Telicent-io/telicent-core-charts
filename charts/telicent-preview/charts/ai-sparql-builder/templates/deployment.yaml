{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "ai-sparql-builder.fullname" . }}
  namespace: {{ include "ai-sparql-builder.namespace" . | quote }}
  labels:
    {{- include "ai-sparql-builder.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations: 
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "ai-sparql-builder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-sparql-builder.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}     
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    
    spec:
      serviceAccountName: {{ include "ai-sparql-builder.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.gpu.enabled .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}

      {{- $pullSecret := .Values.global.imagePullSecrets | default .Values.image.pullSecrets }}
      {{- with $pullSecret }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
      {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "ai-sparql-builder.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.command }}
        command:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.args }}
        args:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.gpu.enabled }}
        resources:
          {{- $gpuResource := dict .Values.gpu.type (.Values.gpu.count | int64) }}
          {{- if .Values.resources }}
          {{- $limits := merge (default dict (get .Values.resources "limits")) $gpuResource }}
          {{- $merged := merge (dict "limits" $limits) .Values.resources }}
          {{- toYaml $merged | nindent 10 }}
          {{- else }}
          limits:
            {{ .Values.gpu.type }}: {{ .Values.gpu.count }}
          {{- end }}
        {{- else }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        securityContext: {{- toYaml .Values.containerSecurityContext | nindent 10 }}

        {{- if .Values.extraEnvVars }}
        env:
        {{- range .Values.extraEnvVars }}
        - name: {{ .name  }}
          value: {{ .value | quote }}
        {{- end }}
        {{- end }}

        envFrom:
        - configMapRef:
            name: {{ include "ai-sparql-builder.configMapName" . }}

        ports:
        - name: http
          protocol: TCP
          containerPort: 8000
    
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 5

          {{- if .Values.extraVolumeMounts }}
          volumeMounts:
          {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
       
      {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.extraVolumes }}
      volumes:
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}

      {{- if or .Values.affinity (and .Values.gpu.enabled .Values.gpu.nodeAffinity) }}
      affinity:
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: {{ .Values.gpu.nodeAffinity.labelKey }}
                operator: {{ .Values.gpu.nodeAffinity.operator }}
                {{- with .Values.gpu.nodeAffinity.values }}
                values:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $allTolerations := concat (default list .Values.tolerations) (default list (ternary .Values.gpu.tolerations list .Values.gpu.enabled)) }}
      {{- with $allTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end -}}
