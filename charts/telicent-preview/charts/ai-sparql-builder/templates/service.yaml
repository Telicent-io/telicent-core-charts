{{- if .Values.enabled -}}
apiVersion: v1
kind: Service

metadata:
  name: {{ include "ai-sparql-builder.serviceName" . }}
  namespace: {{ include "ai-sparql-builder.namespace" . | quote }}
  labels:
    {{- include "ai-sparql-builder.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ai-sparql-builder.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      appProtocol: http
      protocol: TCP
      targetPort: http
      port: {{ .Values.service.port }}
{{- end }}
