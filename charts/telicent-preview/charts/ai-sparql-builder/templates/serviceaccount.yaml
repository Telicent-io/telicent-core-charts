{{- if and (.Values.enabled) (.Values.serviceAccount.create) -}}
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ include "ai-sparql-builder.serviceAccountName" . }}
  namespace: {{ include "ai-sparql-builder.namespace" . | quote }}
  labels:
    {{- include "ai-sparql-builder.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
