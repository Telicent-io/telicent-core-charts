# Telicent Preview *AI Sparql Builder* stand-alone chart

#
# @section Global Parameters
#
# @descStart
# Contains global parameters; these parameters are mirrored within the Telicent preview umbrella chart.
# Note: Only global parameters used within this chart will be listed below.
# @descEnd
global:
  ## Current available global image parameters: imageRegistry and imagePullSecrets
  ## Please, note that this will override the image parameters
  # @key global.imageRegistry Global image registry
  imageRegistry: ""
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  # @key global.imagePullSecrets Global registry secret names as an array
  imagePullSecrets: []

  # @key global.releaseNameTelicentCore Release name used during the Telicent Core chart installation. Note: ensure the value is correct, otherwise there will be no access to auth & graph
  # If installed through the parent-chart this value needs to reflect the name of the release name used when 'telicent-core' chart was installed.
  # If all applications were installed through sub-charts, leaving this value empty will provide the correct behavior.
  releaseNameTelicentCore: ""

  # @key global.appHostDomain Domain associated with Telicent application/ui services. This value cannot be changed after it is set
  appHostDomain: ""
  # @key global.apiHostDomain Domain associated with Telicent Api services. This value cannot be changed after it is set
  apiHostDomain: ""
  # @key global.authHostDomain Domain associated with Telicent authentication services, including OIDC providers. This value cannot be changed after it is set
  authHostDomain: ""

#
# @section ConfigMap Parameters
#
configMap:
  # @key configMap.existingEnvConfigMap Name of existing configmap containing *AI Sparql Builder* Environment Configuration
  # Note: When it's set it will disable configmap creation.
  existingEnvConfigMap: ""

#
# @section Common Parameters
#
# @key enabled Enable or disable the *AI Sparql Builder* component
enabled: true
# @key nameOverride String to partially override fullname (will maintain the release name)
nameOverride: ""
# @key fullnameOverride String to fully override the generated release name
fullnameOverride: ""
# @key namespaceOverride String to fully override all deployed resources namespace
namespaceOverride: ""
# @key commonLabels Add labels to all the deployed resources
commonLabels: {}

#
# @section Deployment Parameters
#
# @key replicas Number of *AI Sparql Builder* replicas to deploy
replicas: 1
# @key revisionHistoryLimit Number of controller revisions to keep
revisionHistoryLimit: 5

# @key annotations Add extra annotations to the deployment object
annotations: {}
# @key podLabels Add extra labels to the *AI Sparql Builder* pod
podLabels: {}
# @key podAnnotations Add extra annotations to the *AI Sparql Builder* pod
podAnnotations: {}
# @key extraEnvVars Array with extra environment variables to add to *AI Sparql Builder* pod
# Example:
# extraEnvVars:
# - name: FOO
#   value: instance
extraEnvVars: []
# @key command Override the default container command
# Example:
# command:
#   - /bin/sh
#   - -c
command: []
# @key args Override the default container args
# Example:
# args:
#   - --config=/etc/config.yaml
args: []
# @key extraVolumes Optionally specify extra list of additional volumes
extraVolumes: []
# @key extraVolumeMounts Optionally specify extra list of additional volumeMounts
extraVolumeMounts: []
# @key initContainers Add init containers to the pod
initContainers: []
# Example:
# sidecars:
# - name: your-image-name
#   image: your-image
#   ports:
#   - name: portname
#     containerPort: 1234
# @key sidecars Add sidecars to the pod
sidecars: []

#
# @section Deployment Image Parameters
#
image:
  # @key image.registry *AI Sparql Builder* image registry
  registry: "098669589541.dkr.ecr.eu-west-2.amazonaws.com"
  # @key image.repository *AI Sparql Builder* image name
  repository: "poc-sparql-chat-bot"
  # @key image.tag *AI Sparql Builder* image tag. If not set, a tag is generated using the appVersion
  tag: ""
  # @key image.pullPolicy *AI Sparql Builder* image pull policy
  pullPolicy: IfNotPresent
  # @key image.pullSecrets Specify registry secret names as an array
  pullSecrets: []

#
# @section Deployment Resources Parameters - Requests and Limits
#
# @key resources Resources for *AI Sparql Builder* containers
resources: {}
#  requests:
#    # @key resources.requests.cpu Set containers' CPU request
#    cpu: "250m"
#    # @key resources.requests.memory Set containers' memory request
#    memory: "1000Mi"
#  limits:
#    # @key resources.limits.cpu Set containers' CPU limit
#    cpu: "500m"
#    # @key resources.limits.memory Set containers' memory limit
#    memory: "2000Mi"

# @section configuration
# @descStart
# Application specific configuration settings
# @descEnd
configuration:
  CHATBOT_SPARQL_URL: ""
  CHATBOT_AUTH_SERVER_PUBLIC_URL: ""
  CHATBOT_OAUTH_CLIENT_ID: ""
  AUTH_SERVER_BASE_URL: ""
  AUTH_SERVER_ALLOW_HTTP: ""
  JWT_ISSUER: ""
  CHATBOT_LLM_PROVIDER: transformers
  CHATBOT_PROMPT_VARIANT: training
  CHATBOT_TRANSFORMERS_MODEL_PATH: /app/models
  CHATBOT_SPARQL_DATASET: knowledge

#
# @section Statefulset Security Context Parameters - Default Security Context
#
podSecurityContext:
  # @key podSecurityContext.runAsUser Set the provisioning pod's Security Context runAsUser User ID
  runAsUser: 185
  # @key podSecurityContext.runAsGroup Set the provisioning pod's Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key podSecurityContext.runAsNonRoot Set the provisioning pod's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key podSecurityContext.fsGroup Set the provisioning pod's Group ID for the mounted volumes' filesystem
  fsGroup: 185
  seccompProfile:
    # @key podSecurityContext.seccompProfile.type Set the provisioning pod's Security Context seccomp profile
    type: RuntimeDefault
containerSecurityContext:
  # @key containerSecurityContext.runAsUser Set containers' Security Context runAsUser User ID
  runAsUser: 185
  # @key containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup Group ID
  runAsGroup: 185
  # @key containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
  runAsNonRoot: true
  # @key containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
  allowPrivilegeEscalation: false
  capabilities:
    # @key containerSecurityContext.capabilities.drop List of capabilities to be dropped
    drop:
      - ALL
  seccompProfile:
    # @key containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
    type: RuntimeDefault

# @key affinity Affinity for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
affinity: {}
# @key nodeSelector Node labels for pod assignment
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
nodeSelector: {}
# @key tolerations Tolerations for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

#
# @section GPU Parameters
#
# @descStart
# Enable GPU support for *AI Sparql Builder*. When enabled, the deployment will request GPU resources
# and add the appropriate tolerations and runtime class for GPU scheduling.
# Supported GPU types: nvidia.com/gpu, amd.com/gpu
# @descEnd
gpu:
  # @key gpu.enabled Enable GPU support for the AI Sparql Builder
  enabled: true
  # @key gpu.type The GPU resource type to request (e.g. nvidia.com/gpu, amd.com/gpu)
  type: "nvidia.com/gpu"
  # @key gpu.count Number of GPUs to request
  count: 1
  # @key gpu.runtimeClassName Set the runtimeClassName for the pod (e.g. nvidia for NVIDIA GPU Operator). Leave empty to use the cluster default
  runtimeClassName: ""
  tolerations:
    # @key gpu.tolerations[0].key key for toleration to allow scheduling on GPU nodes
    - key: "nvidia.com/gpu"
      # @key gpu.tolerations[0].operator operator for the toleration to allow scheduling on GPU nodes
      operator: "Exists"
      # @key gpu.tolerations[0].effect effect for the toleration to allow scheduling on GPU nodes
      effect: "NoSchedule"
  # @key gpu.nodeAffinity Node affinity rule applied when gpu.enabled is true, to target nodes with GPU resources
  nodeAffinity:
    # @key gpu.nodeAffinity.labelKey Node label key used to identify GPU nodes
    labelKey: "nvidia.com/gpu"
    # @key gpu.nodeAffinity.operator Operator for the label expression (In, Exists, etc.)
    operator: "In"
    # @key gpu.nodeAffinity.values Label values to match for GPU node selection. Only used when operator is 'In'
    values: ["true"]

#
# @section Service Account Parameters
#
serviceAccount:
  # @key serviceAccount.create Specifies whether a service account should be created
  create: true
  # @key serviceAccount.name Name of the ServiceAccount to use. If not set, a name is generated using the fullname
  name: ""
  # @key serviceAccount.annotations Additional custom annotations for the ServiceAccount
  annotations: {}
  # @key serviceAccount.automount Automatically mount a ServiceAccount's API credentials
  automount: true

#
# @section Traffic Exposure Parameters
#
service:
  # @key service.name *AI Sparql Builder* service name. If not set, a name is generated using the fullname
  name: ""
  # @key service.port *AI Sparql Builder* service port
  port: 8080
  # @key service.type *AI Sparql Builder* service type
  type: ClusterIP

#
# @section Host(s) Core Parameters - Contains host information for applications deployed via *telicent-core* chart
#
# @descStart
# *AI Sparql Builder* interacts with applications deployed via *telicent-core* using their default service/serviceAccount and port.
# If either of those details changes, you can use this section to correctly refer to those applications.
# @descEnd
hostsCore:
  # @key hostsCore.enableAutoCorrect Prefix 'global.releaseNameTelicentCore' value to each host value. Alternatively, the host value will be used as it is, without any modification
  enableAutoCorrect: true
  # @key hostsCore.traefikProxy Traefik Proxy application default host value, as defined by 'service/serviceAccount:port'
  traefikProxy: "traefik-proxy:8080"
  # @key hostsCore.auth Auth application default host value, as defined by 'service/serviceAccount:port'
  auth: "auth:8080"
  # @key hostsCore.graph Graph application host value, as defined by 'service/serviceAccount:port'
  graph: "graph:8080"
