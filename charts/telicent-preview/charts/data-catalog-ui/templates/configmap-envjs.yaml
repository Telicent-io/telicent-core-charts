apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "data-catalog-ui.configMapName" . }}
  namespace: {{ include "data-catalog-ui.namespace" . }}
  labels:
  {{- include "data-catalog-ui.labels" . | nindent 4 }}

data:
  env-config.js: |
    const APP_DOMAIN = "https://{{ .Values.global.appHostDomain }}";
    const API_DOMAIN = "https://{{ .Values.global.apiHostDomain }}";
    window._env_ = window._env_ || {};
    window.featureFlags = window.featureFlags || {};
    window.featureFlags.FF_CATALOG_UPDATE = true;

    // General config
    window._env_.BETA = false;
    window._env_.APP_SWITCH_LIBRARY = [
        {
            id: "telicent-user-portal",
            name: "user portal",
            url: `${APP_DOMAIN}/user-portal`,
            icon: "/data-catalog/assets/icons/UserPortalLight.svg",
        },
        {
            id: "telicent-graph",
            name: "graph",
            url: `${APP_DOMAIN}/graph`,
            icon: "/data-catalog/assets/icons/GraphLight.svg",
        },
        {
            id: "telicent-search",
            name: "search",
            url: `${APP_DOMAIN}/search`,
            icon: "/data-catalog/assets/icons/SearchLight.svg",
        },
        // THIS is catalog
        // {
        //   id: "telicent-catalog",
        //   name: "catalog",
        //   url: `${APP_DOMAIN}/data-catalog`,
        //   icon: "./assets/icons/catalog.svg",
        // },
    ];


    // Apis
    window._env_.SIGN_OUT_URL = `${APP_DOMAIN}/oauth2/sign_out?rd=/oauth2/authorize`;
    window.USER_PORTAL_URL = `${APP_DOMAIN}/user-portal`;
    window._env_.ACCESS_API_URL = `${API_DOMAIN}/access`;
    window._env_.TRIPLE_STORE_URL = `${API_DOMAIN}/sparql`;
    window._env_.RDF_WRITE_API_URI = `${API_DOMAIN}/paperback`;

    // Apps - include if deploying
    // window._env_.GEO_APP_URL;
    window._env_.GRAPH_APP_URL = `${APP_DOMAIN}/graph`;
    window._env_.ACCESS_APP_URL = `${APP_DOMAIN}/access`;
    // window._env_.PARALOG_APP_URL;
  
    window.featureFlags = {
      FF_AI_TRANSLATE: false,
      FF_AUTH_V2: true,
    };
    
    window.AUTH_V2_CONFIG = {
      authServerUrl: "https://{{ .Values.global.authHostDomain }}",
      clientId: "{{ .Values.oauth.clientId }}",
      scope: "{{ .Values.oauth.scopes }}",
      redirectUri: "https://{{ .Values.global.appHostDomain }}/data-catalog/callback",
      popupRedirectUri: "https://{{ .Values.global.appHostDomain }}/data-catalog/auth-redirect-uri",
    };
