{{- if and (.Values.serviceAccount.create) (.Values.enabled) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "paperback-writer.serviceAccountName" . }}
  labels:
    {{- include "paperback-writer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
