{{- if and (.Values.enabled) (not .Values.existingSecretName) -}}
apiVersion: v1
kind: Secret

metadata:
  name: {{ include "paperback-writer.fullname" . }}-secret
  namespace: {{ include "paperback-writer.namespace" . | quote }}
  labels:
    {{- include "paperback-writer.labels" . | nindent 4 }}
data:
  SPARQL_USER: {{ .Values.configuration.sparqlUser | quote }}
  SPARQL_PWD: {{ .Values.configuration.sparqlPwd | quote }}
{{- end }}
