{{- if or (not .Values.existingCacertConfigmapName) (.Values.cacert) -}}
{{- if .Values.cacert -}}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "paperback-writer.fullname" . }}-cacert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperback-writer.labels" . | nindent 4 }}

data:
  ca.crt: {{- .Values.cacert | toYaml | indent 1 }}
{{- end -}}
{{- end -}}
{{- end -}}