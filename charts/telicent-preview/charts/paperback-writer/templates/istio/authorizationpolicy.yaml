{{- if .Values.enabled -}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "paperback-writer.fullname" .}}-ingress
spec:
  selector:
    matchLabels:
    {{ include "paperback-writer.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - {{ include "paperback-writer.ingressPrincipal" .}}
    to:
    - operation:
        methods:
        - POST
        - DELETE
        - GET
        paths:
        - /annotation
        - /annotation/*
        - /document-link
        - /document-link/*
        - /object-property
        - /object-property/*
        - /availability
        - /availability/*
        - /dcat/*
        - /dcterms/*
        - /vcard/*
        - /prov/*
        - /telicent/*
        - /ontology/*
        - /readiness/*
        - /readiness

{{- end -}}