# Pre-commit hooks for this repository.
# One-time setup: `brew install pre-commit && pre-commit install`
# The pre-commit workflow runs these same hooks on all pull requests.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # The metadata updater generates schema files with no trailing
        # newline, so leave them be to avoid the hooks fighting.
        exclude: values\.schema\.json$
      - id: check-merge-conflict
      - id: check-json
      - id: check-added-large-files
      - id: check-yaml
        # Helm templates are not valid YAML until rendered.
        exclude: (^|/)templates/
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        # Chart READMEs and CHANGELOGs are generated (metadata updater and
        # release-please), and starter chart docs are copied into new charts.
        exclude: ^(charts/|\.dev/starter-charts/|LICENSE\.md$)
  - repo: local
    hooks:
      - id: helm-lint
        name: Lint Helm charts
        entry: bash -c 'find charts -name Chart.yaml | sed "s|/Chart.yaml||" | sort | xargs helm lint'
        language: system
        files: ^charts/
        pass_filenames: false
      - id: helm-metadata-updater
        name: Run Helm metadata updater
        entry: .dev/metadata-updater.sh
        language: script
        files: ^charts/
        pass_filenames: false
